<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="ssoossh">
	<title>ssoossh</title>
<!-- A filled tile rather than a bare mark: the tab strip is light in one
	     browser and dark in the next, and a solid accent ground reads on both
	     without an internal prefers-color-scheme rule. The fill is the light
	     theme's accent token, the one hex in the app spelled out twice; the
	     corner radius is 22% of the edge, matching BrandMark's logo slot.

	     Geometry is shared with BrandMark.svelte: a 24x24 Lucide-style box,
	     translated 4 units in on each side of this 32 tile. -->
	<rect width="32" height="32" rx="7" fill="#255f62" />
	<g
		transform="translate(4 4)"
		fill="none"
		stroke="#ffffff"
		stroke-width="1.75"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<path d="M3.6 19 A6 6 0 0 1 4.2 9.6 A4.4 4.4 0 0 1 11.5 6 A4.1 4.1 0 0 1 17.8 8.8 A6.6 6.6 0 0 1 20.8 19 Z" />
		<polyline points="7 11.2 9.5 13.1 7 15" />
		<circle cx="13.2" cy="15" r="1.5" />
		<line x1="14.7" y1="15" x2="19.2" y2="15" />
		<line x1="17.6" y1="15" x2="17.6" y2="12.8" />
	</g>
</svg>
