# HSM fragment for docker-compose.direct.yml.
#
# Merge into config/ssoosshd.yaml. It replaces ssh_key: exactly one of
# ssh_key or hsm may be set, and setting both fails at startup.
#
# The PIN is generated by hsm-provision on first run and lives on the pin
# volume; pin_file is used rather than pin so it never appears in the
# config file or in the auditors' effective-configuration view.
hsm:
  module: /hsm/lib/libsofthsm2.so
  token_label: ssoossh-ca
  pin_file: /hsm/pin/pin
  key_label: ssoossh-ca
  key_id: "01"
