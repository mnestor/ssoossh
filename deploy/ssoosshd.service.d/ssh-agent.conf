# Drop-in for a server whose CA key lives in an ssh-agent (ssh_key_agent in
# ssoosshd.yaml) rather than in ssh_key, ssh_key_file or hsm. Install as:
#
#   /etc/systemd/system/ssoosshd.service.d/ssh-agent.conf
#
# A drop-in rather than an edit to ssoosshd.service: the base unit is
# installed for every server, and most of them read the key from config.
#
# It does not, and cannot, undo the base unit's WantedBy=multi-user.target.
# Run `systemctl disable ssoosshd` as well: with an agent-held key the
# server must not start unattended, because it refuses to boot until the
# key has been loaded by hand. See
# https://mnestor.github.io/ssoossh/operations/ssh-agent/

[Unit]
# After= for ordering, BindsTo= for lifetime. BindsTo is the one that
# matters: if the agent stops, ssoosshd stops with it, instead of staying
# up as a certificate authority that cannot issue certificates. ssoosshd
# reconnects to a restarted agent on its own, but an agent that came back
# empty gives it nothing to reconnect to.
After=ssoossh-agent.service
BindsTo=ssoossh-agent.service

[Service]
# The base unit sets ProtectSystem=strict, which makes the whole file
# system hierarchy read-only for this service. Connecting to a Unix socket
# needs write access to it, so without this the server cannot reach the
# agent at all. /run/ssoossh itself is created by ssoossh-agent.service's
# RuntimeDirectory=.
ReadWritePaths=/run/ssoossh
