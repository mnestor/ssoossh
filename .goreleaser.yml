---
version: 2

release:
  prerelease: auto

  # Complete when goreleaser finishes, but not yet visible. Every artifact a
  # release carries is produced by this file now, both platforms' installers
  # included (the macos-build and windows-build post-hooks), so the draft is
  # no longer waiting for a second job to attach anything. It is waiting for
  # a verdict.
  #
  # macos-verify in .github/workflows/build.yaml asks a Mac the questions
  # Apple's notary service does not: whether the BOM mkbom wrote matches the
  # one pkgbuild writes from the same payload, whether the package installs,
  # whether hostArchitectures still makes the Intel package decline on Apple
  # silicon. windows-verify asks a Windows host the equivalent: whether the
  # package wixl wrote installs and uninstalls silently, whether it is still
  # per-machine, and whether it still creates the ProgramData directory the
  # client's enforcement depends on. Between them they flip this draft when
  # the answers are right and delete it when they are not.
  #
  # The asymmetry is the whole reason for the draft. A deleted draft was
  # never visible to anyone. A published release that has to be revoked has
  # already sent a release email to every watcher, and that cannot be taken
  # back -- so the installers are checked while nobody has been told.
  #
  # Notarization still gates the build itself, well before any of this:
  # flatpkg.sh submits each installer to Apple, which extracts it and looks
  # for a signed Mach-O inside, so a package Apple will not open fails
  # build-most and no draft is created at all.
  #
  # use_existing_draft is what lets a re-run of a tag reuse the draft rather
  # than leave a second one behind.
  draft: true
  disable: false
  skip_upload: false
  include_meta: false
  mode: "replace"
  replace_existing_artifacts: true
  use_existing_draft: true
  replace_existing_draft: false

  # pam_ssoossh is not in this release and never will be: it is a separate
  # project in C (github.com/mnestor/ssoossh-pam) with its own tags, its own
  # platform matrix, and its own cadence. Said here because the two halves
  # are deployed together -- someone reading these notes to plan an upgrade
  # needs to know the host side is a second download, and where from --
  # and because a release page that lists only server and client artifacts
  # otherwise reads as though the module were missing from the build.
  #
  # /releases/latest is GitHub's own redirect to whatever the newest
  # non-prerelease is there, so this link does not go stale between the two
  # projects' tags.
  footer: |
    ## pam_ssoossh

    The PAM module is not built or released here. It ships from its own
    repository, [github.com/mnestor/ssoossh-pam](https://github.com/mnestor/ssoossh-pam),
    on its own cadence, and its packages -- the `-glibc-openssl3`,
    `-glibc-openssl1.1` and `-musl` builds -- are attached to its releases,
    not to this one.

    - **Packages:** [latest `pam_ssoossh` release](https://github.com/mnestor/ssoossh-pam/releases/latest)
    - **All versions:** [ssoossh-pam releases](https://github.com/mnestor/ssoossh-pam/releases)
    - **Installing it:** [Installing pam_ssoossh](https://mnestor.github.io/ssoossh/hosts/pam/install/)

  # The wire contract, published so the consumer no compiler can check has
  # something to pin. pam_ssoossh (github.com/mnestor/ssoossh-pam) is a
  # separate project in C: it shares no types with this repository, so the
  # only way it learns that a JSON field moved is by testing its own decoder
  # against these files.
  #
  # wire-contract.json goes up loose as well as inside the tarball, so a
  # consumer can read the contract version with one request instead of
  # downloading the fixtures to find it.
  #
  # The tarball is built by `make wire-contract-bundle`, which the release
  # workflow runs as an explicit step before this (.github/workflows/
  # build.yaml) -- deliberately not a before-hook, for the same reason the
  # web UI build is not one: it would make every local snapshot build
  # depend on it.
  #
  # It is staged in .wire-contract/ and not dist/ because goreleaser runs
  # with --clean, which empties dist/ before anything else happens: a bundle
  # written there by an earlier step is gone by the time this glob runs.
  extra_files:
    - glob: ./docs/wire-contract.json
    - glob: ./docs/openapi.yaml
    - glob: ./.wire-contract/ssoossh-wire-contract.tar.gz
    # Built by the macos-build post-hook, into the same dist/ every other
    # artifact lands in. Unlike the wire-contract bundle above this is safe
    # to glob out of dist/: --clean empties that directory before the build
    # phase, and the hook writes during it.
    - glob: ./dist/*.pkg
    # Built by the windows-build post-hook, same story as the .pkg above.
    - glob: ./dist/*.msi

before:
  hooks:
    - go mod tidy
    - ./scripts/gen-third-party-licenses.sh
    # Produces dist/ssoossh-archive-keyring.gpg for the ssoossh-release deb.
    - ./scripts/gen-repo-keyring.sh

# Note: the server embeds server/frontend/dist, and only a placeholder
# index.html is tracked. Building the real web UI is deliberately NOT a
# before-hook here — that would make every local `goreleaser build
# --snapshot` require a working node/pnpm environment. The release workflow
# runs `make frontend` as an explicit step before invoking goreleaser
# (.github/workflows/build-release.yaml); a snapshot built without it ships
# the placeholder, which is the intended behavior for a local build.

env:
  - CGO_ENABLED=0
  - GOFLAGS=-buildvcs=false
  # v1.0.0 is the NIST CMVP certified module for this toolchain; "latest"
  # would pick up a newer, uncertified one (see internal/fipsmode).
  - GOFIPS140=v1.0.0

builds:
  # The default server build: no cgo, so it links statically and has no libc
  # floor at all. That is possible because crypto11 is gated behind the
  # `hsm` tag (server/signer/hsmkeysource.go) and was the only cgo
  # dependency in ssoosshd -- sqlite is glebarez, which is pure Go. An HSM
  # is still reachable from this build through ssh-agent: `ssh-add -s
  # <module>` puts a PKCS#11 token behind an agent, and the vendor library
  # then loads in the agent's process rather than the signer's. See
  # https://mnestor.github.io/ssoossh/operations/ssh-agent/.
  #
  # No CC override and no zig: there is nothing to cross-link against.
  - id: server-linux-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    # -trimpath replaces the absolute build path in every path string the
    # linker records with the module path. It costs nothing, makes the
    # build reproducible from any checkout directory, and keeps the
    # builder's home directory out of the shipped binary.
    flags: &flags
      - -trimpath
      - -tags=nomsgpack
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: &build-ldflags |
      -X github.com/mnestor/ssoossh/internal/version.Version={{.Version}}
      -X github.com/mnestor/ssoossh/internal/version.Commit={{.Commit}}
      -X github.com/mnestor/ssoossh/internal/version.Date={{.Date}}
      -X github.com/mnestor/ssoossh/internal/version.BuiltBy={{- if index .Env "github" }}{{.Env.github.runner.name}}{{ else }}goreleaser{{ end }}

  # The PKCS#11 build: `-tags=hsm` compiles server/signer/hsmkeysource.go,
  # which binds libpkcs11 through crypto11 and dlopen()s a vendor module at
  # runtime. That needs cgo, which means dynamic linking and a glibc floor,
  # which is the whole reason it is a separate artifact rather than the
  # default.
  #
  # Only for operators who need the module in this process. Everyone else,
  # including everyone using SoftHSM2 and most people with a real HSM,
  # wants the default build plus ssh_key_agent.
  #
  # glibc 2.28 is kept deliberately low (RHEL 8, Ubuntu 20.04, Debian 11+).
  # Raising it removes compatibility without enabling anything: Go needs no
  # newer symbols, and zig pins the floor with one flag either way.
  #
  # No musl counterpart yet. Mounting a musl-built module needs a musl
  # image carrying libstdc++, and Dockerfile.musl never could -- alpine:3.20
  # has no libstdc++, so the documented recipe could not have worked. See
  # docs/proposals/hsm-cloud-readiness.md.
  - id: server-linux-pkcs11-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    flags:
      - -trimpath
      - -tags=nomsgpack,hsm
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu.2.28{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu.2.28{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: linux-build
    binary: &name "ssoossh"
    dir: &dir ./cmd/ssoossh
    flags: *flags
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: windows-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags
    hooks:
      # The Windows installer, assembled here rather than on a Windows
      # runner, for the same two reasons the macOS package is (see below).
      # It can: wixl (msitools) reads WiX v3 source and writes the MSI from
      # this container, with no wine, no .NET and no Windows SDK. And it
      # must, if the package is to be a release artifact like any other:
      # the checksum pipe globs dist/*.msi, and a build hook is the last
      # point at which the file exists in time for it.
      #
      # This runs for both windows architectures and produces a package for
      # one: wixl rejects arm64, so windows/arm64 ships the zip alone. The
      # script says so and exits 0 rather than failing the build.
      #
      # No signing step yet. The package is unsigned, deliberately and
      # temporarily -- Azure Artifact Signing driven by jsign is the
      # decision, and when it lands it adds one hook line above this one
      # (the exe, before the MSI embeds a copy of it) and one line inside
      # msi.sh (the MSI, after). See the header of msi.sh and
      # docs/proposals/enhancements.md.
      post:
        - cmd: >-
            packaging/windows/msi.sh
            --binary "{{ .Path }}"
            --version "{{ .Version }}"
            --goarch "{{ .Arch }}"
            --outdir dist

  - id: macos-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - darwin
    # goarm:
    #   - "7"
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags
    hooks:
      # amd64/arm64 ship as separate binaries (no universal_binaries/lipo
      # merge), so each is quill-signed and notarized and then wrapped in
      # its own installer package as soon as it's built.
      #
      # flatpkg.sh runs here, and not on a macOS runner afterwards, for two
      # reasons. It can: a flat package is a xar archive with a fixed
      # layout, and bomutils, bsdcpio, xar and rcodesign write and sign
      # every part of it from this container. And it must, if the package is
      # to be a release artifact like any other: the checksum pipe below
      # globs dist/*.pkg, and a build hook is the last point at which the
      # file exists in time for it. An `after:` hook would run past it.
      #
      # Ordering inside this list matters. quill has to sign the Mach-O
      # first, because the notary service rejects a package whose payload
      # carries no Developer ID signature, and flatpkg.sh refuses to build
      # one rather than find that out from Apple.
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}"
        - cmd: >-
            packaging/macos/flatpkg.sh
            --binary "{{ .Path }}"
            --version "{{ .Version }}"
            --goarch "{{ .Arch }}"
            --outdir dist

nfpms:
  - id: client
    package_name: ssoossh-client
    file_name_template: 'ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: &license "MIT"
    maintainer: &maintainer "Mike Nestor"
    homepage: &website "https://github.com/mnestor/ssoossh"
    description: "client for ssoosshd to retrieve and manage ssh certificates"
    ids:
      - linux-build
    # /usr/bin, not /usr/local/bin. The FHS reserves /usr/local for software
    # the package manager does not manage, so a distro package writing there
    # is a defect on its own -- but the concrete failure is sshd's: it
    # refuses an AuthorizedPrincipalsCommand whose path is writable by group
    # or other, and /usr/local/bin is root:staff 2775 on Debian and Ubuntu.
    # Every certificate login on those hosts failed with the documented
    # configuration. hosts/sshd-trust.md has asserted /usr/bin all along.
    bindir: /usr/bin
    scripts:
      preinstall: packaging/linux/client-preinstall.sh
      postremove: packaging/linux/client-postremove.sh
    formats: &nfpmFormats
      - rpm
      - deb
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: client/config/defaults.yaml
        dst: /etc/ssoossh/ssoossh.yaml
        type: "config|noreplace"
      # Compatibility shim for the move off /usr/local/bin, to be removed
      # two releases after the one that introduced it. Anything already
      # naming the old path -- an sshd_config line, a cron entry, a unit --
      # keeps working across the upgrade.
      #
      # It is a shim, not a supported path: on Debian and Ubuntu the symlink
      # sits in the same group-writable directory as before, so sshd still
      # refuses to run it. An sshd_config pointing here has to move to
      # /usr/bin to start working, which is the whole point of the change.
      - src: /usr/bin/ssoossh
        dst: /usr/local/bin/ssoossh
        type: symlink
      # Host integration, shipped inert. Installing the client must not
      # change how a machine accepts or makes SSH connections, so both
      # drop-ins are fully commented and carry the two lines to uncomment.
      # They are config|noreplace, so an operator who activates them keeps
      # their edits across upgrades.
      - src: packaging/linux/sshd_config.d/50-ssoossh.conf
        dst: /etc/ssh/sshd_config.d/50-ssoossh.conf
        type: "config|noreplace"
      - src: packaging/linux/ssh_config.d/50-ssoossh.conf
        dst: /etc/ssh/ssh_config.d/50-ssoossh.conf
        type: "config|noreplace"
      # The mapping file, owned by the lookup account's group and readable
      # only by root and it. The group exists by the time this lands because
      # client-preinstall.sh runs first -- see that script for why the hook
      # cannot be postinstall.
      - src: packaging/linux/principals.yaml
        dst: /etc/ssoossh/principals.yaml
        type: "config|noreplace"
        file_info:
          owner: root
          group: ssoossh-principals
          mode: 0640
      - src: LICENSE
        dst: /usr/share/doc/ssoossh-client/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoossh-client/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoossh-client/THIRD-PARTY-LICENSES.md
      # Glob, not the root page alone: gendocs writes one page per cobra
      # subcommand, and shipping only ssoossh.1 left `man ssoossh-ssh-login`
      # failing on an installed host for a page this repo generates and
      # commits. The pattern picks up a new subcommand's page on its own.
      #
      # ssoossh*.1 is safe where ssoossh*.5 would not be: every ssoosshd
      # page name also starts with "ssoossh", so the config pages stay
      # listed explicitly and each package owns only its own.
      - src: docs/man/ssoossh*.1
        dst: /usr/share/man/man1/
      - src: docs/man/ssoossh.yaml.5
        dst: /usr/share/man/man5/ssoossh.yaml.5

  - id: server
    package_name: ssoosshd
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate"
    ids:
      - server-linux-build
    # /usr/sbin for the same reason the client moved to /usr/bin: a package
    # manager's files do not belong under /usr/local. See the client package
    # above, and the compatibility symlink below.
    bindir: /usr/sbin
    scripts:
      preinstall: packaging/linux/server-preinstall.sh
      postinstall: packaging/linux/server-postinstall.sh
      preremove: packaging/linux/server-preremove.sh
      postremove: packaging/linux/server-postremove.sh
    # apk as well as deb and rpm, from this one binary. Package format is
    # about the OS's package manager, not its libc, and a static binary
    # runs on Alpine as readily as on Debian -- so the separate musl build
    # that used to source the apk is gone.
    formats:
      - rpm
      - deb
      - apk
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      # Compatibility shim for the move off /usr/local/sbin. See the client
      # package for the removal schedule.
      - src: /usr/sbin/ssoosshd
        dst: /usr/local/sbin/ssoosshd
        type: symlink
      # The units already existed in deploy/ and were referenced by the
      # install docs; nothing shipped them. Installed, deliberately not
      # enabled: ssoosshd will not start without a configured CA key and
      # identity provider, so enabling it here would fail loudly on every
      # fresh install. server-postinstall.sh reloads systemd and stops there.
      #
      # Modes are explicit rather than inherited from the working tree: git
      # records only the executable bit, so a unit's mode on disk is the
      # builder's umask, and a group-writable unit file is a unit anyone in
      # that group can rewrite.
      - src: deploy/ssoosshd.service
        dst: /usr/lib/systemd/system/ssoosshd.service
        file_info:
          mode: 0644
      - src: deploy/ssoossh-agent.service
        dst: /usr/lib/systemd/system/ssoossh-agent.service
        file_info:
          mode: 0644
      # The agent drop-in is for the minority of servers whose CA key lives
      # in an ssh-agent, and it changes the unit's lifetime (BindsTo), so it
      # ships as an example to copy rather than into /etc where it would be
      # active. Its own header says where it goes.
      - src: deploy/ssoosshd.service.d/ssh-agent.conf
        dst: /usr/share/doc/ssoosshd/examples/ssoosshd.service.d/ssh-agent.conf
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # https://mnestor.github.io/ssoossh/operations/email-notifications/). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

  # Separate package name, not a variant of ssoosshd: both install the same
  # /usr/local/sbin/ssoosshd, so they cannot be co-installed. conflicts and
  # replaces make the package manager say that plainly instead of letting
  # two packages fight over one path, and provides lets anything depending
  # on ssoosshd be satisfied by either.
  - id: server-pkcs11
    package_name: ssoosshd-pkcs11
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_pkcs11{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate (PKCS#11/HSM support, dynamically linked)"
    ids:
      - server-linux-pkcs11-build
    bindir: /usr/sbin
    scripts:
      preinstall: packaging/linux/server-preinstall.sh
      postinstall: packaging/linux/server-postinstall.sh
      preremove: packaging/linux/server-preremove.sh
      postremove: packaging/linux/server-postremove.sh
    formats: *nfpmFormats
    conflicts:
      - ssoosshd
    replaces:
      - ssoosshd
    provides:
      - ssoosshd
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      # Compatibility shim for the move off /usr/local/sbin. See the client
      # package for the removal schedule.
      - src: /usr/sbin/ssoosshd
        dst: /usr/local/sbin/ssoosshd
        type: symlink
      # The units already existed in deploy/ and were referenced by the
      # install docs; nothing shipped them. Installed, deliberately not
      # enabled: ssoosshd will not start without a configured CA key and
      # identity provider, so enabling it here would fail loudly on every
      # fresh install. server-postinstall.sh reloads systemd and stops there.
      #
      # Modes are explicit rather than inherited from the working tree: git
      # records only the executable bit, so a unit's mode on disk is the
      # builder's umask, and a group-writable unit file is a unit anyone in
      # that group can rewrite.
      - src: deploy/ssoosshd.service
        dst: /usr/lib/systemd/system/ssoosshd.service
        file_info:
          mode: 0644
      - src: deploy/ssoossh-agent.service
        dst: /usr/lib/systemd/system/ssoossh-agent.service
        file_info:
          mode: 0644
      # The agent drop-in is for the minority of servers whose CA key lives
      # in an ssh-agent, and it changes the unit's lifetime (BindsTo), so it
      # ships as an example to copy rather than into /etc where it would be
      # active. Its own header says where it goes.
      - src: deploy/ssoosshd.service.d/ssh-agent.conf
        dst: /usr/share/doc/ssoosshd/examples/ssoosshd.service.d/ssh-agent.conf
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # https://mnestor.github.io/ssoossh/operations/email-notifications/). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

  # The two halves of `dnf install ssoossh-client` working at all: a package
  # whose only job is to install the repository definition and the key that
  # verifies it. This is the Docker/Grafana/HashiCorp pattern.
  #
  # Split by format rather than one package shipping both files, because the
  # files are not interchangeable -- a deb has no business writing
  # /etc/yum.repos.d, and the keyring is armoured for rpm and dearmoured for
  # apt. The package NAME is the same on both, so the documented install
  # line does not have to branch on the distribution.
  #
  # meta: true -- these carry no binary at all.
  #
  # Note the bootstrap: this package cannot be verified by the repository it
  # configures, because installing it is what makes that repository exist.
  # It is downloaded and installed directly, and the key's fingerprint is
  # published for checking out of band.
  - id: release-rpm
    package_name: ssoossh-release
    file_name_template: 'ssoossh-release_{{ .Version }}_noarch'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "ssoossh repository configuration and signing key"
    meta: true
    formats:
      - rpm
    rpm:
      signature:
        key_file: private.pgp
    contents:
      - src: packaging/linux/repo/ssoossh.repo
        dst: /etc/yum.repos.d/ssoossh.repo
        type: "config|noreplace"
      # Armoured: this is the form gpgkey=file:// expects.
      - src: gpg-public.asc
        dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-ssoossh
        file_info:
          mode: 0644

  - id: release-deb
    package_name: ssoossh-release
    file_name_template: 'ssoossh-release_{{ .Version }}_all'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "ssoossh repository configuration and signing key"
    meta: true
    formats:
      - deb
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: packaging/linux/repo/ssoossh.sources
        dst: /etc/apt/sources.list.d/ssoossh.sources
        type: "config|noreplace"
      # Dearmoured by scripts/gen-repo-keyring.sh in the before hooks. Mode
      # 0644 is required, not cosmetic: apt reads it as the _apt user, and a
      # keyring it cannot read fails the repository rather than falling back.
      - src: dist/ssoossh-archive-keyring.gpg
        dst: /usr/share/keyrings/ssoossh-archive-keyring.gpg
        file_info:
          mode: 0644

# The installers are not produced by a goreleaser pipe -- they come from
# the macos-build and windows-build post-hooks above -- so they are named
# here explicitly to be hashed. Everything else in this list is a pipe's own
# artifact and is covered without being named.
#
# This is what removed a hand-written pass over the release's checksums file
# in .github/workflows/build.yaml. The packages used to be built on a
# separate macOS runner after goreleaser had finished and uploaded its
# checksums, so that job re-downloaded the file, appended the .pkg lines and
# re-uploaded it. Nothing does that now.
#
# name_template is left at its default, which the workflow's older steps
# already matched: {{ .ProjectName }}_{{ .Version }}_checksums.txt.
checksum:
  extra_files:
    - glob: ./dist/*.pkg
    - glob: ./dist/*.msi

archives:
  - id: linux-clients-archives
    ids:
      - linux-build
    name_template: &client_archive_name "ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: &client_archive_files
      - src: client/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page, not just the client's: an archive owns no filesystem
      # paths, so the co-installation constraint that splits the .deb/.rpm
      # contents below does not apply here, and a tarball that documents
      # the whole tool is more useful than one that documents half of it.
      - docs/man/*

  - id: linux-server-archives
    ids:
      - server-linux-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - id: linux-server-pkcs11-archives
    ids:
      - server-linux-pkcs11-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_pkcs11"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - formats: ["zip"]
    id: windows-archives
    ids:
      - windows-build
      - macos-build
    files: *client_archive_files
    name_template: *client_archive_name

# Builds and pushes ghcr.io/mnestor/ssoossh-server, one multi-arch (linux/amd64 +
# linux/arm64) manifest per variant, straight from the server-linux-build /
# server-linux-pkcs11-build binaries above -- no separate compile step, so
# the image gets the same -X version.Version/Commit/Date/BuiltBy stamp
# (see internal/version) as every other release artifact for free. `docker
# buildx build --platform ... --push` runs once per entry
# (build.yaml sets up a docker-container buildx builder and a GHCR login
# first); a single entry with two `platforms:` builds and combines both
# architectures into one manifest itself, no separate docker_manifests:
# step needed. Like the rest of this file's publish steps, a snapshot
# build (any push that isn't a v* tag) builds these images locally to
# catch a broken Dockerfile but never pushes -- goreleaser skips its whole
# publish phase in --snapshot mode.
#
# The only tag pushed here is the commit sha, and that is deliberate. This
# pipe runs in build-most, before any Mac has been asked whether it accepts
# the release's macOS installers, so a version tag written here would put
# ghcr.io/mnestor/ssoossh-server:1.4.0 in front of the world for a release
# that macos-verify may still reject. build.yaml's publish job copies these
# to their version tags (docker buildx imagetools create, a server-side
# manifest copy by digest) at the same moment it publishes the release
# draft, so a version tag exists only for a release that does.
#
# This was briefly moved into these templates, on the reasoning that
# goreleaser now builds every artifact including the .pkg installers and so
# nothing arrives afterwards. That is true and it is not the point: what
# arrives afterwards is not an artifact, it is a verdict. Publishing is
# irreversible in a way building is not -- a release emails every watcher,
# a version tag gets pulled by whatever tracks it -- so the rule is that
# nothing acquires a public name until the last check has passed, however
# complete the artifacts already are. See docs in build.yaml's publish job.
#
# What stays behind on a failed release is the sha tag, which is fine: it
# is immutable, it names the commit that built it, and it never claimed to
# be a release. Nothing is deleted, so no delete:packages credential is
# needed anywhere in this pipeline.
#
# The publish job writes X.Y and X alongside the exact version, so v1.2.4
# is reachable as 1.2.4, 1.2 and 1. Both floating tags move only for a
# final release that is the newest in its series, which is what keeps a
# release candidate, or a re-run of an older tag, from becoming what `1.2`
# means. A goreleaser template cannot see which tags have shipped, which is
# the second reason this lives in a job.
#
# The floating tags skip prereleases, so v1.3.0-rc1 is reachable as
# 1.3.0-rc1 and nothing else. They do NOT check whether this tag is the
# newest one shipped in its series, and that is a deliberate assumption
# rather than an oversight: releases only ever go forward within a major
# line. Two major lines may be alive at once (a 1.x and a 2.x), which these
# tags handle on their own since X and X.Y are per-line. But re-running an
# older tag inside a live line -- shipping v1.2.4 after v1.2.7 -- would move
# 1.2 and 1 backwards onto it, silently. A goreleaser tag template cannot
# see which tags have shipped, so if that policy ever changes this has to
# move back out into a job that can ask the repository.
#
# `latest` is not published and is not going to be. Every tag this project
# pushes names some piece of a version, so pinning one is a statement about
# how far the operator is willing to be moved. `latest` is the tag that
# makes no such statement, and there is no upper bound on where it goes.
#
# dockers_v2 (not the older dockers:/docker_manifests:) is what's current
# in goreleaser v2; see https://goreleaser.com/customization/package/dockers_v2/.
# sbom is off: a cosign/syft SBOM attachment isn't set up in this project's
# release pipeline yet, and dockers_v2 defaults it to on.
dockers_v2:
  - id: docker-static
    ids:
      - server-linux-build
    dockerfile: Dockerfile
    images:
      - ghcr.io/mnestor/ssoossh-server
    tags:
      - "sha-{{ .FullCommit }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # The binary itself is go:embed-only; this is the same reference copy
    # of the mail templates the old from-source Dockerfile shipped (see
    # https://mnestor.github.io/ssoossh/operations/email-notifications/) placed into the docker build
    # context so Dockerfile can COPY it.
    extra_files:
      - server/resources/mail
    labels:
      org.opencontainers.image.source: "https://github.com/mnestor/ssoossh"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.licenses: "MIT"
    sbom: false

  - id: docker-pkcs11
    ids:
      - server-linux-pkcs11-build
    dockerfile: Dockerfile.pkcs11
    images:
      - ghcr.io/mnestor/ssoossh-server
    # Distinct from the default entry's tag: both entries push to the same
    # image, so sharing one sha tag would have the second overwrite the
    # first.
    tags:
      - "sha-{{ .FullCommit }}-pkcs11"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - server/resources/mail
    labels:
      org.opencontainers.image.source: "https://github.com/mnestor/ssoossh"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.licenses: "MIT"
    sbom: false
