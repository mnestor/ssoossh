---
version: 2

release:
  prerelease: auto
  draft: false
  disable: false
  skip_upload: false
  include_meta: false
  mode: "replace"
  replace_existing_artifacts: true
  use_existing_draft: true
  replace_existing_draft: false

before:
  hooks:
    - go mod tidy
    - ./scripts/gen-third-party-licenses.sh

# Note: the server embeds server/frontend/dist, and only a placeholder
# index.html is tracked. Building the real web UI is deliberately NOT a
# before-hook here — that would make every local `goreleaser build
# --snapshot` require a working node/pnpm environment. The release workflow
# runs `make frontend` as an explicit step before invoking goreleaser
# (.github/workflows/build-release.yaml); a snapshot built without it ships
# the placeholder, which is the intended behavior for a local build.

env:
  - CGO_ENABLED=0
  - GOFLAGS=-buildvcs=false
  # v1.0.0 is the NIST CMVP certified module for this toolchain; "latest"
  # would pick up a newer, uncertified one (see internal/fipsmode).
  - GOFIPS140=v1.0.0

builds:
  - id: server-linux-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    flags: &flags
      - -tags=nomsgpack
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu.2.28{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu.2.28{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: &build-ldflags |
      -X github.com/mnestor/ssoossh/internal/version.Version={{.Version}}
      -X github.com/mnestor/ssoossh/internal/version.Commit={{.Commit}}
      -X github.com/mnestor/ssoossh/internal/version.Date={{.Date}}
      -X github.com/mnestor/ssoossh/internal/version.BuiltBy={{- if index .Env "github" }}{{.Env.github.runner.name}}{{ else }}goreleaser{{ end }}

  # -dynamic is load-bearing, and so is the zig version behind it: a static
  # musl binary's dlopen is a stub that always answers "Dynamic loading not
  # supported", which would leave the Alpine packages unable to load a
  # PKCS#11 module at all. zig cc only honors -dynamic on musl targets from
  # 0.16 on; older zig accepted the flag and linked libc statically anyway,
  # silently. build.yaml re-checks the linkage on every release.
  - id: server-linux-musl-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    flags: *flags
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-musl -dynamic{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-musl -dynamic{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: linux-build
    binary: &name "ssoossh"
    dir: &dir ./cmd/ssoossh
    flags: *flags
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: windows-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: macos-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - darwin
    # goarm:
    #   - "7"
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags
    # env:
    #   # complex, templated envs (v1.14+):
    #   - >-
    #     {{- if eq .Arch "amd64"}}CC=o64-clang{{- end }}
    #     {{- if eq .Arch "arm64"}}CC=aarch64-apple-darwin20.2-clang{{- end }}
    hooks:
      # amd64/arm64 ship as separate binaries (no universal_binaries/lipo
      # merge), so each is quill-signed and packaged into its own DMG as
      # soon as it's built.
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}"

nfpms:
  - id: client
    package_name: ssoossh-client
    file_name_template: 'ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: &license "MIT"
    maintainer: &maintainer "Mike Nestor"
    homepage: &website "https://github.com/mnestor/ssoossh"
    description: "client for ssoosshd to retrieve and manage ssh certificates"
    ids:
      - linux-build
    bindir: /usr/local/bin
    formats: &nfpmFormats
      - rpm
      - deb
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: client/config/defaults.yaml
        dst: /etc/ssoossh/ssoossh.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoossh-client/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoossh-client/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoossh-client/THIRD-PARTY-LICENSES.md
      # Glob, not the root page alone: gendocs writes one page per cobra
      # subcommand, and shipping only ssoossh.1 left `man ssoossh-ssh-login`
      # failing on an installed host for a page this repo generates and
      # commits. The pattern picks up a new subcommand's page on its own.
      #
      # ssoossh*.1 is safe where ssoossh*.5 would not be: every ssoosshd
      # page name also starts with "ssoossh", so the config pages stay
      # listed explicitly and each package owns only its own.
      - src: docs/man/ssoossh*.1
        dst: /usr/share/man/man1/
      - src: docs/man/ssoossh.yaml.5
        dst: /usr/share/man/man5/ssoossh.yaml.5

  - id: server
    package_name: ssoosshd
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate"
    ids:
      - server-linux-build
    bindir: /usr/local/sbin
    formats: *nfpmFormats
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # docs/operations/email-notifications.md). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

  - id: server-musl
    package_name: ssoosshd
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_musl{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate (musl, Alpine Linux)"
    ids:
      - server-linux-musl-build
    bindir: /usr/local/sbin
    formats:
      - apk
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # docs/operations/email-notifications.md). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

archives:
  - id: linux-clients-archives
    ids:
      - linux-build
    name_template: &client_archive_name "ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: &client_archive_files
      - src: client/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page, not just the client's: an archive owns no filesystem
      # paths, so the co-installation constraint that splits the .deb/.rpm
      # contents below does not apply here, and a tarball that documents
      # the whole tool is more useful than one that documents half of it.
      - docs/man/*

  - id: linux-server-archives
    ids:
      - server-linux-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - id: linux-server-musl-archives
    ids:
      - server-linux-musl-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_musl"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - formats: ["zip"]
    id: windows-archives
    ids:
      - windows-build
      - macos-build
    files: *client_archive_files
    name_template: *client_archive_name
