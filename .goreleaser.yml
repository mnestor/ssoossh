---
version: 2

release:
  prerelease: auto
  draft: false
  disable: false
  skip_upload: false
  include_meta: false
  mode: "replace"
  replace_existing_artifacts: true
  use_existing_draft: true
  replace_existing_draft: false

before:
  hooks:
    - go mod tidy
    - ./scripts/gen-third-party-licenses.sh

# Note: the server embeds server/frontend/dist, and only a placeholder
# index.html is tracked. Building the real web UI is deliberately NOT a
# before-hook here — that would make every local `goreleaser build
# --snapshot` require a working node/pnpm environment. The release workflow
# runs `make frontend` as an explicit step before invoking goreleaser
# (.github/workflows/build-release.yaml); a snapshot built without it ships
# the placeholder, which is the intended behavior for a local build.

env:
  - CGO_ENABLED=0
  - GOFLAGS=-buildvcs=false
  # v1.0.0 is the NIST CMVP certified module for this toolchain; "latest"
  # would pick up a newer, uncertified one (see internal/fipsmode).
  - GOFIPS140=v1.0.0

builds:
  - id: server-linux-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    # -trimpath replaces the absolute build path in every path string the
    # linker records with the module path. It costs nothing, makes the
    # build reproducible from any checkout directory, and takes ~66 KB off
    # the PAM module's .gopclntab, which is mapped into sudo.
    flags: &flags
      - -trimpath
      - -tags=nomsgpack
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu.2.28{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu.2.28{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: &build-ldflags |
      -X github.com/mnestor/ssoossh/internal/version.Version={{.Version}}
      -X github.com/mnestor/ssoossh/internal/version.Commit={{.Commit}}
      -X github.com/mnestor/ssoossh/internal/version.Date={{.Date}}
      -X github.com/mnestor/ssoossh/internal/version.BuiltBy={{- if index .Env "github" }}{{.Env.github.runner.name}}{{ else }}goreleaser{{ end }}

  # -dynamic is load-bearing, and so is the zig version behind it: a static
  # musl binary's dlopen is a stub that always answers "Dynamic loading not
  # supported", which would leave the Alpine packages unable to load a
  # PKCS#11 module at all. zig cc only honors -dynamic on musl targets from
  # 0.16 on; older zig accepted the flag and linked libc statically anyway,
  # silently. build.yaml re-checks the linkage on every release.
  - id: server-linux-musl-build
    binary: ssoosshd
    dir: ./cmd/ssoosshd
    flags: *flags
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-musl -dynamic{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-musl -dynamic{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  # zig cc cross-compiles both PAM targets from a single amd64 host against
  # the same glibc floors an old centos7 (amd64) / amazonlinux2 (arm64)
  # build container used to pin -- verified by objdump/readelf: the
  # resulting .so's max GLIBC_x.y symbol version matches (2.17 amd64,
  # <= 2.26 arm64). No native arm64 runner and no QEMU/binfmt needed.
  #
  # security/*.h is arch-independent (no per-arch #ifdef content), so one
  # copy of the headers, installed by Dockerfile.runner /
  # build-env-for-pam.sh into /opt/pam-include, serves both targets. Kept
  # out of /usr/include itself -- zig cc ships its own versioned glibc
  # headers for the pinned floor, and pointing CGO_CFLAGS at the real
  # /usr/include instead would pull the host's glibc headers in alongside
  # them and collide (__GLIBC_MINOR__ redefined, etc).
  #
  # CGO_LDFLAGS's -L points at the multiarch lib dir the same install put
  # the (foreign-arch, for arm64) libpam0g-dev into. Both the -dev headers
  # and the matching libpam0g runtime .so must be present -- a headers-only
  # install makes the linker silently fall back to statically linking
  # libpam.a instead of dynamically linking libpam.so.0, which is why
  # build.yaml's post-build check verifies NEEDED, not just that the build
  # succeeded.
  - id: linux-pam-build-amd64
    binary: pam_ssoossh
    dir: ./pam_ssoossh/
    buildmode: "c-shared"
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
      - -tags=nomsgpack,pam
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu.2.17
      - CGO_CFLAGS=-I/opt/pam-include
      - CGO_LDFLAGS=-L/usr/lib/x86_64-linux-gnu
    ldflags: *build-ldflags

  - id: linux-pam-build-arm64
    binary: pam_ssoossh
    dir: ./pam_ssoossh/
    buildmode: "c-shared"
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
      - -tags=nomsgpack,pam
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu.2.26
      - CGO_CFLAGS=-I/opt/pam-include
      - CGO_LDFLAGS=-L/usr/lib/aarch64-linux-gnu
    ldflags: *build-ldflags

  - id: linux-build
    binary: &name "ssoossh"
    dir: &dir ./cmd/ssoossh
    flags: *flags
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: windows-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: macos-build
    binary: *name
    dir: *dir
    flags: *flags
    goos:
      - darwin
    # goarm:
    #   - "7"
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags
    # env:
    #   # complex, templated envs (v1.14+):
    #   - >-
    #     {{- if eq .Arch "amd64"}}CC=o64-clang{{- end }}
    #     {{- if eq .Arch "arm64"}}CC=aarch64-apple-darwin20.2-clang{{- end }}
    hooks:
      # amd64/arm64 ship as separate binaries (no universal_binaries/lipo
      # merge), so each is quill-signed and packaged into its own DMG as
      # soon as it's built.
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}"

nfpms:
  - id: client
    package_name: ssoossh-client
    file_name_template: 'ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: &license "MIT"
    maintainer: &maintainer "Mike Nestor"
    homepage: &website "https://github.com/mnestor/ssoossh"
    description: "client for ssoosshd to retrieve and manage ssh certificates"
    ids:
      - linux-build
    bindir: /usr/local/bin
    formats: &nfpmFormats
      - rpm
      - deb
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: client/config/defaults.yaml
        dst: /etc/ssoossh/ssoossh.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoossh-client/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoossh-client/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoossh-client/THIRD-PARTY-LICENSES.md
      # Glob, not the root page alone: gendocs writes one page per cobra
      # subcommand, and shipping only ssoossh.1 left `man ssoossh-ssh-login`
      # failing on an installed host for a page this repo generates and
      # commits. The pattern picks up a new subcommand's page on its own.
      #
      # ssoossh*.1 is safe where ssoossh*.5 would not be: every ssoosshd
      # page name also starts with "ssoossh", so the config pages stay
      # listed explicitly and each package owns only its own.
      - src: docs/man/ssoossh*.1
        dst: /usr/share/man/man1/
      - src: docs/man/ssoossh.yaml.5
        dst: /usr/share/man/man5/ssoossh.yaml.5

  - id: server
    package_name: ssoosshd
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate"
    ids:
      - server-linux-build
    bindir: /usr/local/sbin
    formats: *nfpmFormats
    rpm:
      signature:
        key_file: private.pgp
    deb:
      signature:
        key_file: private.pgp
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # docs/operations/email-notifications.md). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

  - id: server-musl
    package_name: ssoosshd
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_musl{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: "server to authorize and sign ssh public keys with a certificate (musl, Alpine Linux)"
    ids:
      - server-linux-musl-build
    bindir: /usr/local/sbin
    formats:
      - apk
    contents:
      - src: server/config/defaults.yaml
        dst: /etc/ssoossh/ssoosshd.yaml
        type: "config|noreplace"
      - src: LICENSE
        dst: /usr/share/doc/ssoosshd/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoosshd/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoosshd/THIRD-PARTY-LICENSES.md
      # One page per cobra subcommand — see the client package above for
      # why this is a glob and why the .5 page is not.
      - src: docs/man/ssoosshd*.8
        dst: /usr/share/man/man8/
      - src: docs/man/ssoosshd.yaml.5
        dst: /usr/share/man/man5/ssoosshd.yaml.5
      # The mail notification templates the binary embeds, shipped as
      # reference copies to start an override from (see
      # docs/operations/email-notifications.md). /usr/share, deliberately not an
      # active mail.template_dir: a file installed into an override
      # directory IS an override, and an upgrade would then either destroy
      # the operator's edits or — with config|noreplace — pin them to a
      # stale template forever. Stale is not cosmetic here: the renderer
      # refuses an override directory holding a template for a
      # notification kind it does not recognize, so a kind dropped in a
      # later release would stop the server from starting.
      - src: server/resources/mail/*.tmpl
        dst: /usr/share/ssoossh/mail-templates/

  - id: pam-amd64
    package_name: ssoossh-pam
    file_name_template: "ssoossh-pam_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: &pamDescription "PAM module for sudo/su certificate approval via ssoosshd"
    ids:
      - linux-pam-build-amd64
    libdirs:
      cshared: '{{- if eq .Format "deb" }}/usr/lib/x86_64-linux-gnu/security{{- else }}/usr/lib64/security{{- end }}'
    formats:
      - deb
      - rpm
    overrides:
      deb:
        dependencies:
          - "libc6 (>= 2.17)"
      rpm:
        dependencies:
          - "glibc >= 2.17"
    deb:
      signature:
        key_file: private.pgp
    rpm:
      signature:
        key_file: private.pgp
    contents: &pamContents
      - src: docs/pam.d-sudo.example
        dst: /usr/share/doc/ssoossh-pam/examples/sudo
      - src: LICENSE
        dst: /usr/share/doc/ssoossh-pam/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/ssoossh-pam/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/doc/ssoossh-pam/THIRD-PARTY-LICENSES.md
      - src: docs/man/pam_ssoossh.8
        dst: /usr/share/man/man8/pam_ssoossh.8

  - id: pam-arm64
    package_name: ssoossh-pam
    file_name_template: "ssoossh-pam_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: *pamDescription
    ids:
      - linux-pam-build-arm64
    overrides:
      deb:
        dependencies:
          - "libc6 (>= 2.26)"
      rpm:
        dependencies:
          - "glibc >= 2.26"
    libdirs:
      cshared: '{{- if eq .Format "deb" }}/usr/lib/aarch64-linux-gnu/security{{- else }}/usr/lib64/security{{- end }}'
    formats:
      - deb
      - rpm
    deb:
      signature:
        key_file: private.pgp
    rpm:
      signature:
        key_file: private.pgp
    contents: *pamContents

archives:
  - id: linux-clients-archives
    ids:
      - linux-build
    name_template: &client_archive_name "ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: &client_archive_files
      - src: client/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page, not just the client's: an archive owns no filesystem
      # paths, so the co-installation constraint that splits the .deb/.rpm
      # contents below does not apply here, and a tarball that documents
      # the whole tool is more useful than one that documents half of it.
      - docs/man/*

  - id: linux-server-archives
    ids:
      - server-linux-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - id: linux-server-musl-archives
    ids:
      - server-linux-musl-build
    name_template: "ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}_musl"
    files:
      - src: server/config/defaults.yaml
        dst: .
        strip_parent: true
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      # Every page — see the client archive above.
      - docs/man/*
      - src: server/resources/mail/*.tmpl
        dst: mail-templates
        strip_parent: true

  - formats: ["zip"]
    id: windows-archives
    ids:
      - windows-build
      - macos-build
    files: *client_archive_files
    name_template: *client_archive_name

# Builds and pushes ghcr.io/mnestor/ssoosshd, one multi-arch (linux/amd64 +
# linux/arm64) manifest per libc, straight from the server-linux-build /
# server-linux-musl-build binaries above -- no separate compile step, so
# the image gets the same -X version.Version/Commit/Date/BuiltBy stamp
# (see internal/version) as every other release artifact for free. `docker
# buildx build --platform ... --push` runs once per entry
# (build.yaml sets up a docker-container buildx builder and a GHCR login
# first); a single entry with two `platforms:` builds and combines both
# architectures into one manifest itself, no separate docker_manifests:
# step needed. Like the rest of this file's publish steps, a snapshot
# build (any push that isn't a v* tag) builds these images locally to
# catch a broken Dockerfile but never pushes -- goreleaser skips its whole
# publish phase in --snapshot mode.
#
# dockers_v2 (not the older dockers:/docker_manifests:) is what's current
# in goreleaser v2; see https://goreleaser.com/customization/package/dockers_v2/.
# sbom is off: a cosign/syft SBOM attachment isn't set up in this project's
# release pipeline yet, and dockers_v2 defaults it to on.
dockers_v2:
  - id: docker-glibc
    ids:
      - server-linux-build
    dockerfile: Dockerfile
    images:
      - ghcr.io/mnestor/ssoossh-server
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # The binary itself is go:embed-only; this is the same reference copy
    # of the mail templates the old from-source Dockerfile shipped (see
    # docs/operations/email-notifications.md) placed into the docker build
    # context so Dockerfile can COPY it.
    extra_files:
      - server/resources/mail
    labels:
      org.opencontainers.image.source: "https://github.com/mnestor/ssoossh"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.licenses: "MIT"
    sbom: false

  - id: docker-musl
    ids:
      - server-linux-musl-build
    dockerfile: Dockerfile.musl
    images:
      - ghcr.io/mnestor/ssoossh-server
    tags:
      - "{{ .Version }}-musl"
      - "{{ .Major }}.{{ .Minor }}-musl"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - server/resources/mail
    labels:
      org.opencontainers.image.source: "https://github.com/mnestor/ssoossh"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.licenses: "MIT"
    sbom: false
