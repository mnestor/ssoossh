# ssoossh client integration for ssh. Ships commented: installing the client
# package must not change where or how this machine makes outbound SSH
# connections.
#
# Without something like this the client is installed and configured but
# never invoked -- ssh has no reason to run it.
#
# Requires the main /etc/ssh/ssh_config to carry
#   Include /etc/ssh/ssh_config.d/*.conf
#
# Replace the host pattern with your own estate before uncommenting.
#
# IdentityFile is not optional when use_agent is false. The client writes
# its key to whatever key_filename resolves to -- by default
# ~/.ssh/id_ssoossh, which is not a name ssh tries on its own, so without
# this line ssh offers no key at all and the failure looks nothing like the
# cause. With an agent the line is harmless. No CertificateFile is needed:
# ssh derives id_ssoossh-cert.pub from IdentityFile's name.
#
# See https://mnestor.github.io/ssoossh/guides/ssh-config/

#Match host *.example.com exec "ssoossh ssh login"
#    IdentityFile ~/.ssh/id_ssoossh
