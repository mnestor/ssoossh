# ssoossh host integration for sshd. Ships commented: installing the client
# package must not change how this machine accepts SSH.
#
# Uncomment both lines to have sshd ask ssoossh which certificate principals
# may assume a local account, then `sshd -t` and reload sshd.
#
# Requires the main /etc/ssh/sshd_config to carry
#   Include /etc/ssh/sshd_config.d/*.conf
# Debian, Ubuntu and RHEL 9 ship that line; RHEL 8 does not, and there this
# file is read by nothing until the Include is added.
#
# Order matters: sshd rejects AuthorizedPrincipalsCommand when no
# AuthorizedPrincipalsCommandUser has been set yet, so the user comes first.
#
# sshd refuses to run a command whose path is writable by group or other.
# /usr/bin/ssoossh satisfies that. The compatibility symlink at
# /usr/local/bin/ssoossh does not on Debian and Ubuntu, where /usr/local/bin
# is root:staff 2775 -- do not point this at the old path.
#
# The lookup account and the mapping file it reads are both created by this
# package. See
# https://mnestor.github.io/ssoossh/hosts/sshd-trust/#answering-with-a-command

#AuthorizedPrincipalsCommandUser ssoossh-principals
#AuthorizedPrincipalsCommand /usr/bin/ssoossh host principals %u
