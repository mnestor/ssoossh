---
version: 2

release:
  prerelease: auto
  draft: false
  disable: false
  skip_upload: false

# before_publish:
#   artifacts:
#     - package
#     - archive
#     - source
#     - checksum

before:
  hooks:
    - go mod tidy
    # - source .env
    # - go generate ./...

env:
  - CGO_ENABLED=0
#   - GOFLAGS=-buildvcs=false

builds:
  - id: server-linux-build
    binary: ssoossh-server
    dir: &dirsrv ./cmd/ssoossh-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
    ldflags: &build-ldflags |
      -X github.com/mnestor/ssoossh/internal/version.Version={{.Version}}
      -X github.com/mnestor/ssoossh/internal/version.Commit={{.Commit}}
      -X github.com/mnestor/ssoossh/internal/version.Date={{.Date}}
      -X github.com/mnestor/ssoossh/internal/version.ApiPath={{- if index .Env "API_PATH" }}{{ .Env.API_PATH }}{{ else }}v1{{ end }}
      -X github.com/mnestor/ssoossh/internal/version.BuiltBy={{- if index .Env "github" }}{{.Env.github.runner.name}}{{ else }}goreleaser{{ end }}

  - id: linux-build
    binary: &name "ssoossh"
    dir: &dir ./cmd/ssoossh
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
    ldflags: *build-ldflags

  - id: windows-build
    binary: *name
    dir: *dir
    goos:
      - windows
    goarch:
      - amd64
    ldflags: *build-ldflags

  - id: macos-build
    binary: *name
    dir: *dir
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags
    # hooks:
    #   post:
    #     - cmd: downloads/quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv

  - id: netbsd-build
    dir: *dir
    binary: *name
    goos:
      - netbsd
    goarch:
      - amd64
    ldflags: *build-ldflags

nfpms:
  - id: client
    package_name: ssoossh-client
    file_name_template: 'ssoossh-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: &license "Apache 2.0"
    maintainer: &maintainer "Mike Nestor"
    homepage: &website "https://github.com/mnestor/ssoossh"
    description: &description "client for ssoossh-server to retrieve and manage ssh certificates"
    builds:
      - linux-build
    bindir: /usr/local/bin
    formats: &nfpmFormats
      - rpm
      - deb
    contents:
      # Basic file that applies to all packagers
      - src: docs/ssoossh.yaml.default
        dst: /etc/ssoossh.yaml
        type: "config|noreplace"

  - id: server
    package_name: ssoossh-server
    file_name_template: 'ssoossh-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    license: *license
    maintainer: *maintainer
    homepage: *website
    description: &description "server to authorize and sign ssh public keys with a certificate"
    builds:
      - server-linux-build
    bindir: /usr/local/sbin
    formats: *nfpmFormats
    contents:
      # Basic file that applies to all packagers
      - src: docs/ssoossh-server.yaml.default
        dst: /etc/soossh-server.yaml
        type: "config|noreplace"

archives:
  - id: linux-archives
    builds:
      - linux-build
    files:
      - docs/README.md
      - docs/ssoossh.yaml.default

  - id: netbsd-archives
    builds:
      - netbsd-build
    files:
      - docs/README.md
      - docs/ssoossh.yaml.default

  - formats: ["zip"]
    id: windows-archives
    builds:
      - windows-build
    files:
      - docs/README.md
      - docs/ssoossh.yaml.default

  - formats: ["zip"]
    id: macos-archives
    builds:
      - macos-build
    files:
      - docs/README.md
      - docs/ssoossh.yaml.default
