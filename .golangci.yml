version: "2"
run:
  concurrency: 4
  relative-path-mode: gomod
  modules-download-mode: readonly
  issues-exit-code: 2
  # Test files are ~half the tree and the project mandates table-driven
  # tests everywhere; linting them is the point. The narrow _test.go
  # exclusions below carve out the findings that are noise there.
  tests: true
  allow-parallel-runners: true
  allow-serial-runners: true
linters:
  enable:
    - dogsled
    - dupword
    - errorlint
    - gocognit
    - godot
    - gosec
    - nolintlint
  settings:
    godot:
      # swag annotations are directives, not prose — "@Router /api/ca [get]"
      # has no business ending in a period.
      exclude:
        - '^\s*@'
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocognit:
      min-complexity: 20
    gosec:
      severity: medium
      confidence: medium
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - ineffassign
        path: _test\.go$
      # Table-driven tests are long by construction: the table, the loop,
      # and a subtest body all count toward one function. Complexity limits
      # are about code a reader has to hold in their head to change it
      # safely, which is not what a case table is.
      - linters:
          - gocognit
          - dogsled
        path: _test\.go$
      # Both of these are scoped to test files on purpose. Test fixtures
      # dial self-signed certs and hold throwaway credentials; production
      # code must not get the same pass. internal/api/client.go sets
      # InsecureSkipVerify from config, which is exactly the line gosec
      # should keep reporting.
      - linters:
          - gosec
        text: 'G402'
        path: _test\.go$
      - linters:
          - gosec
        text: 'G101: Potential hardcoded credentials'
        path: _test\.go$
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/mnestor/ssoossh
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
