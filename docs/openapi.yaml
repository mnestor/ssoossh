        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No stored account has that uid, or NSS is disabled
      security:
      - sessionCookie: []
      summary: Read one stored NSS account (auditor and above)
      tags:
      - admin
  /api/admin/nss/users/{uid}/accept-id-change:
