    webtypes.AccountHolderResponse:
      properties:
        disabled:
          description: |-
            Disabled marks a holder whose account is disabled. Listed rather than
            omitted: the claim is still on their row and comes back with the
            account, so dropping them would answer "who has access" with a set
            that quietly grows again later.
          type: boolean
        email:
          type: string
        name:
          description: |-
            Name and Email are display fields, empty when the identity provider
            released neither.
          type: string
        own:
          description: |-
            Own marks a holder for whom this is their own account rather than one
            a service_accounts claim named — only possible with
            cert_options.service.allow_user_accounts on.
          type: boolean
        user_id:
          type: string
        username:
          type: string
      required:
      - user_id
      - username
      type: object
    webtypes.AccountHoldersResponse:
      properties:
        holders:
          items:
            $ref: '#/components/schemas/webtypes.AccountHolderResponse'
          type: array
          uniqueItems: false
        service_account:
          description: |-
            ServiceAccount is the account the holders were resolved for, echoed
            back so the panel can name it without re-deriving it from principals.
          type: string
      required:
      - holders
      - service_account
      type: object
    webtypes.AdminEnrollmentResponse:
      properties:
        approved_by_email:
          type: string
        approved_by_username:
          description: |-
            ApprovedByUsername and ApprovedByEmail name the user who approved this
            enrollment. Provenance, not ownership — the code outlives their access
            to it and is not theirs to move.
          type: string
        certificate_valid_seconds:
          description: CertificateValidSeconds is how long each redeemed certificate
            is valid.
          type: integer
        created_at:
          description: CreatedAt is when the enrollment was approved.
          type: string
        expires_at:
          description: ExpiresAt bounds the code.
          type: string
        first_redeemed_at:
          description: |-
            FirstRedeemedAt is the first successful redemption, absent for a code
            that has never produced a certificate.
          type: string
        id:
          type: string
        key_id:
          description: |-
            KeyID is likewise fixed at approval and lands verbatim in every
            certificate.
          type: string
        last_retrieved_at:
          description: LastRetrievedAt is the most recent redemption attempt.
          type: string
        notification_email:
          description: |-
            NotificationEmail is where notifications about this enrollment go
            instead of to every holder of the service account. Empty means they
            fan out. Visible to auditors because it decides who hears about a
            credential; changing it needs SOC.
          type: string
        options:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        principals:
          description: Principals is what every certificate this code produces carries.
          items:
            type: string
          type: array
          uniqueItems: false
        public_key_fingerprint:
          description: |-
            PublicKeyFingerprint identifies the keypair the code is bound to.
            Empty if the stored key could not be parsed.
          type: string
        retrieval_count:
          description: RetrievalCount counts every logged redemption attempt.
          type: integer
        service_account:
          description: |-
            ServiceAccount is the account this code was approved for, and who owns
            it: everyone holding the account (see
            https://mnestor.github.io/ssoossh/concepts/service-certificates/).
          type: string
      required:
      - approved_by_email
      - approved_by_username
      - created_at
      - expires_at
      - id
      - key_id
      - options
      - principals
      - retrieval_count
      - service_account
      type: object
    webtypes.AdminEnrollmentsResponse:
      properties:
        enrollments:
          items:
            $ref: '#/components/schemas/webtypes.AdminEnrollmentResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last row, absent on the last page.
          type: string
        total:
          description: Total is how many enrollments match the search, across all
            pages.
          type: integer
      required:
      - enrollments
      - total
      type: object
    webtypes.AdminUserDetail:
      properties:
        certificate_count:
          description: CertificateCount is how many certificates have been issued
            to this user.
          type: integer
        created_at:
          description: CreatedAt is when the user first authenticated.
          type: string
        directory:
          $ref: '#/components/schemas/webtypes.AdminUserDirectory'
        directory_enabled:
          description: |-
            DirectoryEnabled mirrors ldap.enabled, and is what disambiguates an
            absent Directory. Without it, "no directory record" means either "this
            person has never been enriched" or "the directory is switched off and
            their record is being withheld" — two states that call for opposite
            actions from whoever is reading the page.
          type: boolean
        directory_overrides:
          description: |-
            DirectoryOverrides names each identity field the directory currently
            supplies in place of the OIDC value, with both sides shown. Empty
            when LDAP is disabled, unconfigured, or has never resolved this
            person — in which case the OIDC values above are what the server
            acts on.
          items:
            $ref: '#/components/schemas/webtypes.AdminUserOverride'
          type: array
          uniqueItems: false
        disabled_at:
          description: DisabledAt is when an admin disabled this user. Omitted if
            not disabled.
          type: string
        disabled_by_user_id:
          description: |-
            DisabledByUserID and DisabledByUsername identify the admin that
            disabled this user. Both omitted if not disabled.
          type: string
        disabled_by_username:
          type: string
        disabled_reason:
          description: |-
            DisabledReason is why the account was disabled, required at the API
            and shown here because this is where it meets the person deciding
            whether to re-enable. Omitted if not disabled.
          type: string
        disabled_source:
          description: |-
            DisabledSource says what disabled the account: "admin", "soc" or
            "ldap_sync". It is what makes auto-re-enable safe — the sync clears
            only its own disables — so it belongs next to the reason rather than
            only in the database. Omitted if not disabled, and absent on rows
            predating the column.
          type: string
        email:
          description: |-
            Email is the user's email from OIDC, possibly empty. Not an
            identifier either, for the same reason as Username.
          type: string
        extra_fields:
          additionalProperties: {}
          description: ExtraFields are operator-configured extra claims, decoded from
            stored JSON map.
          type: object
        groups:
          description: |-
            Groups are the persisted group memberships. Both capture paths while
            ldap.enabled is true; OIDC only when it is false, on the same
            reasoning as Directory below — the directory rows are frozen, so
            they are neither shown nor used for notification fan-out until the
            directory is switched back on.
            Never an authorization input (see
            https://mnestor.github.io/ssoossh/internals/invariants/): this is
            what the server recorded, shown so an operator can see why a
            notification reached someone, or why a group they expected is
            missing.
          items:
            $ref: '#/components/schemas/webtypes.AdminUserGroup'
          type: array
          uniqueItems: false
        id:
          description: ID is the stable user identifier.
          type: string
        name:
          description: |-
            Name is the person's human-readable name. Display only: it is not a
            principal, not a key ID input, and never an authorization input.
            Empty when neither the identity provider nor the directory supplied
            one.
          type: string
        notification_preferences:
          description: |-
            NotificationPreferences is every notification kind the server knows
            how to send, with what applies to this user and whether they chose
            it. Registry order, then any stored rows for kinds no longer
            registered.
          items:
            $ref: '#/components/schemas/webtypes.AdminUserNotificationPreference'
          type: array
          uniqueItems: false
        oidc_fields:
          additionalProperties:
            type: boolean
          description: |-
            OIDCFields reports, per identity destination, whether
            authentication.fields names a claim that populates it. It is what
            separates "the ID token carried nothing for this field" from "nothing
            was ever asked of the ID token for this field" — two states that read
            identically on the page and call for opposite actions.

            It also decides how a directory value is described. A field with no
            configured claim has no OIDC side to override, so calling the
            directory value an override there names a conflict that does not
            exist; the directory is simply the only source.

            Keyed by destination name: "other_accounts", "service_accounts",
            "name", and one entry per configured extra field.
          type: object
        other_accounts:
          description: |-
            OtherAccounts, ServiceAccounts, ExtraFields and Name above are the
            OIDC capture — exactly what the ID token carried at the last login,
            as stored on the users row. They are deliberately *not* the values
            the server acts on: a configured ldap.fields entry overrides its
            OIDC counterpart wholesale, and DirectoryOverrides below names every
            field where that is currently happening and what the effective value
            is.

            Showing the OIDC half even when it is overridden is the point. An
            operator debugging "why is this person missing a principal" needs to
            see both sides and which one won; showing only the winner makes a
            misconfigured claim mapping invisible.
          items:
            type: string
          type: array
          uniqueItems: false
        service_accounts:
          description: ServiceAccounts are service accounts from OIDC, decoded from
            stored JSON.
          items:
            type: string
          type: array
          uniqueItems: false
        service_enrollment_count:
          description: |-
            ServiceEnrollmentCount is how many live (not expired) service
            enrollments this user approved. Provenance, not a consequence of
            disabling them: the codes belong to their service accounts and keep
            working (see
            https://mnestor.github.io/ssoossh/concepts/service-certificates/).
          type: integer
        subject:
          description: |-
            Subject is the unique account identifier, read from the claim named
            by authentication.fields.subject ("sub" by default). It is the only
            value a login is keyed by, and the only one guaranteed not to move.
          type: string
        updated_at:
          description: UpdatedAt is when the user's identity was last refreshed at
            login.
          type: string
        username:
          description: |-
            Username is the OIDC claim username. Not an identifier — it changes
            when a person is renamed, which is what Subject exists to survive.
          type: string
      required:
      - certificate_count
      - created_at
      - directory_overrides
      - email
      - extra_fields
      - groups
      - id
      - name
      - notification_preferences
      - oidc_fields
      - other_accounts
      - service_accounts
      - service_enrollment_count
      - subject
      - updated_at
      - username
      type: object
    webtypes.AdminUserDirectory:
      description: |-
        Directory is the user's directory bookkeeping row, absent when they
        have never been enriched. It is what answers "why is this person
        missing a group" from data already stored.

        Also absent whenever ldap.enabled is false, even for a user who has a
        row. Switching the directory off stops the sync, so everything in
        that row is frozen at whatever the last pass read, and the server no
        longer acts on any of it — the session identity falls back to the
        OIDC values on the next request. Presenting frozen data beside live
        data with no way to tell them apart is how someone ends up granting
        access on a principal list that has not been true for months.
      properties:
        attributes:
          additionalProperties:
            items:
              type: string
            type: array
          description: |-
            Attributes is the stored field map — the same values the login path
            merges onto the identity, and the last-known-good cache it falls back
            to when the directory is unreachable.
          type: object
        consecutive_misses:
          description: |-
            ConsecutiveMisses is how many passes have observed the absence.
            Reporting only: the disable is decided on elapsed time, since a pass
            count measures replica count rather than absence.
          type: integer
        directory_id:
          description: |-
            DirectoryID is the entry's unique, immutable identifier (the
            attribute named by ldap.id_attribute), and the anchor that survives a
            rename or a move between OUs. Empty when ldap.id_attribute is
            unconfigured, which leaves resolution on the DN-then-filter path.
          type: string
        dn:
          description: DN is the entry's distinguished name from the last successful
            read.
          type: string
        first_missing_at:
          description: |-
            FirstMissingAt is when the entry was first found to be missing, and
            what the auto-disable threshold is measured against. Absent means the
            entry is currently resolving.
          type: string
        last_seen_at:
          description: |-
            LastSeenAt is the last successful read of the entry; LastSyncedAt is
            the last pass that reached the directory at all. They differ exactly
            when the entry is missing.
          type: string
        last_synced_at:
          type: string
      required:
      - attributes
      - directory_id
      - dn
      type: object
    webtypes.AdminUserGroup:
      properties:
        first_seen_at:
          description: |-
            FirstSeenAt survives a refresh that keeps the membership, so "since
            when" is answerable; LastSeenAt is the last capture that saw it.
          type: string
        last_seen_at:
          type: string
        name:
          description: |-
            Name is the reduced, comparable name: a memberOf DN is reduced to its
            CN before it is stored.
          type: string
        source:
          description: |-
            Source is "oidc" or "ldap". The two capture paths never collide and
            a name can appear under both.
          type: string
      required:
      - first_seen_at
      - last_seen_at
      - name
      - source
      type: object
    webtypes.AdminUserNotificationPreference:
      properties:
        default:
          description: |-
            Default is what would apply with no stored choice, so a reader can
            see at a glance which of these the user actually decided.
          type: boolean
        description:
          type: string
        enabled:
          description: |-
            Enabled is what applies: the stored choice where there is one, the
            registered default otherwise.
          type: boolean
        explicit:
          description: |-
            Explicit reports whether the user has stored a choice for this kind.
            False means Enabled is the registered default.
          type: boolean
        kind:
          type: string
        registered:
          description: |-
            Registered reports whether the kind is still in the server's
            registry. False marks a stored row left behind by a removed kind.
          type: boolean
        title:
          description: |-
            Title and Description are the registry's own wording. Empty for a
            stored row whose kind is no longer registered — a downgrade or a
            removed kind leaves rows nothing answers to, and they are still shown
            rather than dropped, since the choice is real and still stored.
          type: string
        updated_at:
          description: |-
            UpdatedAt is when the choice was last changed, absent when there is
            no stored choice to have changed.
          type: string
      required:
      - kind
      type: object
    webtypes.AdminUserOverride:
      properties:
        effective:
          description: |-
            Effective is what the directory supplies, and therefore what the
            server actually acts on for this field.
          items:
            type: string
          type: array
          uniqueItems: false
        field:
          description: |-
            Field is the destination name: "other_accounts", "service_accounts",
            "name", or an operator-chosen extra field.
          type: string
        oidc:
          description: |-
            OIDC is what the ID token supplied for this field at the last login,
            shown even though it lost — a claim mapping that is quietly wrong is
            invisible otherwise. Empty when the token carried nothing.
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - effective
      - field
      - oidc
      type: object
    webtypes.AdminUserSummary:
      properties:
        created_at:
          description: CreatedAt is when the user first authenticated.
          type: string
        disabled_at:
          description: |-
            DisabledAt is when an admin disabled this user. Omitted (null) if not
            disabled.
          type: string
        disabled_by_username:
          description: |-
            DisabledByUsername is the username of the admin that disabled this user.
            Only populated when DisabledAt is non-null.
          type: string
        email:
          description: Email is the user's email from OIDC, possibly empty or changed
            at login.
          type: string
        id:
          description: ID is the stable user identifier.
          type: string
        name:
          description: |-
            Name is the person's human-readable name, so a list of usernames can
            be scanned by someone who thinks in names. Display only, and empty
            when nothing supplied one.
          type: string
        subject:
          description: |-
            Subject is the unique account identifier (authentication.fields.subject,
            "sub" by default) — the one field here that is stable across logins.
          type: string
        updated_at:
          description: UpdatedAt is when the user's identity was last refreshed at
            login.
          type: string
        username:
          description: Username is the OIDC claim username, possibly changed at each
            login.
          type: string
      required:
      - created_at
      - email
      - id
      - name
      - subject
      - updated_at
      - username
      type: object
    webtypes.AdminUsersListResponse:
      properties:
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last user, absent on the last page.
          type: string
        total:
          description: |-
            Total is how many users match the search and state filter, across all
            pages.
          type: integer
        users:
          items:
            $ref: '#/components/schemas/webtypes.AdminUserSummary'
          type: array
          uniqueItems: false
      required:
      - total
      - users
      type: object
    webtypes.ApproveRequestBody:
      properties:
        extensions:
          description: |-
            Extensions is the approver's chosen certificate extension set, for
            service-type requests only and ignored for others.

            Absent (JSON null, or the field omitted) means the approver made no
            choice and the requester's own set stands — which is what an
            approval nobody touched sends, so configuring
            cert_options.service.extensions cannot by itself change the outcome
            of an untouched approval. An empty array is a different thing: a
            deliberate "no extensions", which is legitimate here in a way an
            empty Principals is not.

            Bounded by cert_options.service.extensions server-side. The
            selection replaces the requested set and then goes through the same
            ceiling intersection every request does, so naming something outside
            the ceiling drops it rather than granting it.
          items:
            type: string
          type: array
          uniqueItems: false
        notification_email:
          description: |-
            NotificationEmail optionally points every notification about the
            resulting enrollment at one address instead of fanning out to every
            holder of the service account. Service-type requests only; ignored
            for others. Empty means fan out, which is the default.

            Approval is where this belongs because it is the moment the approver
            is already deciding what the enrollment is for: a team alias entered
            here reaches the people who run the job rather than the one person
            who clicked approve. It stays editable afterwards.
          type: string
        principals:
          items:
            type: string
          type: array
          uniqueItems: false
        service_account:
          type: string
      type: object
    webtypes.AuditEventResponse:
      properties:
        action:
          description: |-
            Action is the namespaced action name, e.g. "user.disabled". The set
            grows without a wire change, so a client must render an unknown
            action rather than assume the list is closed.
          type: string
        actor:
          $ref: '#/components/schemas/webtypes.AuditSubjectResponse'
        created_at:
          type: string
        detail:
          additionalProperties: {}
          description: |-
            Detail is the per-action specifics, passed through as decoded JSON so
            a new action's fields reach the UI without a wire type change. Never
            carries a secret.
          type: object
        id:
          type: string
        reason:
          type: string
        system:
          description: |-
            System marks an action taken by the server rather than a person,
            which is how a reader tells "nobody" from "not recorded".
          type: boolean
        target:
          $ref: '#/components/schemas/webtypes.AuditSubjectResponse'
      required:
      - action
      - created_at
      - id
      type: object
    webtypes.AuditEventsResponse:
      properties:
        events:
          items:
            $ref: '#/components/schemas/webtypes.AuditEventResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last event, absent on the last page.
          type: string
        total:
          type: integer
      required:
      - events
      type: object
    webtypes.AuditSubjectResponse:
      properties:
        email:
          type: string
        groups:
          items:
            type: string
          type: array
          uniqueItems: false
        subject:
          type: string
        user_id:
          description: |-
            UserID is the grouping key the timelines are built on. It may be
            empty (a system or anonymous actor) and it may no longer match any
            row, which does not make the rest of the snapshot less true.
          type: string
        username:
          type: string
      type: object
    webtypes.BrandingResponse:
      properties:
        login_notice:
          description: |-
            LoginNotice is a plain-text message shown on the login page before authentication.
            Empty disables the notice. Supports newlines for multi-line text.
          type: string
        logo_url:
          description: |-
            LogoURL is generated by the server and points to /api/branding/logo when
            a logo is configured. Always same-origin, never an external URL.
            Omitted entirely when no logo is configured (not set to empty string).
          type: string
        org_name:
          description: |-
            OrgName is the organization name displayed in the web UI (e.g., "Acme Corp").
            Empty disables organization-specific branding.
          type: string
        support_email:
          description: |-
            SupportEmail is the deployment's own support address, validated at
            startup. When set, the login page's "contact your administrator" and
            the footer's issue link both become mailto: links to it; when unset,
            both keep their defaults. Omitted entirely when unconfigured.
          type: string
        support_label:
          description: |-
            SupportLabel is the link text for SupportEmail. Omitted when unset,
            and the client falls back to showing the address itself.
          type: string
      type: object
    webtypes.CertificateListAdminResponse:
      properties:
        certificates:
          items:
            $ref: '#/components/schemas/webtypes.CertificateResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last certificate, absent on the last page.
          type: string
        total:
          description: Total is how many certificates match the filters, across all
            pages.
          type: integer
      required:
      - certificates
      - total
      type: object
    webtypes.CertificateListResponse:
      properties:
        certificates:
          items:
            $ref: '#/components/schemas/webtypes.CertificateResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      required:
      - certificates
      type: object
    webtypes.CertificateOptionsResponse:
      description: |-
        Options are the certificate options fixed at approval, already
        narrowed by server config: what a redemption actually grants, not
        what the client asked for.
      properties:
        extensions:
          items:
            type: string
          type: array
          uniqueItems: false
        force_command:
          type: string
        no_touch_required:
          type: boolean
        source_addresses:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - extensions
      - no_touch_required
      type: object
    webtypes.CertificateResponse:
      properties:
        critical_options:
          additionalProperties:
            type: string
          description: |-
            CriticalOptions are the options fixed into the certificate
            (force-command, source-address). Kept separate from Extensions
            because sshd treats them differently: it rejects a certificate
            carrying a critical option it does not understand, where an unknown
            extension is ignored. Populated by the detail endpoint alone, same as
            Extensions.
          type: object
        decided_accept_language:
          type: string
        decided_at:
          type: string
        decided_by_email:
          type: string
        decided_by_groups:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_other_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_outcome:
          type: string
        decided_by_service_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_subject:
          type: string
        decided_by_username:
          type: string
        decided_forwarded_for:
          type: string
        decided_granted_options:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        decided_policy_explanation:
          type: string
        decided_principals:
          description: |-
            The decision's content and reasoning; see RequestDetailResponse.
            Populated on the detail endpoint only.
          items:
            type: string
          type: array
          uniqueItems: false
        decided_source_ip:
          type: string
        decided_user_agent:
          type: string
        enrollment_id:
          description: |-
            EnrollmentID is the service code this certificate was redeemed from,
            so the UI can link to it. Present only on a service certificate.
          type: string
        expires_at:
          type: string
        extensions:
          description: |-
            Extensions are the SSH certificate extensions the certificate was
            signed with (permit-pty, permit-agent-forwarding, ...), decoded from
            the audit row's JSON column rather than passed through as a string:
            the browser should not have to parse JSON out of JSON.

            Populated by the detail endpoint alone. A list row does not display
            them, and carrying them on every row of a hundred-row page would be
            payload nobody reads.
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        issued_at:
          type: string
        key_id:
          type: string
        principals:
          type: string
        public_key_fingerprint:
          type: string
        reported_client:
          type: string
        reported_hostname:
          type: string
        reported_machine_id:
          type: string
        reported_pam_service:
          type: string
        reported_process:
          type: string
        reported_remote_host:
          type: string
        reported_requesting_user:
          type: string
        reported_tty:
          type: string
        reported_username:
          description: |-
            What asked for this certificate, as the requester reported it, taken
            from the decision record's snapshot rather than from the request --
            see model.CertificateRequestDecision. Without these the history could
            say who approved a certificate and what it granted but not which
            machine or command it was for, which is the question an incident
            review actually starts from.

            Every one is self-reported by an unauthenticated caller and must be
            rendered as a claim, exactly as the approval page renders it (see
            RequestDetailResponse). The one field here the server established
            itself is DecidedSourceIP above, and that is the approver's, not the
            requester's.

            ReportedUsername and ReportedHostname are the "user@host" that asked:
            the PAM account and machine for a pam or console certificate, the
            local client's for a user one. The rest are PAM and console only, and
            empty on a user certificate, which has no service or terminal to
            report.

            The pair is on a list row too, because it is what a history row leads
            with: the row's subject is where the certificate was fetched from, and
            the approver's identity is the same value on every row of a person's
            own history. So is ReportedService, which a PAM row names (sudo, su,
            sshd). The remaining six stay detail-only -- six more strings on every
            row is payload nobody reads.
          type: string
        retrieved_at:
          description: |-
            RetrievedAt is when that redemption happened. Distinct from IssuedAt
            only by the width of the signing round trip, and carried because the
            retrieval log is timestamped by it — matching a certificate to a line
            in that log means comparing like with like.
          type: string
        retrieved_source_ip:
          description: |-
            RetrievedSourceIP is the address the `service retrieve` call came
            from — the machine the unattended job actually ran on. Present only
            on a service certificate.

            It answers a different question from DecidedSourceIP below, which for
            a service certificate is the approver's browser at enrollment time
            and is therefore identical across every certificate the code mints.
            This one is this certificate's own origin.
          type: string
        serial_number:
          description: |-
            SerialNumber is a decimal string, not a JSON number. Serials are 63
            bits of randomness (internal/serial), so all but a vanishing fraction
            exceed JavaScript's Number.MAX_SAFE_INTEGER (2^53-1) and a browser
            parsing one as a number silently rounds it -- 3260700569889958163
            reads back as 3260700569889958400. On an audit record that is a wrong
            answer, and an unsearchable one: the serial an operator reads off
            `ssh-keygen -L` never matches what is on screen.

            Both tags are needed. `json:",string"` decides what Go writes;
            `tstype` decides what tygo tells the browser to expect, which it
            otherwise infers from the Go type and gets wrong.
          example: "0"
          type: string
        type:
          $ref: '#/components/schemas/model.CertificateType'
      required:
      - expires_at
      - id
      - issued_at
      - key_id
      - principals
      - public_key_fingerprint
      - serial_number
      - type
      type: object
    webtypes.ClientPolicyResponse:
      description: |-
        ClientPolicy is the administrative policy the requesting machine
        claimed was in force on it, so the page can say why an option is
        missing rather than only that it is. Absent when nothing was claimed.

        A claim, like every other self-reported field on this response, and
        advisory by design: it narrows and explains what an approver is
        offered, and never decides whether a certificate is issued. A client
        that wants an option simply does not send this.
      properties:
        fips:
          description: |-
            FIPS reports the machine is held to FIPS-approved algorithms.
            Omitted when policy was silent, which is not the same as false.
          type: boolean
        forbidden_extensions:
          description: |-
            ForbiddenExtensions are the extensions the requesting machine's
            policy forbids. The client already removed them from what it asked
            for; this says which rule accounts for the gap.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    webtypes.ConfigSection:
      properties:
        name:
          description: |-
            Name is the top-level key the section covers ("http", "cert_options"),
            or "server" for the switches that sit at the root of the file.
          type: string
        settings:
          description: Settings are the section's leaves, in the order they are declared.
          items:
            $ref: '#/components/schemas/webtypes.ConfigSetting'
          type: array
          uniqueItems: false
      required:
      - name
      - settings
      type: object
    webtypes.ConfigSetting:
      properties:
        key:
          description: |-
            Key is the dotted configuration key, e.g. "http.tls.min_version" —
            the path an operator would write in their own config file, so a
            value on this screen can be traced back to the line that set it.
          type: string
        secret:
          description: |-
            Secret marks a key whose value is never sent. Value is the redaction
            placeholder when a secret is configured and empty when none is, so
            an operator can still tell whether one is set.
          type: boolean
        value:
          description: |-
            Value is what is in effect, rendered as text. Empty means unset: an
            empty string, a nil pointer, or an empty list or map.
          type: string
      required:
      - key
      type: object
    webtypes.CreateNSSKeyBody:
      properties:
        description:
          type: string
        expires_at:
          type: string
        group_name:
          type: string
        name:
          type: string
        notification_email:
          type: string
      required:
      - name
      type: object
    webtypes.CurrentUserResponse:
      properties:
        approvable_service_accounts:
          description: |-
            ApprovableServiceAccounts is what the approval page's picker is
            populated from: ServiceAccounts, plus the caller's own accounts when
            cert_options.service.allow_user_accounts is on. Sent as its own list
            rather than computed in the browser so the picker cannot offer an
            account the server would then refuse.
          items:
            type: string
          type: array
          uniqueItems: false
        detail_level:
          $ref: '#/components/schemas/model.DetailLevel'
        email:
          type: string
        extra:
          additionalProperties: {}
          description: |-
            Extra holds operator-configured extra fields captured at login from
            OIDC claims (see config.OAuthFields.Extra). Each value is either a
            string or an array of strings, reflecting the claim shape at login.
            Missing or null values in this field are rendered as "MISSING" by key
            ID templates, so this presence is important for debugging when
            debugging a key ID template that expected a claim that did not arrive.
            The frontend should display missing values visibly rather than hiding them.
          type: object
        groups:
          items:
            type: string
          type: array
          uniqueItems: false
        is_admin:
          description: |-
            IsAdmin, IsSOC and IsAuditor report the access levels this session
            holds, so the UI can show the affordances each one unlocks. The roles
            nest — an admin holds all three, a SOC member holds SOC and auditor —
            so more than one is true at a time and the account page names every
            one rather than only the narrowest. Display only: the server re-checks
            the matching Grants* rule on every scoped request, so hiding or
            showing an affordance changes nothing about what this session can do.
          type: boolean
        is_auditor:
          type: boolean
        is_nss_key_admin:
          description: |-
            IsNSSKeyAdmin reports the fleet key admin role (admin.nss_key_group,
            which admin implies): create keys and manage every one. Members of a
            single key's group manage that key without it. Display only, like
            the three above.
          type: boolean
        is_soc:
          type: boolean
        name:
          description: |-
            Name is the caller's human-readable name, for greeting them as a
            person rather than as an account. Display only, and empty when
            neither the identity provider nor the directory supplied one.
          type: string
        nss_enabled:
          description: |-
            NSSEnabled reports nss.enabled, so the UI shows the fleet keys and
            the login shell only where the server serves them.
          type: boolean
        other_accounts:
          description: |-
            OtherAccounts are alternate account identifiers this identity is
            known by on target systems (see config.OAuthFields.OtherAccounts),
            shown so a user can see every account name tied to their identity.
            These are also the candidates, alongside Username, that the approval
            page offers as principals for a user certificate (see
            ApproveRequestBody.Principals).
          items:
            type: string
          type: array
          uniqueItems: false
        posix:
          $ref: '#/components/schemas/webtypes.PosixAccountResponse'
        service_accounts:
          description: |-
            ServiceAccounts are the service accounts this identity holds (see
            config.OAuthFields.ServiceAccounts). It is also what the service
            codes page lists, so it stays the claim alone rather than the wider
            approval set below.
          items:
            type: string
          type: array
          uniqueItems: false
        subject:
          type: string
        user_own_service_accounts:
          description: |-
            UserOwnServiceAccounts is the subset of ApprovableServiceAccounts that
            is the caller's own account rather than a claimed service account, so
            the picker can say what those entries mean before one is chosen: the
            certificate is still non-interactive, for an unattended job, and is
            not a way to log in as yourself. Empty when
            cert_options.service.allow_user_accounts is off.
          items:
            type: string
          type: array
          uniqueItems: false
        username:
          type: string
      required:
      - approvable_service_accounts
      - detail_level
      - email
      - extra
      - groups
      - is_admin
      - is_auditor
      - is_nss_key_admin
      - is_soc
      - name
      - nss_enabled
      - other_accounts
      - posix
      - service_accounts
      - subject
      - user_own_service_accounts
      - username
      type: object
    webtypes.DeniedRequestListResponse:
      properties:
        denials:
          items:
            $ref: '#/components/schemas/webtypes.DeniedRequestResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      required:
      - denials
      type: object
    webtypes.DeniedRequestResponse:
      properties:
        certificate_request_id:
          description: CertificateRequestID is the request that was refused.
          type: string
        client:
          type: string
        decided_at:
          type: string
        decided_source_ip:
          description: |-
            DecidedSourceIP is the address the denial was made from -- the
            decider's browser, server-observed, not anything the requester
            claimed.
          type: string
        id:
          description: |-
            ID is the decision's id, not a certificate's -- there is no
            certificate. It is what the audit event for this denial carries.
          type: string
        pam_service:
          description: |-
            The rest of the compact host-context snapshot the decision row
            carries, and claims in exactly the same way: PAMService, TTY and
            RemoteHost are what a PAM or console request said it was doing, and
            Client is what a user request reported instead, since it has no PAM
            service or terminal.

            Present because "I refused a sudo on rack07 from 10.1.2.9" is a
            memory a month later and "I refused request 4f2a" is not. All of it
            is copied onto the decision at decision time, so unlike the request's
            own columns it cannot go blank later.
          type: string
        remote_host:
          type: string
        reported_hostname:
          type: string
        reported_username:
          description: |-
            ReportedUsername and ReportedHostname are the "user@host" the request
            claimed for itself, self-reported by an unauthenticated caller and
            never verified. They are here because they are what makes a denial
            identifiable a month later: "I refused a console login on rack07" is
            a memory, "I refused request 4f2a" is not.
          type: string
        tty:
          type: string
        type:
          $ref: '#/components/schemas/model.CertificateType'
      required:
      - certificate_request_id
      - decided_at
      - id
      type: object
    webtypes.DiagnosticCheckResult:
      properties:
        findings:
          description: |-
            Findings are the individual observations, already phrased for an
            operator. Empty when the check found nothing to report.
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          description: ID is a stable machine key for the check, e.g. "reachability".
          type: string
        remediation:
          description: Remediation is the concrete fix. Empty when the status is "ok".
          type: string
        status:
          description: |-
            Status is the worst finding's severity: "ok", "warn", "critical", or
            "skipped".
          type: string
        summary:
          description: Summary is the one-line headline for the check.
          type: string
        title:
          description: Title is the human name of the check.
          type: string
      required:
      - id
      - status
      - summary
      - title
      type: object
    webtypes.DiagnosticsResponse:
      properties:
        checks:
          description: Checks are the individual results, in display order.
          items:
            $ref: '#/components/schemas/webtypes.DiagnosticCheckResult'
          type: array
          uniqueItems: false
        public_origin:
          description: |-
            PublicOrigin is the URL the edge checks probed, echoed so the operator
            can confirm the run tested what they expected. Empty when
            http.public_url is not set.
          type: string
      type: object
    webtypes.DisableUserConsequences:
      properties:
        service_enrollment_count:
          description: |-
            ServiceEnrollmentCount is how many live enrollments this user
            approved. They are unaffected — reported so the dialog can say so
            with a number, which is the reassurance an admin disabling a
            colleague actually needs.
          type: integer
      required:
      - service_enrollment_count
      type: object
    webtypes.DisableUserRequestBody:
      properties:
        reason:
          description: |-
            Reason explains why the user is being disabled. Required and
            server-validated (non-empty, length-capped): the next admin opening
            this account needs to learn why it was disabled, and an optional
            field does not get filled.
          type: string
      required:
      - reason
      type: object
    webtypes.DisplayPreferencesResponse:
      properties:
        detail_level:
          $ref: '#/components/schemas/model.DetailLevel'
      required:
      - detail_level
      type: object
    webtypes.EffectiveConfigResponse:
      properties:
        sections:
          items:
            $ref: '#/components/schemas/webtypes.ConfigSection'
          type: array
          uniqueItems: false
      required:
      - sections
      type: object
    webtypes.EnrollmentRetrievalResponse:
      properties:
        certificate_serial:
          description: |-
            A decimal string on the wire, same as CertificateResponse.SerialNumber
            and for the same reason.
          example: "0"
          type: string
        retrieved_at:
          type: string
        source_ip:
          type: string
        succeeded:
          description: |-
            Succeeded is false for a redemption that passed code validation but
            failed at signing — still worth surfacing: someone held the code.
          type: boolean
      required:
      - certificate_serial
      - retrieved_at
      - source_ip
      - succeeded
      type: object
    webtypes.EnrollmentRetrievalsResponse:
      properties:
        retrievals:
          items:
            $ref: '#/components/schemas/webtypes.EnrollmentRetrievalResponse'
          type: array
          uniqueItems: false
        total:
          description: |-
            Total counts every logged redemption, not just the ones returned, so
            the UI can say what it is showing a slice of rather than implying the
            page is the whole history.
          type: integer
      required:
      - retrievals
      - total
      type: object
    webtypes.ExpireEnrollmentRequestBody:
      properties:
        reason:
          description: |-
            Reason explains why the enrollment is being expired. Required and
            server-validated, like the user containment reasons.
          type: string
      required:
      - reason
      type: object
    webtypes.IdentityEchoStartResponse:
      properties:
        authorization_url:
          description: |-
            AuthorizationURL carries prompt=login, so the provider issues a fresh
            token rather than replaying its own session.
          type: string
      required:
      - authorization_url
      type: object
    webtypes.LDAPProbeAttribute:
      properties:
        configured:
          description: |-
            Configured reports that a configured field reads this attribute,
            which is what the console highlights.
          type: boolean
        name:
          type: string
        truncated_values:
          description: TruncatedValues is how many values the probe's own cap dropped.
          type: integer
        values:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - name
      - values
      type: object
    webtypes.LDAPProbeBindings:
      description: Bindings are the typed values used when BindingSource is "custom".
      properties:
        email:
          type: string
        extra:
          additionalProperties:
            type: string
          type: object
        subject:
          type: string
        username:
          type: string
      type: object
    webtypes.LDAPProbeEntry:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/webtypes.LDAPProbeAttribute'
          type: array
          uniqueItems: false
        dn:
          type: string
      required:
      - attributes
      - dn
      type: object
    webtypes.LDAPProbeField:
      properties:
        attribute:
          description: |-
            Attribute is the entry attribute the field reads, absent for a
            search-only field.
          type: string
        attribute_present:
          description: |-
            AttributePresent distinguishes an attribute that is empty from one
            that is not on the entry at all — which is usually a typo.
          type: boolean
        attribute_values:
          items:
            type: string
          type: array
          uniqueItems: false
        error:
          type: string
        name:
          type: string
        searches:
          items:
            $ref: '#/components/schemas/webtypes.LDAPProbeSearch'
          type: array
          uniqueItems: false
        values:
          description: |-
            Values is what the field resolved to, as the login path would
            compute it.
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - name
      - values
      type: object
    webtypes.LDAPProbeMerge:
      properties:
        action:
          description: Action is "override", "persist-groups" or "extra".
          type: string
        dropped:
          items:
            type: string
          type: array
          uniqueItems: false
        kept:
          description: |-
            Kept and Dropped split the values by the group allowlist. Dropped is
            only ever non-empty for the group field.
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
        note:
          type: string
      required:
      - action
      - name
      type: object
    webtypes.LDAPProbeRequestBody:
      properties:
        attributes:
          description: |-
            Attributes are the attribute names to request. Empty requests every
            user attribute, which is the point of the console.
          items:
            type: string
          type: array
          uniqueItems: false
        binding_source:
          description: |-
            BindingSource selects where the template bindings come from: "self"
            (the calling admin's own identity, the default), "user" (an existing
            user named by UserID), or "custom" (the typed Bindings below).
          type: string
        bindings:
          $ref: '#/components/schemas/webtypes.LDAPProbeBindings'
        filter:
          description: |-
            Filter is the filter to run. Empty in template mode means the
            configured ldap.user_filter.
          type: string
        mode:
          description: |-
            Mode is "template" (render Filter against the bindings, with RFC 4515
            escaping applied) or "literal" (send Filter exactly as typed).
            Defaults to template.
          type: string
        user_id:
          description: UserID names the user to bind against when BindingSource is
            "user".
          type: string
      type: object
    webtypes.LDAPProbeResponse:
      properties:
        attributes:
          items:
            type: string
          type: array
          uniqueItems: false
        base_dn:
          description: |-
            BaseDN, FilterSent, Mode and Attributes are the request as it went
            out, so an operator sees the rendered filter rather than the
            template.
          type: string
        directory_id:
          type: string
        elapsed_ms:
          type: integer
        entry:
          $ref: '#/components/schemas/webtypes.LDAPProbeEntry'
        fields:
          items:
            $ref: '#/components/schemas/webtypes.LDAPProbeField'
          type: array
          uniqueItems: false
        filter_sent:
          type: string
        id_attribute:
          description: |-
            IDAttribute echoes ldap.id_attribute and DirectoryID is what it
            resolved to on the matched entry — the value that would be stored as
            the re-anchoring identifier. Both empty when it is unconfigured, in
            which case Suggestions names a candidate the entry actually carries.
          type: string
        matched:
          description: |-
            Matched is how many entries the filter found, capped by the probe.
            The login path refuses anything but exactly one.
          type: integer
        merge:
          items:
            $ref: '#/components/schemas/webtypes.LDAPProbeMerge'
          type: array
          uniqueItems: false
        mode:
          type: string
        suggestions:
          items:
            $ref: '#/components/schemas/webtypes.LDAPProbeSuggestion'
          type: array
          uniqueItems: false
        timeout_ms:
          type: integer
        tls_insecure_skip_verify:
          description: |-
            TLSInsecureSkipVerify reports that the connection did not verify the
            directory certificate.
          type: boolean
        wrote:
          description: |-
            Wrote is always false and is serialized anyway: the guarantee is part
            of the response, not only of the documentation.
          type: boolean
      required:
      - attributes
      - base_dn
      - filter_sent
      - mode
      type: object
    webtypes.LDAPProbeSearch:
      properties:
        base_dn:
          description: BaseDN and FilterSent are what actually went to the directory.
          type: string
        entries:
          type: integer
        error:
          type: string
        filter_sent:
          type: string
        name:
          type: string
        value:
          description: Value is the attribute read off each matched entry.
          type: string
        values:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - name
      type: object
    webtypes.LDAPProbeSuggestion:
      properties:
        reason:
          type: string
        yaml:
          type: string
      required:
      - reason
      - yaml
      type: object
    webtypes.LDAPStatusResponse:
      properties:
        base_dn:
          type: string
        configured_attributes:
          description: |-
            ConfiguredAttributes are the attribute names the configured fields
            read, which is what the console highlights in a returned entry.
          items:
            type: string
          type: array
          uniqueItems: false
        disable_after_seconds:
          description: |-
            DisableAfterSeconds is how long an entry may stay missing before the
            user is auto-disabled. Zero means never.
          type: integer
        enabled:
          description: |-
            Enabled is false when ldap.enabled is off, in which case everything
            below is unset and there is nothing to probe.
          type: boolean
        last_run:
          $ref: '#/components/schemas/webtypes.LDAPSyncRunResponse'
        reenable:
          description: |-
            Reenable reports whether the sync clears its own disables when an
            entry reappears.
          type: boolean
        running:
          description: |-
            Running reports a pass in progress on the instance that answered
            this request. Passes are not leader-elected, so another instance may
            be running one too.
          type: boolean
        sync_interval_seconds:
          description: |-
            SyncIntervalSeconds is zero when the scheduled sync is off, which is
            itself the answer to "why has nothing synced".
          type: integer
        tls_insecure_skip_verify:
          description: |-
            TLSInsecureSkipVerify reports that directory connections do not
            verify the server certificate. Reported rather than silently
            honoured: a probe that succeeds only because verification is off has
            to say so.
          type: boolean
        url:
          description: |-
            URL, BaseDN and UserFilter are the connection and query the probe is
            pinned to. The probe cannot be re-pointed, so these are the whole
            target.
          type: string
        user_filter:
          type: string
      type: object
    webtypes.LDAPSyncRequestBody:
      properties:
        dry_run:
          description: |-
            DryRun reads the directory and reports what the pass would do,
            changing nothing. It is what makes the button safe to press during an
            incident.
          type: boolean
      type: object
    webtypes.LDAPSyncRunResponse:
      description: |-
        LastRun is the most recent pass on any instance, absent when none has
        ever run.
      properties:
        actor_username:
          description: |-
            ActorUsername is the admin who triggered it, absent for a scheduled
            pass. The username rather than the id, since it is displayed.
          type: string
        disabled:
          type: integer
        dry_run:
          type: boolean
        error:
          description: |-
            Error is why the pass could not run — an unreachable directory, a
            failed bind. Empty for a pass that completed, whatever it concluded
            about individual users.
          type: string
        failed:
          type: integer
        finished_at:
          description: |-
            FinishedAt is absent while the pass runs, which is also how a pass
            that died with its process reads afterwards.
          type: string
        found:
          type: integer
        id:
          type: string
        instance:
          description: |-
            Instance is the host that ran it. Jobs are not leader-elected, so
            every instance runs its own pass and this says whose log to read.
          type: string
        missing:
          type: integer
        nss:
          $ref: '#/components/schemas/webtypes.NSSSyncRunResponse'
        reenabled:
          type: integer
        started_at:
          type: string
        trigger:
          description: Trigger is "schedule" or "manual".
          type: string
        users_seen:
          type: integer
      required:
      - id
      - started_at
      - trigger
      type: object
    webtypes.NSSAcceptedGroupIDChangeResponse:
      properties:
        dn:
          type: string
        gid:
          type: integer
        name:
          type: string
      required:
      - dn
      - gid
      - name
      type: object
    webtypes.NSSAcceptedUserIDChangeResponse:
      properties:
        dn:
          type: string
        gid:
          description: GID is absent when the entry has no gid attribute.
          type: integer
        name:
          type: string
        uid:
          type: integer
      required:
      - dn
      - name
      - uid
      type: object
    webtypes.NSSAccountDetailResponse:
      properties:
        created_at:
          type: string
        deleted_at:
          type: string
        dir_disabled:
          description: |-
            DirDisabled is the directory's own disabled flag
            (nss.disabled_filter).
          type: boolean
        directory_id:
          description: |-
            DirectoryID is the ldap.id_attribute value, absent when that is
            unset.
          type: string
        dn:
          description: |-
            DN is the entry's DN from the last read; empty once another entry
            took the DN (the row is then matched by DirectoryID alone).
          type: string
        gecos:
          type: string
        gid:
          description: |-
            GID is the stored gid attribute, before nss.auto_private_groups;
            absent when the entry has none (accepted only under "true", where
            it is followed rather than frozen).
          type: integer
        groups:
          description: |-
            Groups is every stored membership row for the uid, by gid, whether or
            not the group is served. The primary group is not among them unless
            a membership row names it.
          items:
            $ref: '#/components/schemas/webtypes.NSSStoredMembershipResponse'
          type: array
          uniqueItems: false
        home:
          description: |-
            Home and Shell are the directory's attributes as stored, before the
            nss.default_home and nss.default_shell fallbacks.
          type: string
        id:
          type: string
        last_synced_at:
          type: string
        missing_since:
          type: string
        name:
          type: string
        not_served:
          $ref: '#/components/schemas/model.NSSNotServedReason'
        pending_gid:
          type: integer
        pending_since:
          type: string
        pending_uid:
          type: integer
        person:
          $ref: '#/components/schemas/webtypes.NSSLinkedPersonResponse'
        served:
          $ref: '#/components/schemas/webtypes.NSSServedAccountResponse'
        shell:
          type: string
        shell_pref:
          description: ShellPref is the linked person's own choice from nss.allowed_shells.
          type: string
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
        uid:
          type: integer
        updated_at:
          type: string
        withheld_at:
          type: string
        withheld_reason:
          description: WithheldReason sums up the collisions that withhold the row.
          type: string
      required:
      - created_at
      - dir_disabled
      - groups
      - id
      - last_synced_at
      - name
      - state
      - uid
      - updated_at
      type: object
    webtypes.NSSAccountSummaryResponse:
      properties:
        dn:
          type: string
        gecos:
          type: string
        gid:
          description: |-
            GID is the stored gid attribute, before nss.auto_private_groups;
            absent when the entry has none (accepted only under "true").
          type: integer
        id:
          description: |-
            ID is the row id, the list's cursor. The account's own pages are
            addressed by UID.
          type: string
        last_synced_at:
          description: |-
            LastSyncedAt is the last sync or on-demand read that reached the
            directory for this entry.
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
        uid:
          type: integer
      required:
      - dn
      - id
      - last_synced_at
      - name
      - state
      - uid
      type: object
    webtypes.NSSAccountsResponse:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/webtypes.NSSAccountSummaryResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last row, absent on the last page.
          type: string
        total:
          description: Total is how many stored accounts match the search, across
            all pages.
          type: integer
      required:
      - accounts
      - total
      type: object
    webtypes.NSSCollisionEntryResponse:
      description: |-
        Holder is the stored row holding the value; Other the entry
        contending for it.
      properties:
        deleted_at:
          type: string
        dn:
          type: string
        missing_since:
          description: |-
            MissingSince and DeletedAt are the stored row's, absent while it
            resolves.
          type: string
        name:
          type: string
        number:
          description: Number is the uid (accounts) or gid (groups) the entry carries.
          type: integer
        stored:
          description: |-
            Stored is false for an entry the sync refused to store because the
            holder has its number or name; it is known only by what it carried.
          type: boolean
        tombstone:
          description: |-
            Tombstone is true for a stored row the directory no longer has and
            that is kept, holding its number and name, until
            nss.tombstone_retention or an admin purges it.
          type: boolean
      required:
      - dn
      - name
      - number
      - stored
      - tombstone
      type: object
    webtypes.NSSCollisionResponse:
      properties:
        first_seen_at:
          type: string
        holder:
          $ref: '#/components/schemas/webtypes.NSSCollisionEntryResponse'
        kind:
          $ref: '#/components/schemas/model.NSSCollisionKind'
        last_seen_at:
          type: string
        other:
          $ref: '#/components/schemas/webtypes.NSSCollisionEntryResponse'
        value:
          description: Value is the contested uid, gid or name, as text.
          type: string
      required:
      - first_seen_at
      - holder
      - kind
      - last_seen_at
      - other
      - value
      type: object
    webtypes.NSSCollisionsResponse:
      properties:
        collisions:
          items:
            $ref: '#/components/schemas/webtypes.NSSCollisionResponse'
          type: array
          uniqueItems: false
      required:
      - collisions
      type: object
    webtypes.NSSGroupDetailResponse:
      properties:
        created_at:
          type: string
        deleted_at:
          type: string
        directory_id:
          type: string
        dn:
          type: string
        gid:
          type: integer
        id:
          type: string
        last_synced_at:
          type: string
        member_count:
          description: MemberCount is the stored membership rows, served or not.
          type: integer
        missing_since:
          type: string
        name:
          type: string
        not_served:
          $ref: '#/components/schemas/model.NSSNotServedReason'
        pending_gid:
          type: integer
        pending_since:
          type: string
        served:
          $ref: '#/components/schemas/webtypes.NSSServedGroupResponse'
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
        updated_at:
          type: string
        withheld_at:
          type: string
        withheld_reason:
          description: WithheldReason sums up the collisions that withhold the row.
          type: string
      required:
      - created_at
      - gid
      - id
      - last_synced_at
      - member_count
      - name
      - state
      - updated_at
      type: object
    webtypes.NSSGroupMemberResponse:
      properties:
        name:
          description: |-
            Name and State describe the stored account with that uid, and are
            absent when no stored account has it (such a member is never
            served).
          type: string
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
        uid:
          type: integer
      required:
      - uid
      type: object
    webtypes.NSSGroupMembersResponse:
      properties:
        members:
          items:
            $ref: '#/components/schemas/webtypes.NSSGroupMemberResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: this page's last
            uid, absent on the last page.
          type: string
        total:
          description: Total is the group's membership rows, across all pages.
          type: integer
      required:
      - members
      - total
      type: object
    webtypes.NSSGroupSummaryResponse:
      properties:
        dn:
          type: string
        gid:
          type: integer
        id:
          description: |-
            ID is the row id, the list's cursor. The group's own pages are
            addressed by GID.
          type: string
        last_synced_at:
          type: string
        member_count:
          description: MemberCount is the stored membership rows, served or not.
          type: integer
        name:
          type: string
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
      required:
      - dn
      - gid
      - id
      - last_synced_at
      - member_count
      - name
      - state
      type: object
    webtypes.NSSGroupsResponse:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/webtypes.NSSGroupSummaryResponse'
          type: array
          uniqueItems: false
        next_cursor:
          description: |-
            NextCursor is the after for the following page: the id of this
            page's last row, absent on the last page.
          type: string
        total:
          description: Total is how many stored groups match the search, across all
            pages.
          type: integer
      required:
      - groups
      - total
      type: object
    webtypes.NSSKeyListResponse:
      properties:
        can_create:
          description: CanCreate is whether the caller may create keys.
          type: boolean
        keys:
          items:
            $ref: '#/components/schemas/webtypes.NSSKeyResponse'
          type: array
          uniqueItems: false
      required:
      - can_create
      - keys
      type: object
    webtypes.NSSKeyResponse:
      properties:
        created_at:
          type: string
        created_by:
          description: |-
            CreatedBy is the creator's users.id, and CreatedByUsername their
            username, empty when the account is gone.
          type: string
        created_by_username:
          type: string
        current_generation:
          description: CurrentGeneration is 1 at creation and grows by one per rotation.
          type: integer
        description:
          type: string
        expires_at:
          description: |-
            ExpiresAt is when the key stops being accepted, set at creation and
            renewed by each rotation; absent for a key that never expires.
          type: string
        group_name:
          description: |-
            GroupName is the group whose members manage this key, empty for
            none.
          type: string
        id:
          description: |-
            ID is "nss_" and 8 base32 characters, what hosts send as
            X-Ssoossh-Key-Id. Fixed for the key's life.
          type: string
        key_source_alert_at:
          description: |-
            KeySourceAlertAt is when the key source alert
            (nss.key_source_alert) last fired for the key: more source
            addresses in one day than the limit. Absent unless it fired in the
            last 7 days.
          type: string
        last_used_at:
          description: |-
            LastUsedAt is the last lookup any host made with the key, from the
            retained usage, so up to a minute behind; absent for a key no host
            has used.
          type: string
        miss_rate_alert_at:
          description: |-
            MissRateAlertAt is when the miss rate alert (nss.miss_alert_rate)
            last fired for the key: many lookups for names the directory does
            not hold. Absent unless it fired in the last 7 days.
          type: string
        name:
          type: string
        notification_email:
          description: NotificationEmail is where the key's mail goes, empty for nowhere.
          type: string
        permissions:
          description: |-
            Permissions is what the caller may do with this key, decided by the
            server so the UI never reimplements the role matrix. A revoked key
            carries view alone.
          items:
            $ref: '#/components/schemas/model.NSSKeyPermission'
          type: array
          uniqueItems: false
        previous_expires_at:
          description: |-
            PreviousExpiresAt is when the previous secret stops being accepted,
            absent when there is no previous secret.
          type: string
        revoked_at:
          description: |-
            RevokedAt, RevokedBy (a users.id) and RevokedByUsername record a
            revocation, absent while the key is live.
          type: string
        revoked_by:
          type: string
        revoked_by_username:
          type: string
        rotated_at:
          description: RotatedAt is the last rotation, absent for a key never rotated.
          type: string
        status:
          $ref: '#/components/schemas/model.NSSKeyStatus'
        updated_at:
          type: string
      required:
      - created_at
      - created_by
      - created_by_username
      - current_generation
      - description
      - group_name
      - id
      - name
      - notification_email
      - permissions
      - status
      - updated_at
      type: object
    webtypes.NSSKeySecretResponse:
      properties:
        key:
          $ref: '#/components/schemas/webtypes.NSSKeyResponse'
        secret:
          type: string
      required:
      - key
      - secret
      type: object
    webtypes.NSSKeySettingsResponse:
      properties:
        max_lifetime_seconds:
          description: |-
            MaxLifetimeSeconds is nss.key_max_lifetime: the latest a new key
            may expire, and its expiry when none is given. 0 sets no limit, and
            a key created without a date then never expires.
          type: integer
        rotation_grace_seconds:
          description: |-
            RotationGraceSeconds is nss.key_rotation_grace: how long the
            previous secret stays accepted after a rotation.
          type: integer
      required:
      - max_lifetime_seconds
      - rotation_grace_seconds
      type: object
    webtypes.NSSKeyUsageResponse:
      properties:
        next_cursor:
          description: NextCursor is the after for the following page, absent on the
            last.
          type: string
        rows:
          items:
            $ref: '#/components/schemas/webtypes.NSSKeyUsageRowResponse'
          type: array
          uniqueItems: false
        total:
          description: Total counts every retained row for the key, across all pages.
          type: integer
      required:
      - rows
      - total
      type: object
    webtypes.NSSKeyUsageRowResponse:
      properties:
        day:
          description: Day is midnight UTC of the day counted.
          type: string
        first_seen:
          type: string
        generation:
          type: integer
        last_seen:
          type: string
        lookups:
          type: integer
        misses:
          type: integer
        source_ip:
          type: string
      required:
      - day
      - first_seen
      - generation
      - last_seen
      - lookups
      - misses
      - source_ip
      type: object
    webtypes.NSSLinkedPersonResponse:
      description: |-
        Person is the ssoossh user linked to this entry at login. Absent for
        shared and service accounts and for anyone who has not logged in.
      properties:
        disabled_at:
          type: string
        display_name:
          type: string
        user_id:
          description: UserID addresses the person's admin page, /admin/users/{id}.
          type: string
        username:
          type: string
      required:
      - user_id
      - username
      type: object
    webtypes.NSSPendingGroupIDChange:
      properties:
        dn:
          type: string
        gid:
          type: integer
        name:
          type: string
        pending_gid:
          type: integer
        pending_since:
          type: string
      required:
      - dn
      - gid
      - name
      - pending_gid
      - pending_since
      type: object
    webtypes.NSSPendingIDChangesResponse:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/webtypes.NSSPendingGroupIDChange'
          type: array
          uniqueItems: false
        users:
          items:
            $ref: '#/components/schemas/webtypes.NSSPendingUserIDChange'
          type: array
          uniqueItems: false
      required:
      - groups
      - users
      type: object
    webtypes.NSSPendingUserIDChange:
      properties:
        dn:
          type: string
        gid:
          type: integer
        name:
          type: string
        pending_gid:
          type: integer
        pending_since:
          description: PendingSince is the first sync that saw the pending value.
          type: string
        pending_uid:
          description: |-
            PendingUID and PendingGID are the directory's values, absent when
            that number has not changed.
          type: integer
        uid:
          description: |-
            UID and GID are the stored values, still served. GID is absent when
            the entry has no gid attribute (accepted only under
            nss.auto_private_groups "true").
          type: integer
      required:
      - dn
      - name
      - pending_since
      - uid
      type: object
    webtypes.NSSPurgedTombstoneResponse:
      properties:
        dn:
          type: string
        name:
          type: string
        number:
          description: Number is the uid or gid the row held.
          type: integer
      required:
      - dn
      - name
      - number
      type: object
    webtypes.NSSRotationReportResponse:
      properties:
        current_generation:
          type: integer
        gone:
          type: integer
        grace_days_left:
          description: |-
            GraceDaysLeft is whole days, rounded up, until the previous secret
            stops working; zero when there is none or it has ended.
          type: integer
        key_id:
          type: string
        not_switched:
          type: integer
        previous_expires_at:
          type: string
        rotated_at:
          type: string
        rows:
          items:
            $ref: '#/components/schemas/webtypes.NSSRotationReportRowResponse'
          type: array
          uniqueItems: false
        switched:
          type: integer
      required:
      - current_generation
      - gone
      - grace_days_left
      - key_id
      - not_switched
      - rows
      - switched
      type: object
    webtypes.NSSRotationReportRowResponse:
      properties:
        bucket:
          $ref: '#/components/schemas/model.NSSRotationBucket'
        first_seen:
          type: string
        last_generation:
          type: integer
        last_seen:
          type: string
        lookups:
          type: integer
        source_ip:
          type: string
      required:
      - bucket
      - first_seen
      - last_generation
      - last_seen
      - lookups
      - source_ip
      type: object
    webtypes.NSSServedAccountResponse:
      description: |-
        Served is what a host's lookup by this uid gets now. Absent when the
        lookup finds nothing; NotServed then says why.
      properties:
        gecos:
          type: string
        gid:
          description: GID is the primary gid after nss.auto_private_groups.
          type: integer
        groups:
          description: Groups is every membership served, primary first.
          items:
            $ref: '#/components/schemas/webtypes.NSSServedMembershipResponse'
          type: array
          uniqueItems: false
        home:
          type: string
        name:
          type: string
        shell:
          type: string
        shell_pref:
          type: string
        status:
          $ref: '#/components/schemas/model.PosixStatus'
        uid:
          type: integer
      required:
      - gid
      - groups
      - name
      - status
      - uid
      type: object
    webtypes.NSSServedGroupResponse:
      description: |-
        Served is what a host's group lookup by this gid gets now. Absent
        when the lookup finds nothing; NotServed then says why.
      properties:
        gid:
          type: integer
        member_count:
          description: |-
            MemberCount is how many member names the host receives, after
            nss.max_group_members.
          type: integer
        members_truncated:
          description: MembersTruncated is true when nss.max_group_members cut the
            list.
          type: boolean
        name:
          type: string
      required:
      - gid
      - member_count
      - members_truncated
      - name
      type: object
    webtypes.NSSServedMembershipResponse:
      properties:
        gid:
          type: integer
        name:
          type: string
      required:
      - gid
      - name
      type: object
    webtypes.NSSShellsResponse:
      properties:
        allowed_shells:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - allowed_shells
      type: object
    webtypes.NSSStoredMembershipResponse:
      properties:
        gid:
          type: integer
        name:
          description: |-
            Name and State describe the stored group with that gid, and are
            absent when no stored group has it.
          type: string
        state:
          $ref: '#/components/schemas/model.NSSEntryState'
      required:
      - gid
      type: object
    webtypes.NSSSyncCountsResponse:
      properties:
        created:
          type: integer
        failed:
          description: Failed is the entries that could not be checked or written.
          type: integer
        missing:
          description: |-
            Missing is the rows marked missing for the first time; Tombstoned
            the rows missing for nss.tombstone_after and now deleted.
          type: integer
        refused:
          description: |-
            Refused is the new entries not stored because another row, a
            tombstone included, holds their number or name.
          type: integer
        seen:
          description: Seen is the entries the directory returned.
          type: integer
        skipped:
          description: |-
            Skipped is the entries rejected because a value did not parse (a
            name the POSIX rules refuse, a uid that is not a number, a relative
            home); each is logged with its DN.
          type: integer
        tombstoned:
          type: integer
        updated:
          type: integer
      required:
      - created
      - failed
      - missing
      - refused
      - seen
      - skipped
      - tombstoned
      - updated
      type: object
    webtypes.NSSSyncRunResponse:
      description: |-
        NSS is what the NSS directory's full sync concluded when an admin
        ran this pass by hand with nss.enabled on: POST /api/admin/ldap/sync
        runs both, except on a dry run. Absent otherwise, and on every
        scheduled pass, which the NSS sync does not ride on.
      properties:
        accounts:
          $ref: '#/components/schemas/webtypes.NSSSyncCountsResponse'
        error:
          description: |-
            Error is why the run stopped short: the directory could not be
            reached or searched, or another run was in progress on this
            instance. Nothing is marked missing by a run that stopped short.
          type: string
        finished_at:
          description: FinishedAt is absent when the run stopped on an error.
          type: string
        full:
          description: |-
            Full is true for a full run, which is the only kind that marks
            entries missing; the admin trigger always runs one.
          type: boolean
        groups:
          $ref: '#/components/schemas/webtypes.NSSSyncCountsResponse'
        started_at:
          type: string
      required:
      - accounts
      - full
      - groups
      - started_at
      type: object
    webtypes.NotificationGroupResponse:
      properties:
        description:
          description: Description is one sentence saying what the group's kinds are
            about.
          type: string
        group:
          description: Group is the identifier kinds name in NotificationKindResponse.Group.
          type: string
        title:
          description: Title is the group's heading.
          type: string
      required:
      - description
      - group
      - title
      type: object
    webtypes.NotificationKindResponse:
      properties:
        description:
          description: Description is the sentence explaining when this one fires.
          type: string
        enabled:
          description: |-
            Enabled is this user's answer, or the kind's default when they have
            never given one.
          type: boolean
        group:
          description: Group names the NotificationGroupResponse this kind is shown
            under.
          type: string
        kind:
          description: Kind is the stable identifier, the key the update body uses.
          type: string
        title:
          description: Title is the short label shown beside the toggle.
          type: string
      required:
      - description
      - group
      - kind
      - title
      type: object
    webtypes.NotificationPreferencesResponse:
      properties:
        address:
          description: |-
            Address is where notifications would be sent, from the users table.
            Empty when the identity provider releases no email claim — the other
            reason nothing arrives, and equally worth showing.
          type: string
        detail_level:
          $ref: '#/components/schemas/model.DetailLevel'
        groups:
          description: Groups is every group the kinds are shown under, in page order.
          items:
            $ref: '#/components/schemas/webtypes.NotificationGroupResponse'
          type: array
          uniqueItems: false
        kinds:
          description: |-
            Kinds is every notification the server knows how to send, in a
            stable order.
          items:
            $ref: '#/components/schemas/webtypes.NotificationKindResponse'
          type: array
          uniqueItems: false
        mail_enabled:
          description: |-
            MailEnabled reports whether the server can send mail at all. False
            means the toggles are still recorded but nothing is delivered, which
            the page says out loud rather than leaving the user to infer.
          type: boolean
      required:
      - detail_level
      - groups
      - kinds
      type: object
    webtypes.PosixAccountResponse:
      description: |-
        Posix is the caller's own POSIX account, or null when NSS is off or
        no directory account is linked to them yet.
      properties:
        name:
          type: string
        shell_pref:
          description: |-
            ShellPref is the shell name chosen from nss.allowed_shells, or null
            when the account takes the directory's shell.
          type: string
        uid:
          type: integer
      required:
      - name
      - shell_pref
      - uid
      type: object
    webtypes.ReEnableUserRequestBody:
      properties:
        reason:
          description: |-
            Reason explains why the user is being re-enabled, e.g. "cleared with
            security, SEC-1234". Required on the same terms as the disable
            reason, and as valuable to the person after this one.
          type: string
      required:
      - reason
      type: object
    webtypes.RequestDetailResponse:
      properties:
        already_closed:
          type: boolean
        approval_url:
          type: string
        caller_gid:
          type: integer
        caller_pid:
          type: integer
        caller_ppid:
          type: integer
        caller_uid:
          type: integer
        client:
          type: string
        client_mode:
          type: string
        client_policy:
          $ref: '#/components/schemas/webtypes.ClientPolicyResponse'
        client_time:
          type: string
        created_at:
          type: string
        decided_accept_language:
          type: string
        decided_at:
          type: string
        decided_by_email:
          type: string
        decided_by_groups:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_other_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_outcome:
          type: string
        decided_by_service_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_subject:
          type: string
        decided_by_username:
          type: string
        decided_forwarded_for:
          type: string
        decided_granted_options:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        decided_policy_explanation:
          type: string
        decided_principals:
          description: |-
            What the approval granted and why: the principals selected, the
            options after every narrowing, and the lifetime policy's own
            explanation as a JSON document (see service.PolicyExplanation).
            Approvals only; absent for denials and for decisions predating the
            columns.
          items:
            type: string
          type: array
          uniqueItems: false
        decided_source_ip:
          type: string
        decided_user_agent:
          type: string
        expires_at:
          description: |-
            ExpiresAt is when the request stops being approvable, from its own
            type's budget. The page counts down to it, which matters most for
            console requests: their budget is deliberately the shortest, and an
            approver who cannot see the clock cannot tell a slow OIDC login from
            a request that has already died.
          type: string
        granted:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        hostname:
          description: |-
            The console context the request carried: which machine it claims to
            be, through which PAM service, at which terminal, and what it
            reported as the remote host.

            Every one of them is self-reported by an unauthenticated caller and
            the UI must render them as claims rather than as facts — they are
            what lets a human notice "I am at my desk, why is there a console
            login on rack07", not what authorizes anything. A non-empty
            RemoteHost on a console request is worth flagging outright: a real
            console has no remote host.

            Set for PAM and console requests; empty for the others.
          type: string
        id:
          type: string
        is_owned_by_you:
          type: boolean
        local_hostname:
          type: string
        local_username:
          type: string
        machine_id:
          type: string
        os:
          type: string
        pam_service:
          type: string
        principals:
          items:
            type: string
          type: array
          uniqueItems: false
        process:
          type: string
        public_key:
          type: string
        remote_host:
          type: string
        requested:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        requesting_user:
          description: |-
            The rest of the host context, same trust: who invoked the service
            (PAM_RUSER), the command line asking, the process identifiers, a
            stable machine id, the platform, the module and its configured
            mode, the host's clock, and the CA fingerprints the host trusts.
            See apitypes.PAMRequestBody for each. Set for PAM and console
            requests; the numeric ones are absent rather than zero when the
            module did not report them.
          type: string
        selectable_extensions:
          description: |-
            SelectableExtensions is cert_options.<type>.extensions — the ceiling,
            and so exactly the set an approver may choose from. Empty means there
            is nothing to choose and the UI offers no picker.

            Distinct from Granted.Extensions, which is what this request would
            get if approved untouched: for a request that asked for nothing, that
            is empty while the ceiling may be large. The picker needs the ceiling
            to know which toggles exist and Granted to know which start on.
          items:
            type: string
          type: array
          uniqueItems: false
        source_ip:
          type: string
        status:
          $ref: '#/components/schemas/model.CertificateRequestStatus'
        target_account:
          description: |-
            TargetAccount is the local account a PAM or console request is
            authenticating: who `sudo` is being run as, or the account typed at
            the `login:` prompt. Empty for every other type. It is
            reported by an unauthenticated client and never becomes a principal
            (see model.CertificateRequest.Username), so the UI must present it as
            what is being attempted rather than as what is being granted. Without
            it the approver cannot see which account the sudo is for, since the
            principals now describe the approver instead.
          type: string
        trusted_ca_fingerprints:
          items:
            type: string
          type: array
          uniqueItems: false
        tty:
          type: string
        type:
          $ref: '#/components/schemas/model.CertificateType'
        valid_seconds:
          type: integer
        viewer_ip:
          description: |-
            ViewerIP is the address this server sees the approving browser
            connect from, resolved the same way as SourceIP, so the approval page
            can set the two side by side. Display only and never a reason to
            refuse: plenty of people approve from one machine a request their
            terminal made on another. A difference is something the approver can
            check, where everything the requester reports about itself is not.
          type: string
      required:
      - already_closed
      - approval_url
      - created_at
      - expires_at
      - granted
      - id
      - is_owned_by_you
      - principals
      - public_key
      - requested
      - source_ip
      - status
      - type
      - valid_seconds
      type: object
    webtypes.ResolveCodeRequestBody:
      properties:
        code:
          type: string
      required:
      - code
      type: object
    webtypes.ResolveCodeResponse:
      properties:
        approval_url:
          description: |-
            ApprovalURL is the page to send the browser to. Returned rather than
            assembled client-side so the one definition of the path stays on the
            server, alongside the create response's.
          type: string
        request_id:
          type: string
      required:
      - approval_url
      - request_id
      type: object
    webtypes.ServiceEnrollmentResponse:
      properties:
        approved_by_username:
          description: |-
            ApprovedByUsername is who approved this code. Provenance, not
            ownership — the reader may well not be them. Empty if that user's
            record has since gone.
          type: string
        certificate_request_id:
          description: |-
            CertificateRequestID is the request this enrollment was approved
            from, and the id the retrieval log at
            /api/certs/requests/{id}/retrievals is keyed on. Omitted for an
            enrollment with no request linked to it.
          type: string
        certificate_valid_seconds:
          description: |-
            CertificateValidSeconds is how long each redeemed certificate is
            valid for, measured from its own redemption rather than from
            approval. Omitted for an enrollment created before the code and
            certificate lifetimes were split, where ExpiresAt bounded both.
          type: integer
        created_at:
          description: CreatedAt is when the enrollment was approved.
          type: string
        expires_at:
          description: |-
            ExpiresAt bounds the code, not the certificates it produces: past it
            `service retrieve` stops redeeming, and the unattended job behind it
            needs a fresh enrollment.
          type: string
        first_redeemed_at:
          description: |-
            FirstRedeemedAt is the first successful redemption, absent for a code
            that has never produced a certificate.
          type: string
        id:
          type: string
        key_id:
          description: |-
            KeyID is likewise fixed at approval and lands verbatim in every
            certificate, which is what a target host's logs record.
          type: string
        last_retrieved_at:
          description: |-
            LastRetrievedAt is the most recent redemption attempt, successful or
            not. Together with RetrievalCount it is how the approver tells a code
            still driving a cron job from one nothing has used in months.
          type: string
        notification_email:
          description: |-
            NotificationEmail is where notifications about this enrollment go
            instead of to every holder of the service account. Empty means they
            fan out, which is the default. Any holder may change it.
          type: string
        options:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        principals:
          description: |-
            Principals is what every certificate this code produces carries. For
            a service enrollment that is the single service account the approver
            picked, fixed at approval time and never re-derived at redemption.
          items:
            type: string
          type: array
          uniqueItems: false
        public_key_fingerprint:
          description: |-
            PublicKeyFingerprint identifies the keypair the code is bound to.
            `service retrieve` never sends a public key, so a code lifted without
            this keypair produces nothing usable.

            Empty if the stored key could not be parsed — a display gap, not a
            reason to withhold the rest of the row.
          type: string
        retrieval_count:
          description: |-
            RetrievalCount counts every logged redemption attempt, including
            those that failed at signing — someone held the code either way.
          type: integer
        service_account:
          description: |-
            ServiceAccount is the account this code was approved for, and who
            owns it: everyone holding the account (see
            https://mnestor.github.io/ssoossh/concepts/service-certificates/). It
            is what the service codes page groups by, which is why it is its own
            field rather than left to be read out of Principals.
          type: string
      required:
      - created_at
      - expires_at
      - id
      - key_id
      - options
      - principals
      - retrieval_count
      - service_account
      type: object
    webtypes.ServiceEnrollmentsResponse:
      properties:
        enrollments:
          items:
            $ref: '#/components/schemas/webtypes.ServiceEnrollmentResponse'
          type: array
          uniqueItems: false
        expiring_soon_seconds:
          description: |-
            ExpiringSoonSeconds is how far ahead of a code's expiry the page
            calls it expiring soon: mail.expiry_reminder_lead, so the page and
            the first reminder mail agree, or a week when that is zero.
          type: integer
      required:
      - enrollments
      - expiring_soon_seconds
      type: object
    webtypes.SetNotificationEmailRequestBody:
      properties:
        notification_email:
          description: |-
            NotificationEmail is the address every notification about this
            enrollment goes to. Empty clears it, restoring fan-out to every
            holder of the service account.

            No omitempty: an absent field and an empty one must mean the same
            thing here, because clearing the address is the whole reason to send
            an empty one.
          type: string
      type: object
    webtypes.UpdateDisplayPreferencesBody:
      properties:
        detail_level:
          $ref: '#/components/schemas/model.DetailLevel'
      required:
      - detail_level
      type: object
    webtypes.UpdateNSSKeyBody:
      properties:
        description:
          type: string
        group_name:
          type: string
        notification_email:
          type: string
      type: object
    webtypes.UpdateNotificationPreferencesBody:
      properties:
        detail_level:
          $ref: '#/components/schemas/model.DetailLevel'
        kinds:
          additionalProperties:
            type: boolean
          description: |-
            Kinds maps a notification kind to whether it should be sent. An
            unknown key is rejected rather than ignored: silently dropping it
            would report success for a preference that was never stored.
          type: object
      required:
      - kinds
      type: object
    webtypes.UpdateShellBody:
      properties:
        shell_pref:
          type: string
      type: object
    webtypes.VersionResponse:
      properties:
        commit:
          description: |-
            Commit is the git revision the build came from. It is what identifies
            a "development" build, which has no release of its own to point at.
          type: string
        github_url:
          description: |-
            GithubURL is the project's source repository. Served rather than
            hardcoded in the frontend so that a fork only has to change
            internal/version.
          type: string
        release_url:
          description: |-
            ReleaseURL points at the GitHub release matching Version. Omitted for
            an untagged build, where there is no release page to link to.
          type: string
        version:
          description: |-
            Version is the release this binary was built from, without the tag's
            leading "v" (goreleaser and the Makefile both strip it). Untagged
            builds report the "development" default from internal/version.
          type: string
      required:
      - commit
      - github_url
      - version
      type: object
  securitySchemes:
    sessionCookie:
      description: The fleet API key's secret, shown once when the key is created
        or rotated. Sent with the id on every NSS lookup; the server removes it from
        the request before anything is logged.
      in: header
      name: X-Ssoossh-Key-Secret
      type: apiKey
externalDocs:
  description: ssoossh documentation
  url: https://mnestor.github.io/ssoossh/
info:
  contact:
    name: ssoossh
    url: https://github.com/mnestor/ssoossh
  description: |-
    SSO for SSH. Two audiences share this surface:

    - **The client** (`ssoossh`, and `pam_ssoossh`) creates certificate requests and waits on the result over SSE. These endpoints are unauthenticated: a request's ID is an unguessable UUID and is itself the capability, and authorization happens at the approval step.
    - **The web UI** reads and approves. Everything under a session cookie.

    **Every** JSON body this API emits is the `{data, error}` envelope from `.claude/rules/server-api.md` — success and error, client-facing and web-UI-facing, including the data of each server-sent event. One decode path, no exceptions to remember.

    This file is generated from Go annotations by `make openapi`. Edit the handlers, not the YAML.
  license:
    name: MIT
  title: ssoosshd API
  version: "0.1"
openapi: 3.1.0
paths:
  /api/admin/audit:
    get:
      description: |-
        Returns the administrative audit stream newest first,
        optionally filtered to one action, one source address, or
        both. Both filters are exact matches. The source address is
        the one the server observed for the client the event is
        about (detail.source_ip), never the approver's address and
        never one the client reported. The database copy is a bounded
        cache of recent events; the shipped audit log is the archive,
        and any other search happens there.
        Uses cursor-based pagination (not offset): pass the previous
        page's next_cursor as after.
      parameters:
      - description: 'Audit event ID to start after (cursor): the previous page''s
          next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      - description: Only events of this audit action; must be in the taxonomy
        example: cert.request_refused_network
        in: query
        name: action
        schema:
          type: string
      - description: Only events whose observed source is this IP address
        example: 192.0.2.10
        in: query
        name: source_ip
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.AuditEventsResponse'
          description: Audit events
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid paging parameters, an after that names no audit event,
            offset, an unknown action, or a source_ip that is not an IP address
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: View the recent audit event feed (auditor-only)
      tags:
      - admin
  /api/admin/certificates/history:
    get:
      description: |-
        Returns issued certificates across all users, useful for audits,
        incident review, and tracking "who issued this?". Supports
        searching over key ID, principals, serial number, fingerprint, and owner
        username/email, filtering by type and expiration status. Newest first, with
        cursor-based pagination (not offset): pass the previous page's next_cursor as after.
      parameters:
      - description: 'Certificate ID to start after (cursor): the previous page''s
          next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Number of results (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      - description: Search term (max 200 chars)
        example: alice
        in: query
        name: q
        schema:
          type: string
      - description: Filter by certificate type (user/service/pam/console)
        example: user
        in: query
        name: type
        schema:
          type: string
      - description: Filter by expiration (live/expired)
        example: live
        in: query
        name: status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CertificateListAdminEnvelope'
          description: Certificates, newest first, with the total and the cursor for
            the next page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid parameters, an after that names no certificate, or
            offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: View certificate history across all users (auditor-only)
      tags:
      - admin
  /api/admin/config:
    get:
      description: |-
        Returns every key of the server's effective configuration,
        grouped by top-level section, with secrets redacted (CA key,
        HSM PIN, client secret, cookie signing key, database
        connection string, LDAP bind password, SMTP password). A
        redacted key still reports whether a value is set. Useful for
        debugging and audit trails.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.EffectiveConfigResponse'
          description: Current effective configuration
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not an admin
      security:
      - sessionCookie: []
      summary: View effective server configuration (admin only)
      tags:
      - admin
  /api/admin/diagnostics/run:
    post:
      description: |-
        Runs the deployment self-checks and returns what they found:
        whether the server can reach its own public URL, how the
        client IP is resolved through http.trusted_proxies, whether
        the edge weakens the security headers the app sets, and
        whether the edge adds dangerous CORS headers. The edge checks
        call the server's own public_url back through whatever sits in
        front of it; the target is always public_url and cannot be
        supplied by the caller. Nothing is written.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.DiagnosticsResponse'
          description: What the checks found
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Too many runs
      security:
      - sessionCookie: []
      summary: Run deployment self-checks (admin-only)
      tags:
      - admin
  /api/admin/enrollments:
    get:
      description: |-
        Returns a paged list of all service enrollments across users, searchable
        by approver name, principals, key ID, or request ID. Visible to auditors.
        Newest first, with cursor-based pagination (not offset): pass the previous
        page's next_cursor as after.
      parameters:
      - description: 'Enrollment ID to start after (cursor): the previous page''s
          next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      - description: Search query (max 200 chars)
        example: '"alice"'
        in: query
        name: q
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.AdminEnrollmentsResponse'
          description: Paged enrollment list
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid paging/search parameters, an after that names no enrollment,
            or offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: List all service enrollments (auditor-only)
      tags:
      - admin
  /api/admin/enrollments/{id}:
    get:
      description: |-
        Returns full details of one enrollment including its retrieval log
        and any historical reassignments. Visible to auditors and to
        holders of the enrollment's service account.
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: Full enrollment details
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Enrollment not found
      security:
      - sessionCookie: []
      summary: Get enrollment details (auditor-only)
      tags:
      - admin
  /api/admin/enrollments/{id}/expire:
    patch:
      description: |-
        Immediately marks an enrollment as expired, preventing future
        service certificate retrievals. The operation is idempotent.
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webtypes.ExpireEnrollmentRequestBody'
              description: Expiry reason (required)
              summary: request
        description: Expiry reason (required)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: Enrollment expired
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin or SOC
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Enrollment not found
      security:
      - sessionCookie: []
      summary: Expire an enrollment (admin or SOC)
      tags:
      - admin
  /api/admin/identity/echo/start:
    post:
      description: |-
        Returns the authorization URL for a fresh OIDC round trip
        carrying prompt=login. The callback renders the decoded ID
        token instead of establishing a session, and the caller's
        existing session is left exactly as it was.

        The echo re-authenticates rather than remembering: the server
        keeps only the claims the configuration maps, so there is no
        stored copy of the rest to show. Nothing about the result is
        written down — it reaches the page in the redirect fragment,
        which never reaches the server at all.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.IdentityEchoStartResponse'
          description: Where to send the browser
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
      security:
      - sessionCookie: []
      summary: Start a claims echo (admin-only)
      tags:
      - admin
  /api/admin/ldap/probe:
    post:
      description: |-
        Runs one directory lookup through the login path's three
        stages — lookup, field resolution, then the merge and
        allowlist — and stops before the write. Reports the filter it
        actually sent, every attribute the directory returned rather
        than the ones the configuration names, what each field
        resolved to, which group values the allowlist would drop, and
        the config lines that would keep what is currently ignored.

        The connection is not part of the request: the probe always
        uses the running ldap.url, bind credentials and base_dn, so
        it cannot be pointed at another host. It writes nothing.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.LDAPProbeRequestBody'
                description: What to ask the directory
                summary: request
        description: What to ask the directory
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.LDAPProbeResponse'
          description: What the probe found
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid request, filter or bindings
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The user to bind against does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Too many probes
      security:
      - sessionCookie: []
      summary: Probe the directory (admin-only, read-only)
      tags:
      - admin
  /api/admin/ldap/status:
    get:
      description: |-
        Reports whether directory enrichment is enabled, the
        connection and query the probe is pinned to, the sync
        settings, and the most recent sync pass on any instance.
        Names no credential: the bind password is never part of this
        response. Answers "is the sync even running", which before
        the run record could only be answered by reading a log on
        whichever instance happened to run it.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.LDAPStatusResponse'
          description: Directory status
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
      security:
      - sessionCookie: []
      summary: Directory sync status and probe target (admin-only)
      tags:
      - admin
  /api/admin/ldap/sync:
    post:
      description: |-
        Runs the same pass the scheduler runs, on this instance, and
        returns what it concluded. One at a time: a pass already in
        progress makes this a 409 rather than stacking a second one
        over the same users. With dry_run the pass reads the
        directory and changes nothing, reporting the disables and
        re-enables it would have performed — which is what makes it
        safe to press during an incident.

        With nss.enabled on, a pass that is not a dry run also runs
        the NSS directory's full sync on this instance afterwards and
        reports it under nss: the POSIX accounts and groups the
        filters select, with each group's members limited to the
        accounts stored. The NSS sync has no dry run.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.LDAPSyncRequestBody'
                description: Sync options
                summary: request
        description: Sync options
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.LDAPSyncRunResponse'
          description: What the pass concluded
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: A sync is already running
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The directory could not be reached
      security:
      - sessionCookie: []
      summary: Run the directory sync now (admin-only)
      tags:
      - admin
  /api/admin/nss/collisions:
    get:
      description: |-
        Every pair of directory entries contending for one uid, gid
        or name, oldest first: the stored row holding the value,
        the other entry (stored, or refused and known only by what
        it carried), whether the holder is a tombstone, and since
        when. Neither side is served while a pair lasts. A pair
        goes when either entry is read again without the clash, at
        the latest on the next full sync.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSCollisionsEnvelope'
          description: The current collisions
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: NSS is disabled
      security:
      - sessionCookie: []
      summary: List uid, gid and name collisions (admin only)
      tags:
      - admin
  /api/admin/nss/groups:
    get:
      description: |-
        One page of the posix_groups rows, ordered by name then id, each with its derived state and
        its count of stored membership rows. Private groups are never stored, so are not listed.
        q matches a case-insensitive substring of the name or DN, and also the exact gid when it is a number.
        Uses cursor-based pagination (not offset): pass the previous page's next_cursor as after.
        Reads only the database: never the directory, and never writes.
      parameters:
      - description: 'Row id to start after (cursor): the previous page''s next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      - description: Search term matched against name and DN, or an exact gid
        example: engineering
        in: query
        name: q
        schema:
          type: string
      - description: State filter; omitted returns every state
        in: query
        name: state
        schema:
          enum:
          - withheld
          - tombstone
          - missing
          - pending
          - active
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSGroupsEnvelope'
          description: One page of groups
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid paging/search parameters, an unknown state, an after
            that names no group, or offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: NSS is disabled
      security:
      - sessionCookie: []
      summary: List the stored NSS groups (auditor and above)
      tags:
      - admin
  /api/admin/nss/groups/{gid}:
    get:
      description: |-
        The posix_groups row with this gid as stored, its count of stored membership rows, and what
        a host's lookup by the gid is served now, built by the lookup code itself, with the member
        names counted after nss.max_group_members (absent with not_served saying why when the
        lookup finds nothing). The members are paged from /api/admin/nss/groups/{gid}/members.
        Reads only the database: where a host's miss would ask the directory, this does not.
      parameters:
      - description: The group's stored gid
        in: path
        name: gid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSGroupDetailEnvelope'
          description: The group
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The gid is not a number
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No stored group has that gid, or NSS is disabled
      security:
      - sessionCookie: []
      summary: Read one stored NSS group (auditor and above)
      tags:
      - admin
  /api/admin/nss/groups/{gid}/accept-id-change:
    post:
      description: |-
        Applies the pending gid of the NSS group stored with this
        gid, in one transaction that re-keys its membership rows and
        moves every account whose primary gid it was, and audits it
        as nss.id_change_accepted. Refused with 409 when another
        group, a tombstone included, holds the new gid.
      parameters:
      - description: The group's stored gid
        in: path
        name: gid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSAcceptedGroupIDChangeEnvelope'
          description: The group after the change
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The gid is not a number
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No group with that gid has a pending change, or NSS is disabled
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Another group holds the new gid
      security:
      - sessionCookie: []
      summary: Accept a group's pending gid (admin only)
      tags:
      - admin
  /api/admin/nss/groups/{gid}/members:
    get:
      description: |-
        One page of the posix_group_members rows for this gid, ordered by uid, each with the stored
        account of that uid and its state when there is one (a member with no stored account is
        never served). The cursor is the last uid of the previous page. Reads only the database.
      parameters:
      - description: The group's stored gid
        in: path
        name: gid
        required: true
        schema:
          type: integer
      - description: 'Uid to start after (cursor): the previous page''s next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSGroupMembersEnvelope'
          description: One page of members
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The gid is not a number, invalid paging parameters, an after
            that is not a uid, or offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No stored group has that gid, or NSS is disabled
      security:
      - sessionCookie: []
      summary: List a stored NSS group's membership rows (auditor and above)
      tags:
      - admin
  /api/admin/nss/groups/{gid}/tombstone:
    delete:
      description: |-
        Deletes the tombstoned NSS group with this gid before
        nss.tombstone_retention, freeing its gid and name, and
        audits it as nss.tombstone_purged. Only a tombstone: a live
        group is 404.
      parameters:
      - description: The tombstone's gid
        in: path
        name: gid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSPurgedTombstoneEnvelope'
          description: The purged group
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The gid is not a number
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No tombstoned group has that gid, or NSS is disabled
      security:
      - sessionCookie: []
      summary: Purge a tombstoned group early (admin only)
      tags:
      - admin
  /api/admin/nss/pending-id-changes:
    get:
      description: |-
        Every NSS account and group whose directory entry now gives
        a stored uid or gid a different value. Hosts keep being
        served the stored value until an admin accepts the change
        (after re-owning files on the hosts) or the directory
        reverts; the server raises nss.id_change_pending daily
        meanwhile. Oldest first.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSPendingIDChangesEnvelope'
          description: The pending changes
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: NSS is disabled
      security:
      - sessionCookie: []
      summary: List pending uid and gid changes (admin only)
      tags:
      - admin
  /api/admin/nss/users:
    get:
      description: |-
        One page of the posix_users rows, ordered by name then id, each with its derived state.
        q matches a case-insensitive substring of the name or DN, and also the exact uid when it is a number.
        Uses cursor-based pagination (not offset): pass the previous page's next_cursor as after.
        Reads only the database: never the directory, and never writes.
      parameters:
      - description: 'Row id to start after (cursor): the previous page''s next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
