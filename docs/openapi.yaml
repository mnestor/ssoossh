        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: NSS is disabled
      security:
      - sessionCookie: []
      summary: List the stored NSS accounts (auditor and above)
      tags:
      - admin
  /api/admin/nss/users/{uid}:
    get:
      description: |-
        The posix_users row with this uid as stored, the ssoossh user linked to it, every stored
        membership row for the uid, and what a host's lookup by the uid is served now, built by
        the lookup code itself (absent with not_served saying why when the lookup finds nothing).
        Reads only the database: where a host's miss would ask the directory, this does not.
      parameters:
      - description: The account's stored uid
        in: path
