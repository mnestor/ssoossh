components:
  schemas:
    apitypes.ApproveResponse:
      properties:
        status:
          description: |-
            Status is always "signing" today — included so the response shape
            can carry more without a breaking change later.
          type: string
      required:
      - status
      type: object
    apitypes.CAResponse:
      properties:
        ca:
          type: string
      required:
      - ca
      type: object
    apitypes.CreateRequestResponse:
      properties:
        approval_url:
          type: string
        events_url:
          type: string
        request_id:
          type: string
      required:
      - approval_url
      - events_url
      - request_id
      type: object
    apitypes.DenyResponse:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    apitypes.PAMRequestBody:
      properties:
        public_key:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
        username:
          type: string
      required:
      - public_key
      - username
      type: object
    apitypes.RequestedOptions:
      properties:
        extensions:
          description: |-
            Extensions are the SSH certificate extensions requested (e.g.
            "permit-pty", "permit-agent-forwarding").
          items:
            type: string
          type: array
          uniqueItems: false
        force_command:
          description: ForceCommand is the SSH "force-command" critical option request.
          type: string
        no_touch_required:
          description: |-
            NoTouchRequired requests the OpenSSH "no-touch-required" extension.
            Only meaningful for service enrollment of a hardware-backed sk- key.
          type: boolean
        source_addresses:
          description: |-
            SourceAddresses are the caller's own interface addresses, unioned
            server-side with the address the request was observed from.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    apitypes.RetrieveRequestBody:
      properties:
        code:
          type: string
      required:
      - code
      type: object
    apitypes.RetrieveResponse:
      properties:
        certificate:
          type: string
      required:
      - certificate
      type: object
    apitypes.ServiceEnrollRequestBody:
      properties:
        public_key:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
      required:
      - public_key
      type: object
    apitypes.UserRequestBody:
      properties:
        local_hostname:
          type: string
        local_username:
          type: string
        public_key:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
      required:
      - public_key
      type: object
    gin.H:
      additionalProperties: {}
      type: object
    model.CertificateRequestStatus:
      enum:
      - pending
      - signing
      - approved
      - enrolled
      - denied
      - expired
      - failed
      type: string
      x-enum-varnames:
      - CertificateRequestStatusPending
      - CertificateRequestStatusSigning
      - CertificateRequestStatusApproved
      - CertificateRequestStatusEnrolled
      - CertificateRequestStatusDenied
      - CertificateRequestStatusExpired
      - CertificateRequestStatusFailed
    model.CertificateType:
      enum:
      - user
      - service
      - pam
      type: string
      x-enum-varnames:
      - CertificateTypeUser
      - CertificateTypeService
      - CertificateTypePAM
    openapidoc.ApproveEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.ApproveResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.BrandingEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.BrandingResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CAEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.CAResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CertificateListEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CertificateListResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CreateRequestEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.CreateRequestResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CurrentUserEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CurrentUserResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.DenyEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.DenyResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.EnrollmentRetrievalsEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.EnrollmentRetrievalsResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.ErrorEnvelope:
      properties:
        data:
          description: Data is always null on an error response.
        error:
          description: |-
            Error is a human-readable message. Branch on the HTTP status rather
            than this string; it is for humans and logs.
          example: certificate request "9f1c…" not found
          type: string
        error_code:
          description: |-
            ErrorCode is a machine-readable error classifier. One of the error_code
            constants from internal/apitypes; use this to decide whether to retry
            or branch on the failure mode.
          example: not_found
          type: string
      required:
      - error
      - error_code
      type: object
    openapidoc.HealthPayload:
      properties:
        status:
          example: ok
          type: string
      required:
      - status
      type: object
    openapidoc.LogoutEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/openapidoc.LogoutPayload'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.LogoutPayload:
      properties:
        logged_out:
          type: boolean
      required:
      - logged_out
      type: object
    openapidoc.NotificationPreferencesEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.NotificationPreferencesResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.RequestDetailEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.RequestDetailResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.RetrieveEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.RetrieveResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.VersionEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.VersionResponse'
        error:
          type: string
      required:
      - data
      type: object
    webtypes.ApproveRequestBody:
      properties:
        principals:
          items:
            type: string
          type: array
          uniqueItems: false
        service_account:
          type: string
      type: object
    webtypes.BrandingResponse:
      properties:
        login_notice:
          description: |-
            LoginNotice is a plain-text message shown on the login page before authentication.
            Empty disables the notice. Supports newlines for multi-line text.
          type: string
        logo_url:
          description: |-
            LogoURL is generated by the server and points to /api/branding/logo when
            a logo is configured. Always same-origin, never an external URL.
            Omitted entirely when no logo is configured (not set to empty string).
          type: string
        org_name:
          description: |-
            OrgName is the organization name displayed in the web UI (e.g., "Acme Corp").
            Empty disables organization-specific branding.
          type: string
      type: object
    webtypes.CertificateListResponse:
      properties:
        certificates:
          items:
            $ref: '#/components/schemas/webtypes.CertificateResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      required:
      - certificates
      type: object
    webtypes.CertificateOptionsResponse:
      properties:
        extensions:
          items:
            type: string
          type: array
          uniqueItems: false
        force_command:
          type: string
        no_touch_required:
          type: boolean
        source_addresses:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - extensions
      - no_touch_required
      type: object
    webtypes.CertificateResponse:
      properties:
        decided_accept_language:
          type: string
        decided_at:
          type: string
        decided_by_email:
          type: string
        decided_by_groups:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_other_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_outcome:
          type: string
        decided_by_service_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_subject:
          type: string
        decided_by_username:
          type: string
        decided_forwarded_for:
          type: string
        decided_source_ip:
          type: string
        decided_user_agent:
          type: string
        expires_at:
          type: string
        id:
          type: string
        issued_at:
          type: string
        key_id:
          type: string
        principals:
          type: string
        public_key_fingerprint:
          type: string
        serial_number:
          type: integer
        type:
          $ref: '#/components/schemas/model.CertificateType'
      required:
      - expires_at
      - id
      - issued_at
      - key_id
      - principals
      - public_key_fingerprint
      - serial_number
      - type
      type: object
    webtypes.CurrentUserResponse:
      properties:
        email:
          type: string
        groups:
          items:
            type: string
          type: array
          uniqueItems: false
        is_auditor:
          description: |-
            IsAuditor reports whether this session holds auditor-level access
            (config.AdminConfig.GrantsAuditor), so the UI can show
            auditor-only affordances like other users' retrieval logs. Display
            only — the server re-checks on every auditor-scoped read.
          type: boolean
        other_accounts:
          description: |-
            OtherAccounts are alternate account identifiers this identity is
            known by on target systems (see config.OAuthFields.OtherAccounts),
            shown so a user can see every account name tied to their identity.
            These are also the candidates, alongside Username, that the approval
            page offers as principals for a user certificate (see
            ApproveRequestBody.Principals).
          items:
            type: string
          type: array
          uniqueItems: false
        service_accounts:
          description: |-
            ServiceAccounts are the service accounts this identity may approve
            service certificates for (see config.OAuthFields.ServiceAccounts) —
            the approval page's picker is populated from them.
          items:
            type: string
          type: array
          uniqueItems: false
        subject:
          type: string
        username:
          type: string
      required:
      - email
      - groups
      - is_auditor
      - other_accounts
      - service_accounts
      - subject
      - username
      type: object
    webtypes.EffectiveConfigResponse:
      properties:
        admin_auditor_group:
          type: string
        admin_require_group:
          description: Admin authorization
          type: string
        cert_approval_ttl:
          type: string
        cert_client_timeout:
          description: |-
            CertClientTimeout is the configured budget; the two below are what it
            derives to. Both are surfaced because an operator debugging "why did
            my request expire" needs the effective numbers, not just the input.
          type: string
        cert_pam_require_group:
          type: string
        cert_pam_valid_duration:
          type: string
        cert_service_extensions:
          items:
            type: string
          type: array
          uniqueItems: false
        cert_service_require_group:
          type: string
        cert_service_valid_duration:
          type: string
        cert_signing_grace:
          type: string
        cert_user_extensions:
          items:
            type: string
          type: array
          uniqueItems: false
        cert_user_require_group:
          type: string
        cert_user_valid_duration:
          description: Certificate options
          type: string
        db_provider:
          description: Database
          type: string
        is_https:
          type: boolean
        logging_level:
          description: Logging configuration
          type: string
        port:
          type: integer
        provider_url:
          description: OAuth/OIDC
          type: string
        server_name:
          description: Server connection and TLS settings
          type: string
      required:
      - cert_approval_ttl
      - cert_client_timeout
      - cert_pam_valid_duration
      - cert_service_extensions
      - cert_service_valid_duration
      - cert_signing_grace
      - cert_user_extensions
      - cert_user_valid_duration
      - db_provider
      - is_https
      - logging_level
      - port
      - provider_url
      - server_name
      type: object
    webtypes.EnrollmentRetrievalResponse:
      properties:
        certificate_serial:
          type: integer
        retrieved_at:
          type: string
        source_ip:
          type: string
        succeeded:
          description: |-
            Succeeded is false for a redemption that passed code validation but
            failed at signing — still worth surfacing: someone held the code.
          type: boolean
      required:
      - certificate_serial
      - retrieved_at
      - source_ip
      - succeeded
      type: object
    webtypes.EnrollmentRetrievalsResponse:
      properties:
        retrievals:
          items:
            $ref: '#/components/schemas/webtypes.EnrollmentRetrievalResponse'
          type: array
          uniqueItems: false
      required:
      - retrievals
      type: object
    webtypes.NotificationKindResponse:
      properties:
        description:
          description: Description is the sentence explaining when this one fires.
          type: string
        enabled:
          description: |-
            Enabled is this user's answer, or the kind's default when they have
            never given one.
          type: boolean
        kind:
          description: Kind is the stable identifier, the key the update body uses.
          type: string
        title:
          description: Title is the short label shown beside the toggle.
          type: string
      required:
      - description
      - kind
      - title
      type: object
    webtypes.NotificationPreferencesResponse:
      properties:
        address:
          description: |-
            Address is where notifications would be sent, from the users table.
            Empty when the identity provider releases no email claim — the other
            reason nothing arrives, and equally worth showing.
          type: string
        kinds:
          description: |-
            Kinds is every notification the server knows how to send, in a
            stable order.
          items:
            $ref: '#/components/schemas/webtypes.NotificationKindResponse'
          type: array
          uniqueItems: false
        mail_enabled:
          description: |-
            MailEnabled reports whether the server can send mail at all. False
            means the toggles are still recorded but nothing is delivered, which
            the page says out loud rather than leaving the user to infer.
          type: boolean
      required:
      - kinds
      type: object
    webtypes.RequestDetailResponse:
      properties:
        already_closed:
          type: boolean
        approval_url:
          type: string
        created_at:
          type: string
        decided_accept_language:
          type: string
        decided_at:
          type: string
        decided_by_email:
          type: string
        decided_by_groups:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_other_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_outcome:
          type: string
        decided_by_service_accounts:
          items:
            type: string
          type: array
          uniqueItems: false
        decided_by_subject:
          type: string
        decided_by_username:
          type: string
        decided_forwarded_for:
          type: string
        decided_source_ip:
          type: string
        decided_user_agent:
          type: string
        granted:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        id:
          type: string
        is_owned_by_you:
          type: boolean
        local_hostname:
          type: string
        local_username:
          type: string
        principals:
          items:
            type: string
          type: array
          uniqueItems: false
        public_key:
          type: string
        requested:
          $ref: '#/components/schemas/webtypes.CertificateOptionsResponse'
        source_ip:
          type: string
        status:
          $ref: '#/components/schemas/model.CertificateRequestStatus'
        type:
          $ref: '#/components/schemas/model.CertificateType'
        valid_seconds:
          type: integer
      required:
      - already_closed
      - approval_url
      - created_at
      - granted
      - id
      - is_owned_by_you
      - principals
      - public_key
      - requested
      - source_ip
      - status
      - type
      - valid_seconds
      type: object
    webtypes.UpdateNotificationPreferencesBody:
      properties:
        kinds:
          additionalProperties:
            type: boolean
          description: |-
            Kinds maps a notification kind to whether it should be sent. An
            unknown key is rejected rather than ignored: silently dropping it
            would report success for a preference that was never stored.
          type: object
      required:
      - kinds
      type: object
    webtypes.VersionResponse:
      properties:
        commit:
          description: |-
            Commit is the git revision the build came from. It is what identifies
            a "development" build, which has no release of its own to point at.
          type: string
        github_url:
          description: |-
            GithubURL is the project's source repository. Served rather than
            hardcoded in the frontend so that a fork only has to change
            internal/version.
          type: string
        release_url:
          description: |-
            ReleaseURL points at the GitHub release matching Version. Omitted for
            an untagged build, where there is no release page to link to.
          type: string
        version:
          description: |-
            Version is the release this binary was built from, without the tag's
            leading "v" (goreleaser and the Makefile both strip it). Untagged
            builds report the "development" default from internal/version.
          type: string
      required:
      - commit
      - github_url
      - version
      type: object
  securitySchemes:
    sessionCookie:
      description: The session established by /auth/callback. Sent by the browser
        automatically; the ssoossh client never has one, and the endpoints it calls
        do not require one.
      in: cookie
      name: ssoossh_session
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    name: ssoossh
    url: https://github.com/mnestor/ssoossh
  description: |-
    SSO for SSH. Two audiences share this surface:

    - **The client** (`ssoossh`, and `pam_ssoossh`) creates certificate requests and waits on the result over SSE. These endpoints are unauthenticated: a request's ID is an unguessable UUID and is itself the capability, and authorization happens at the approval step.
    - **The web UI** reads and approves. Everything under a session cookie.

    **Every** JSON body this API emits is the `{data, error}` envelope from `.claude/rules/server-api.md` — success and error, client-facing and web-UI-facing, including the data of each server-sent event. One decode path, no exceptions to remember.

    This file is generated from Go annotations by `make openapi`. Edit the handlers, not the YAML.
  license:
    name: MIT
  title: ssoosshd API
  version: "0.1"
openapi: 3.1.0
paths:
  /api/admin/certificates/history:
    get:
      description: |-
        Returns issued certificates across all users, useful for audits,
        incident review, and tracking "who issued this?". Supports
        filtering and pagination.
      parameters:
      - description: Number of results (default 50)
        example: 50
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of results to skip (default 0)
        example: 0
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: Certificate history
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: View certificate history across all users (auditor-only)
      tags:
      - admin
  /api/admin/config:
    get:
      description: |-
        Returns the server's effective configuration with sensitive
        fields redacted (CA key, client secret, cookie signing key,
        database password). Useful for debugging and audit trails.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.EffectiveConfigResponse'
          description: Current effective configuration
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: View effective server configuration (auditor-only)
      tags:
      - admin
  /api/admin/enrollments/{id}/expire:
    patch:
      description: |-
        Immediately marks an enrollment as expired, preventing future
        service certificate retrievals. The operation is idempotent.
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: Enrollment expired
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Enrollment not found
      security:
      - sessionCookie: []
      summary: Expire an enrollment (admin-only)
      tags:
      - admin
  /api/admin/users/{id}/disable:
    patch:
      description: |-
        Marks a user as disabled, preventing authentication and
        eventually expiring their enrollments after the configured
        grace period. The operation is idempotent.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: User disabled
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: User not found
      security:
      - sessionCookie: []
      summary: Disable a user (admin-only)
      tags:
      - admin
  /api/branding:
    get:
      description: |-
        Unauthenticated endpoint that returns optional branding for the login page
        and web UI. All fields are optional; empty values mean no branding is
        configured. Returns an empty object if no branding is configured.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.BrandingEnvelope'
          description: Branding configuration (may be empty)
      summary: Get branding configuration
      tags:
      - public
  /api/branding/logo:
    get:
      description: |-
        Serves the logo image configured by the operator. The image is read
        and validated at startup, so this handler simply streams the bytes with
        appropriate cache headers.
      responses:
        "200":
          content:
            image/gif:
              schema:
                type: file
            image/jpeg:
              schema:
                type: file
            image/png:
              schema:
                type: file
            image/svg+xml:
              schema:
                type: file
            image/webp:
              schema:
                type: file
          description: Logo image
      summary: Get organization logo image
      tags:
      - public
  /api/ca:
    get:
      description: |-
        For `TrustedUserCAKeys` and `@cert-authority` lines. Public by design —
        it is a public key.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CAEnvelope'
          description: The CA public key in authorized_keys form
      summary: The CA public key
      tags:
      - client
  /api/certs:
    get:
      description: |-
        Metadata only. Certificates themselves are ephemeral and never persisted,
        so this is an audit trail rather than somewhere to re-download one.

        Scoped by the caller's users row, with no parameter to widen it.
        Uses cursor-based pagination (not offset).
      parameters:
      - description: Certificate ID to start after (cursor)
        in: query
        name: after
        schema:
          type: string
      - description: Maximum certificates to return (default 25, max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CertificateListEnvelope'
          description: Issued certificates, newest first, with cursor for next page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid limit or cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's issued-certificate history
      tags:
      - web
  /api/certs/pam:
    post:
      description: |-
        Unauthenticated. Username is the local account pam_ssoossh is authenticating —
        that, not the approver's identity, becomes the certificate's principal. Set
        `cert_options.pam.require_group` to restrict who may approve one.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.PAMRequestBody'
                description: The public key to sign, the local username being authenticated,
                  and the options being asked for
                summary: request
        description: The public key to sign, the local username being authenticated,
          and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a PAM certificate request
      tags:
      - client
  /api/certs/requests/{id}:
    get:
      description: |-
        The approval page's data source.

        Returns `requested` and `granted` separately on purpose: server config is
        the outer bound on every option and trims rather than rejects, so a human
        has to be able to see what is being dropped before they approve.

        **This binds the request to the caller.** It is the first authenticated
        touch a request gets, so opening the page claims it; a different user gets
        403 here rather than after clicking approve.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.RequestDetailEnvelope'
          description: Request detail
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Already bound to another user
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
      security:
      - sessionCookie: []
      summary: What the caller would be approving
      tags:
      - web
  /api/certs/requests/{id}/approve:
    post:
      description: |-
        Session-authed and CSRF-guarded. Publishes a signing job; the certificate
        reaches the client over its own SSE stream, not in this response.

        Approving a service-type request requires a body naming which of the
        approver's own service accounts the certificate is for; that account
        becomes the certificate principal. Other types take no body.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.ApproveRequestBody'
                description: Service-account selection (service-type requests only)
                summary: request
        description: Service-account selection (service-type requests only)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ApproveEnvelope'
          description: Queued for signing
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Bound to another user, or a cross-origin call
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
      security:
      - sessionCookie: []
      summary: Approve a request
      tags:
      - web
  /api/certs/requests/{id}/deny:
    post:
      description: |-
        Session-authed and CSRF-guarded. The waiting client is told over its own
        SSE stream.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.DenyEnvelope'
          description: Denied
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Bound to another user, or a cross-origin call
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
      security:
      - sessionCookie: []
      summary: Deny a request
      tags:
      - web
  /api/certs/requests/{id}/events:
    get:
      description: |-
        A real `text/event-stream`, separate from the creating POST because an
        EventSource-style client is GET-only. Safe to reconnect any number of
        times.

        The SSE event *name* carries the terminal status (`approved`, `denied`,
        `expired`, `enrolled`, `failed`); each event's data is an envelope whose
        `data` half carries the certificate, or the enrollment code together with
        the service account it was approved for and when the code expires. That
        shape is not in this document: the response body is a stream rather than
        JSON, so there is nowhere to declare a schema for what individual events
        carry.

        Unauthenticated: the request ID is the credential.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The stream, closed after one terminal event
        "404":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
        "410":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The certificate was issued but is no longer available. They
            are never persisted, so a client that missed delivery must re-request.
      summary: Wait for a request's outcome (SSE)
      tags:
      - client
  /api/certs/requests/{id}/retrievals:
    get:
      description: |-
        Every redemption of the enrollment created from this service request —
        when, from where, and whether a certificate was issued. Codes are
        reusable, so the log accumulates one row per redemption. Visible to the
        enrollment's approving user and to auditors.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.EnrollmentRetrievalsEnvelope'
          description: The retrieval log
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Neither the approving user nor an auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No enrollment for this request
      security:
      - sessionCookie: []
      summary: A service enrollment's retrieval log
      tags:
      - web
  /api/certs/service/enroll:
    post:
      description: |-
        Approving one yields an enrollment code rather than a certificate; the
        certificate comes later from `/api/certs/service/retrieve`. This is the
        one path where an approval does not queue a signing job.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.ServiceEnrollRequestBody'
                description: The service public key and the options being asked for
                summary: request
        description: The service public key and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a service enrollment request
      tags:
      - client
  /api/certs/service/retrieve:
    post:
      description: |-
        Signs and returns a service certificate for the enrollment the code
        identifies, using the public key and options fixed at approval time.
        Codes are reusable until the enrollment expires; every redemption is
        logged for the approving user and auditors. The certificate is valid
        from now until the enrollment's expiry.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.RetrieveRequestBody'
                description: The enrollment code to redeem
                summary: request
        description: The enrollment code to redeem
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.RetrieveEnvelope'
          description: The signed service certificate
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Unknown or expired enrollment code
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Signing failed or timed out
      summary: Redeem an enrollment code for a certificate
      tags:
      - client
  /api/certs/user:
    post:
      description: |-
        Unauthenticated. Returns two relative URLs: `events_url` to wait on, and
        `approval_url` for a human to open. The request ID is the capability —
        it is an unguessable UUID, and holding it is what authorizes waiting on
        the outcome.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.UserRequestBody'
                description: The public key to sign, and the options being asked for
                summary: request
        description: The public key to sign, and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a user certificate request
      tags:
      - client
  /api/users/me:
    get:
      description: |-
        Sourced from the session, not the users table — the session is what
        authorizes requests, so reporting anything else would let the UI display
        an identity the server would not act on.

        There is deliberately no endpoint to read other users.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CurrentUserEnvelope'
          description: The session identity
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's own identity
      tags:
      - web
  /api/users/me/notifications:
    get:
      description: |-
        Every notification kind this server knows how to send, with the
        caller's answer for each. Kinds the caller has never answered report
        the kind's own default. Also reports whether the server is configured
        to send mail at all, and the address it would send to.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NotificationPreferencesEnvelope'
          description: The caller's notification preferences
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
      security:
      - sessionCookie: []
      summary: The caller's own notification preferences
      tags:
      - web
    put:
      description: |-
        Sets the caller's answer for each notification kind named in the body,
        leaving every other kind unchanged. An unrecognized kind is rejected
        rather than ignored, and nothing is stored when one is present.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.UpdateNotificationPreferencesBody'
                description: The kinds to change
                summary: request
        description: The kinds to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NotificationPreferencesEnvelope'
          description: The preferences after saving
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body or an unrecognized notification kind
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
      security:
      - sessionCookie: []
      summary: Update the caller's own notification preferences
      tags:
      - web
  /api/version:
    get:
      description: |-
        Unauthenticated endpoint that returns the running server's build
        identity for display in the web UI footer. Values come from the
        build stamp; an untagged build reports "development" and omits the
        release URL.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.VersionEnvelope'
          description: Build identity of the running server
      summary: Get server version
      tags:
      - public
  /auth/callback:
    get:
      description: |-
        Checks `state` against the value stored at login, exchanges the code,
        establishes the session, and redirects to the captured `return_to` (or
        `/`).
      parameters:
      - description: Authorization code from the identity provider
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: CSRF state value stored at login
        in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect back into the app
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: State mismatch, or the provider rejected the exchange
      summary: OIDC callback
      tags:
      - auth
  /auth/login:
    get:
      description: |-
        Redirects the browser to the identity provider. `return_to` is validated
        as a same-site, path-only relative URL; anything else is ignored rather
        than followed.
      parameters:
      - description: Where to land after login
        example: /approve/9f1c0b2a-...
        in: query
        name: return_to
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect to the identity provider
      summary: Start the OIDC login flow
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Clears the server-side session, which is what actually revokes the cookie
        — `SessionAuthMiddleware` fails closed without an identity, so a stale
        cookie left in the browser grants nothing.

        CSRF-guarded. No session required: logging out an already-logged-out
        caller is a no-op.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.LogoutEnvelope'
          description: Logged out
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Cross-origin call
      summary: End the session
      tags:
      - auth
  /healthz:
    get:
      description: |-
        Registered ahead of the server-name check, so a probe addressing the
        server by IP rather than by its configured name still reaches it.

        Note this is one of the two endpoints that does not use the {data, error}
        envelope: it predates the convention and is consumed by orchestrators
        rather than by this project's own clients.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.HealthPayload'
          description: The server is up
      summary: Liveness probe
  /ping:
    get:
      description: For probes that want a body they can string-match without parsing
        JSON.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: pong
      summary: Liveness probe, plain text
tags:
- description: Called by the ssoossh client, unauthenticated
  name: client
- description: Called by the web UI, session-authenticated
  name: web
- description: Browser-facing OIDC redirects
  name: auth
