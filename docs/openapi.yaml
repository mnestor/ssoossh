components:
  schemas:
    apitypes.ApproveResponse:
      properties:
        status:
          description: |-
            Status is always "signing" today — included so the response shape
            can carry more without a breaking change later.
          type: string
      required:
      - status
      type: object
    apitypes.CAResponse:
      properties:
        ca:
          type: string
      required:
      - ca
      type: object
    apitypes.ClientPolicy:
      description: |-
        ClientPolicy is what the requesting machine's administrative policy
        locks, so an approver can tell a user's own opt-out from a rule
        imposed on them. Optional, and absent from an older client.
      properties:
        fips:
          description: |-
            FIPS reports that the machine is held to FIPS-approved algorithms by
            policy. A pointer so "policy is silent" stays distinct from "policy
            says false".
          type: boolean
        forbidden_extensions:
          description: |-
            ForbiddenExtensions is forbidden_certificate_extensions as the
            requesting machine has it. The client has already subtracted these
            from what it asked for; sending them says why they are absent.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    apitypes.ConsoleRequestBody:
      properties:
        caller_gid:
          type: integer
        caller_pid:
          type: integer
        caller_ppid:
          type: integer
        caller_uid:
          type: integer
        client:
          type: string
        client_time:
          type: string
        hostname:
          description: |-
            Same fields, same trust, as PAMRequestBody's — and they matter more
            here, because a console certificate authorizes a whole session.
          type: string
        machine_id:
          type: string
        mode:
          type: string
        os:
          type: string
        pam_service:
          type: string
        process:
          type: string
        public_key:
          type: string
        remote_host:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
        requesting_user:
          description: The rest of the host context; see PAMRequestBody for each field.
          type: string
        trusted_ca_fingerprints:
          items:
            type: string
          type: array
          uniqueItems: false
        tty:
          type: string
        username:
          type: string
      required:
      - public_key
      - username
      type: object
    apitypes.CreateRequestResponse:
      properties:
        approval_url:
          type: string
        events_url:
          type: string
        expires_at:
          description: |-
            ExpiresAt is when this request stops being approvable, from its own
            type's budget (cert_options.<type>.client_timeout, falling back to
            cert_options.client_timeout). Populated for every type.

            A client bounds its wait by this rather than by a local guess, and a
            console displays the time remaining from it. Without it, the client's
            timeout and the server's budget are two numbers an operator keeps in
            agreement by hand, and disagreement surfaces as a client still
            waiting on a request the server already killed. RFC 8628 carries
            expires_in for the same reason.
          type: string
        request_id:
          type: string
        user_code:
          description: |-
            UserCode is the short code a human types into the web UI, grouped
            for display ("K7M4-QP2X"). Console requests only; empty for every
            other type, so no existing consumer changes.

            This is the only response it ever appears in. It is not in the SSE
            stream, not in the request detail, and not in any audit record.
          type: string
        verification_url:
          description: |-
            VerificationURL is the page that accepts UserCode;
            VerificationURLComplete embeds the code so a device with a camera or
            a keyboard can skip the code box entirely. Relative, like the two
            URLs above, and console requests only.

            Complete is kept short (/c/<code>, not /approve/<uuid>) because it is
            what a QR code drawn in an 80x24 terminal has to encode.
          type: string
        verification_url_complete:
          type: string
      required:
      - approval_url
      - events_url
      - request_id
      type: object
    apitypes.DenyResponse:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    apitypes.NSSGroupResponse:
      properties:
        gid:
          description: GID is the group id, frozen once stored like NSSUserResponse.UID.
          type: integer
        members:
          description: Members are the member user names, capped at nss.max_group_members.
          items:
            type: string
          type: array
          uniqueItems: false
        members_truncated:
          description: |-
            MembersTruncated is true when the cap cut Members short, so a host
            can log that the list is incomplete rather than serve it as whole.
          type: boolean
        name:
          description: Name is the group name.
          type: string
      required:
      - members
      - name
      type: object
    apitypes.NSSMembership:
      properties:
        gid:
          description: GID is the group id.
          type: integer
        name:
          description: Name is the group name, matched byte for byte like a user name.
          type: string
      required:
      - name
      type: object
    apitypes.NSSUserResponse:
      properties:
        gecos:
          description: Gecos is the rendered and sanitised nss.gecos_template output.
          type: string
        gid:
          description: GID is the primary group id, after nss.auto_private_groups.
          type: integer
        groups:
          description: |-
            Groups is every membership, primary first, with the gid and the name
            together, so one user lookup answers both "which groups" and "what is
            group N called".
          items:
            $ref: '#/components/schemas/apitypes.NSSMembership'
          type: array
          uniqueItems: false
        home:
          description: |-
            Home is the home directory: the directory attribute, else
            nss.default_home expanded, else null.
          type: string
        key_id:
          description: |-
            KeyID is the fleet key that made the request, echoed for log
            correlation.
          type: string
        name:
          description: |-
            Name is the login name, stored verbatim from the directory and
            matched byte for byte.
          type: string
        shell:
          description: |-
            Shell is the login shell path: the directory attribute, else
            nss.default_shell, else null. For a disabled or deleted account it is
            nss.disabled_shell.
          type: string
        shell_pref:
          description: |-
            ShellPref is the shell name the user chose on the server (one of
            nss.allowed_shells), or null. A name, not a path: the host resolves
            it.
          type: string
        status:
          description: Status is one of the NSSStatus* values.
          type: string
        uid:
          description: |-
            UID is the user id. Frozen once stored: a changed directory value is
            held as a pending change until an admin accepts it.
          type: integer
      required:
      - groups
      - key_id
      - name
      - status
      type: object
    apitypes.PAMRequestBody:
      properties:
        caller_gid:
          type: integer
        caller_pid:
          type: integer
        caller_ppid:
          type: integer
        caller_uid:
          description: |-
            CallerUID, CallerPID and CallerPPID identify the process on the host,
            for joining with the host's own logs. Pointers so an absent value is
            distinguishable from uid 0 or pid 0.
            CallerGID is the process's group, added with the Go client and
            accepted here so one column and one audit key mean the same thing
            whichever implementation sent the request; the C module does not
            report it yet.
          type: integer
        client:
          description: |-
            Client names the module and its version ("pam_ssoossh-c/0.3.0"),
            which is what tells the two module implementations apart in a log.
          type: string
        client_time:
          description: |-
            ClientTime is the host's own clock when it built the request, so
            skew against the server is visible before it fails a login.
          type: string
        hostname:
          description: |-
            The context an approver needs to tell a request they caused from one
            they did not: which machine, through which PAM service, at which
            terminal, and — since a real console has no remote host — whether
            PAM_RHOST says this did not come from a console at all.

            Every one of these is self-reported by an unauthenticated caller and
            is displayed as a claim, never as a fact. Optional, so a client that
            does not read PAM items still works.
          type: string
        machine_id:
          description: |-
            MachineID is a stable per-install identifier (/etc/machine-id or
            kern.hostuuid), so a host is still recognisable after a rename and
            two hosts claiming one name are distinguishable.
          type: string
        mode:
          description: |-
            Mode is the module's configured mode argument as written in pam.d
            ("auto", "sudo", "console"), not the route it resolved to; the
            endpoint already says that. Together they explain why a request
            arrived as a console one.
          type: string
        os:
          description: |-
            OS is the platform as the host describes itself: os-release
            PRETTY_NAME followed by uname -s and -r.
          type: string
        pam_service:
          type: string
        process:
          description: |-
            Process is the PAM host process's command line ("sudo -i",
            "sudo systemctl restart nginx"), read from /proc/self/cmdline where
            the platform has it. Empty where it does not.
          type: string
        public_key:
          type: string
        remote_host:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
        requesting_user:
          description: |-
            The rest of the host context, same trust as the four above: every value is
            what the module read off its own process and machine, and the approval
            page renders each as a claim. They exist so an approver of a `sudo` can
            see which command is asking, on which machine, invoked by whom, and so the
            audit line joins against the host's own auditd or journal. See
            https://mnestor.github.io/ssoossh/internals/host-context/.

            RequestingUser is PAM_RUSER: who invoked the service, as opposed to
            Username, the account being authenticated. Under `su` or sudo's
            targetpw they differ.
          type: string
        trusted_ca_fingerprints:
          description: |-
            TrustedCAFingerprints are the SHA256 fingerprints of the keys in the
            module's trusted-ca-file, in OpenSSH form. The module will reject a
            certificate signed by any other key, so the server can warn the
            approver before that happens rather than after.
          items:
            type: string
          type: array
          uniqueItems: false
        tty:
          type: string
        username:
          type: string
      required:
      - public_key
      - username
      type: object
    apitypes.RequestedOptions:
      properties:
        extensions:
          description: |-
            Extensions are the SSH certificate extensions requested (e.g.
            "permit-pty", "permit-agent-forwarding").
          items:
            type: string
          type: array
          uniqueItems: false
        force_command:
          description: ForceCommand is the SSH "force-command" critical option request.
          type: string
        no_touch_required:
          description: |-
            NoTouchRequired requests the OpenSSH "no-touch-required" extension.
            Only meaningful for service enrollment of a hardware-backed sk- key.
          type: boolean
        source_addresses:
          description: |-
            SourceAddresses are the caller's own interface addresses, unioned
            server-side with the address the request was observed from.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    apitypes.RetrieveRequestBody:
      properties:
        code:
          type: string
      required:
      - code
      type: object
    apitypes.RetrieveResponse:
      properties:
        certificate:
          type: string
      required:
      - certificate
      type: object
    apitypes.ServiceEnrollRequestBody:
      properties:
        public_key:
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
      required:
      - public_key
      type: object
    apitypes.UserRequestBody:
      properties:
        caller_gid:
          type: integer
        caller_pid:
          type: integer
        caller_ppid:
          type: integer
        caller_uid:
          description: |-
            CallerUID, CallerGID, CallerPID and CallerPPID identify the client
            process, for joining with the machine's own logs. Pointers so an
            absent value is distinguishable from uid 0 or gid 0; the two ids are
            absent on Windows, which has neither.
          type: integer
        client:
          description: |-
            Client names the implementation and version ("ssoossh/1.2.3"), which
            is what tells this client and pam_ssoossh apart in a log.
          type: string
        client_policy:
          $ref: '#/components/schemas/apitypes.ClientPolicy'
        client_time:
          description: |-
            ClientTime is the machine's own clock when it built the request, so
            skew against the server is visible before it breaks a login.
          type: string
        local_hostname:
          type: string
        local_username:
          type: string
        machine_id:
          description: |-
            MachineID is a stable per-install identifier: /etc/machine-id on
            Linux, kern.uuid on macOS, kern.hostuuid on FreeBSD, MachineGuid on
            Windows.
          type: string
        os:
          description: OS is the platform as the machine describes itself.
          type: string
        process:
          description: |-
            Process is the client's own argv ("ssoossh ssh login --force"),
            the analogue of the PAM host process's command line. It is what
            distinguishes an interactive login from a ProxyCommand invocation.
          type: string
        public_key:
          type: string
        remote_host:
          description: |-
            RemoteHost is the peer address when the client is itself running
            inside an SSH session (SSH_CONNECTION), the analogue of PAM_RHOST.
            Empty at a local terminal.
          type: string
        requested_options:
          $ref: '#/components/schemas/apitypes.RequestedOptions'
        requesting_user:
          description: |-
            The rest of the host context, the same set and the same trust as
            PAMRequestBody's -- see that type for what each field means and
            https://mnestor.github.io/ssoossh/internals/host-context/ for how far
            each one travels. The client reads them off its own process and
            machine (internal/hostinfo); every value is self-reported by an
            unauthenticated caller and the approval page renders each as a claim.

            A user request carried only the two identity fields above until this
            existed, so an approver deciding a `ssh login` saw two strings where
            an approver deciding a `sudo` saw a dozen. All optional: an older
            client that sends none of them still works, and a field the platform
            cannot answer is simply absent.

            PAMService and Mode have no analogue here and are not sent. The
            endpoint already says this is a user request, and there is no pam.d
            line to have configured a mode in.

            RequestingUser is SUDO_USER, the analogue of PAM_RUSER: who invoked
            the client, when that differs from the account it runs as.
          type: string
        trusted_ca_fingerprints:
          description: |-
            TrustedCAFingerprints is the SHA256 fingerprint of the CA public key
            this client has *pinned* (the `capubkey` setting), in OpenSSH form.
            Sent only when it was pinned: a key the client fetched from this same
            server says nothing the server does not already know, and reporting
            one as trust would be circular.
          items:
            type: string
          type: array
          uniqueItems: false
        tty:
          description: TTY is the controlling terminal where the platform can name
            one.
          type: string
      required:
      - public_key
      type: object
    gin.H:
      additionalProperties: {}
      type: object
    model.CertificateRequestStatus:
      enum:
      - pending
      - signing
      - approved
      - enrolled
      - denied
      - expired
      - failed
      type: string
      x-enum-varnames:
      - CertificateRequestStatusPending
      - CertificateRequestStatusSigning
      - CertificateRequestStatusApproved
      - CertificateRequestStatusEnrolled
      - CertificateRequestStatusDenied
      - CertificateRequestStatusExpired
      - CertificateRequestStatusFailed
    model.CertificateType:
      description: |-
        Type is what was asked for. Empty when the request row behind the
        decision is gone: the decisions table is the permanent one by design,
        so the client must render a row whose type it does not know.
      enum:
      - user
      - service
      - pam
      - console
      type: string
      x-enum-varnames:
      - CertificateTypeUser
      - CertificateTypeService
      - CertificateTypePAM
      - CertificateTypeConsole
    model.DetailLevel:
      description: |-
        DetailLevel is how much of the covered pages this person sees:
        "simplified" or "advanced". Stored on the server so it follows the
        person between browsers; the email level is separate and travels with
        the notification preferences.
      enum:
      - simplified
      - advanced
      - simplified
      - advanced
      - simplified
      - advanced
      - simplified
      - advanced
      - simplified
      - advanced
      - simplified
      - advanced
      type: string
      x-enum-varnames:
      - DetailLevelSimplified
      - DetailLevelAdvanced
    model.NSSCollisionKind:
      description: |-
        Kind is the contested value: uid or user_name between accounts, gid
        or group_name between groups.
      enum:
      - uid
      - user_name
      - gid
      - group_name
      type: string
      x-enum-varnames:
      - NSSCollisionKindUID
      - NSSCollisionKindUserName
      - NSSCollisionKindGID
      - NSSCollisionKindGroupName
    model.NSSEntryState:
      enum:
      - withheld
      - tombstone
      - disabled
      - missing
      - pending
      - active
      type: string
      x-enum-varnames:
      - NSSEntryStateWithheld
      - NSSEntryStateTombstone
      - NSSEntryStateDisabled
      - NSSEntryStateMissing
      - NSSEntryStatePending
      - NSSEntryStateActive
    model.NSSKeyPermission:
      enum:
      - view
      - rotate
      - revoke
      - edit
      - assign_group
      type: string
      x-enum-varnames:
      - NSSKeyPermissionView
      - NSSKeyPermissionRotate
      - NSSKeyPermissionRevoke
      - NSSKeyPermissionEdit
      - NSSKeyPermissionAssignGroup
    model.NSSKeyStatus:
      description: Status is derived from the revocation and expiry.
      enum:
      - active
      - expired
      - revoked
      type: string
      x-enum-varnames:
      - NSSKeyStatusActive
      - NSSKeyStatusExpired
      - NSSKeyStatusRevoked
    model.NSSNotServedReason:
      enum:
      - withheld
      - past_retention
      - private_group_clash
      - no_gid
      type: string
      x-enum-varnames:
      - NSSNotServedWithheld
      - NSSNotServedPastRetention
      - NSSNotServedPrivateGroupClash
      - NSSNotServedNoGID
    model.NSSRotationBucket:
      description: |-
        Bucket is switched (last presented the current secret), not_switched
        (last presented an older one) or gone (not seen since the rotation).
      enum:
      - switched
      - not_switched
      - gone
      type: string
      x-enum-varnames:
      - NSSRotationBucketSwitched
      - NSSRotationBucketNotSwitched
      - NSSRotationBucketGone
    model.PosixStatus:
      enum:
      - active
      - disabled
      - deleted
      type: string
      x-enum-varnames:
      - PosixStatusActive
      - PosixStatusDisabled
      - PosixStatusDeleted
    openapidoc.AccountHoldersEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.AccountHoldersResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.ApproveEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.ApproveResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.BrandingEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.BrandingResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CAEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.CAResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CertificateDetailEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CertificateResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CertificateListAdminEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CertificateListAdminResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CertificateListEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CertificateListResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CreateRequestEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.CreateRequestResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.CurrentUserEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.CurrentUserResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.DeniedRequestListEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.DeniedRequestListResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.DenyEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/apitypes.DenyResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.DisplayPreferencesEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.DisplayPreferencesResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.EnrollmentRetrievalsEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.EnrollmentRetrievalsResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.ErrorEnvelope:
      properties:
        data:
          description: Data is always null on an error response.
        error:
          description: |-
            Error is a human-readable message. Branch on the HTTP status rather
            than this string; it is for humans and logs.
          example: certificate request "9f1c…" not found
          type: string
        error_code:
          description: |-
            ErrorCode is a machine-readable error classifier. One of the error_code
            constants from internal/apitypes; use this to decide whether to retry
            or branch on the failure mode.
          example: not_found
          type: string
      required:
      - error
      - error_code
      type: object
    openapidoc.HealthPayload:
      properties:
        status:
          example: ok
          type: string
      required:
      - status
      type: object
    openapidoc.LogoutEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/openapidoc.LogoutPayload'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.LogoutPayload:
      properties:
        logged_out:
          type: boolean
      required:
      - logged_out
      type: object
    openapidoc.NSSAcceptedGroupIDChangeEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.NSSAcceptedGroupIDChangeResponse'
        error:
          type: string
      required:
      - data
      type: object
    openapidoc.NSSAcceptedUserIDChangeEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/webtypes.NSSAcceptedUserIDChangeResponse'
