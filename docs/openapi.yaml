        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No tombstoned account has that uid, or NSS is disabled
      security:
      - sessionCookie: []
      summary: Purge a tombstoned account early (admin only)
      tags:
      - admin
  /api/admin/users:
    get:
      description: |-
        Returns a paginated list of users, searchable by name,
        username, email, or subject, and filterable by account state.
        Useful for user directory and audit.
        Ordered by name ignoring case (users with no name last, by username), then username, then id.
        Uses cursor-based pagination (not offset): pass the previous page's next_cursor as after.
      parameters:
      - description: 'User ID to start after (cursor): the previous page''s next_cursor'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      - description: Search term matched against name, username, email, and subject
        example: alice
        in: query
        name: q
        schema:
          type: string
      - description: 'Account state filter: active or disabled; omitted returns both'
        in: query
        name: status
        schema:
          enum:
          - active
          - disabled
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.AdminUsersListResponse'
          description: User list
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid paging/search parameters, an after that names no user,
            or offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: List all users (auditor-only)
      tags:
      - admin
  /api/admin/users/{id}:
    get:
      description: |-
        Returns full identity details, disable state, and counts of
        certificates and service enrollments for one user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.AdminUserDetail'
          description: User details
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: User not found
      security:
      - sessionCookie: []
      summary: Get user details (auditor-only)
      tags:
      - admin
  /api/admin/users/{id}/audit:
    get:
      description: |-
        Returns the audit events where this user is the actor or the
        target, newest first. One row serves both sides: a disable
        shows on the analyst's history and on the disabled account's
        page. Uses cursor-based pagination (not offset).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'Audit event ID to start after (cursor): the previous page''s
          next_cursor; must be on this user''s timeline'
        in: query
        name: after
        schema:
          type: string
      - description: Page size (default 25, max 100)
        example: 25
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.AuditEventsResponse'
          description: Audit events
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid paging parameters, an after that names no event on
            this timeline, or offset
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as auditor
      security:
      - sessionCookie: []
      summary: View a user's audit timeline (auditor-only)
      tags:
      - admin
  /api/admin/users/{id}/disable:
    patch:
      description: |-
        Marks a user as disabled, preventing authentication. Service
        enrollments they approved are unaffected. The operation is
        idempotent. A caller cannot disable their own account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webtypes.DisableUserRequestBody'
              description: Disable reason (required)
              summary: request
        description: Disable reason (required)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtypes.DisableUserConsequences'
          description: Consequences of disabling
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin or SOC, or the target is the caller's
            own account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: User not found
      security:
      - sessionCookie: []
      summary: Disable a user (admin or SOC)
      tags:
      - admin
  /api/admin/users/{id}/enable:
    patch:
      description: |-
        Re-enables a previously disabled user, whichever role or
        directory sync disabled it. The operation is idempotent.
        Note: service enrollments that have already expired are not
        un-expired; the user must request new enrollments.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webtypes.ReEnableUserRequestBody'
              description: Re-enable reason (required)
              summary: request
        description: Re-enable reason (required)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: User re-enabled
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authorized as admin or SOC
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: User not found
      security:
      - sessionCookie: []
      summary: Re-enable a user (admin or SOC)
      tags:
      - admin
  /api/branding:
    get:
      description: |-
        Unauthenticated endpoint that returns optional branding for the login page
        and web UI. All fields are optional; empty values mean no branding is
        configured. Returns an empty object if no branding is configured.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.BrandingEnvelope'
          description: Branding configuration (may be empty)
      summary: Get branding configuration
      tags:
      - public
  /api/branding/logo:
    get:
      description: |-
        Serves the logo image configured by the operator. The image is read
        and validated at startup, so this handler simply streams the bytes with
        appropriate cache headers.
      responses:
        "200":
          content:
            image/gif:
              schema:
                type: file
            image/jpeg:
              schema:
                type: file
            image/png:
              schema:
                type: file
            image/svg+xml:
              schema:
                type: file
            image/webp:
              schema:
                type: file
          description: Logo image
      summary: Get organization logo image
      tags:
      - public
  /api/ca:
    get:
      description: |-
        For `TrustedUserCAKeys` and `@cert-authority` lines. Public by design —
        it is a public key.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CAEnvelope'
          description: The CA public key in authorized_keys form
      summary: The CA public key
      tags:
      - client
  /api/certs:
    get:
      description: |-
        Metadata only. Certificates themselves are ephemeral and never persisted,
        so this is an audit trail rather than somewhere to re-download one.

        Scoped by the caller's users row, with no parameter to widen it.
        Uses cursor-based pagination (not offset).
      parameters:
      - description: Certificate ID to start after (cursor)
        in: query
        name: after
        schema:
          type: string
      - description: Maximum certificates to return (default 25, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Search over key ID, principals, serial and fingerprint
        in: query
        name: q
        schema:
          type: string
      - description: Filter by certificate type (user/service/pam/console)
        in: query
        name: type
        schema:
          type: string
      - description: Filter by expiration (live/expired)
        in: query
        name: status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CertificateListEnvelope'
          description: Issued certificates, newest first, with cursor for next page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid limit or cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's issued-certificate history
      tags:
      - web
  /api/certs/{id}:
    get:
      description: |-
        Returns a single certificate by ID if the caller is authorized:
        the user who approved the underlying request, or someone with auditor-level access.
        Returns 404 uniformly for "not found" and "not authorized" to not leak existence.
      parameters:
      - description: Certificate ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CertificateDetailEnvelope'
          description: Certificate details
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid certificate ID
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Certificate not found or not accessible
      security:
      - sessionCookie: []
      summary: View a certificate's full details
      tags:
      - web
  /api/certs/console:
    post:
      description: |-
        Unauthenticated. Returns a short `user_code` for a human to type into the
        web UI, the page that accepts it, and `expires_at` — the deadline the
        client should bound its own wait by.

        Username is the local account being logged into, reported by the caller
        and used for display and audit only. The certificate's principals are
        accounts the approver holds and selects at approval; the module on the host
        matches them against that local account, directly or through its
        principals-map. The remaining context fields are equally self-reported and
        are shown to the approver as claims.

        Set `cert_options.console.require` to restrict who may approve one, and
        `cert_options.console.allowed_networks` to refuse creation from outside
        named networks — that refusal happens here, before any human is asked.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.ConsoleRequestBody'
                description: The public key to sign, the local account being logged
                  into, and the console context
                summary: request
        description: The public key to sign, the local account being logged into,
          and the console context
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The source address is outside cert_options.console.allowed_networks
      summary: Create a console login certificate request
      tags:
      - client
  /api/certs/pam:
    post:
      description: |-
        Unauthenticated. Username is the local account pam_ssoossh is authenticating,
        reported by the caller and used for display and audit only. The certificate's
        principals are accounts the approver holds and selects at approval; the module
        on the host matches them against that local account, directly or through its
        principals-map. Set `cert_options.pam.require` to restrict who may approve one.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.PAMRequestBody'
                description: The public key to sign, the local username being authenticated,
                  and the options being asked for
                summary: request
        description: The public key to sign, the local username being authenticated,
          and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a PAM certificate request
      tags:
      - client
  /api/certs/requests/{id}:
    get:
      description: |-
        The approval page's data source.

        Returns `requested` and `granted` separately on purpose: server config is
        the outer bound on every option and trims rather than rejects, so a human
        has to be able to see what is being dropped before they approve.

        **This binds the request to the caller.** It is the first authenticated
        touch a request gets, so opening the page claims it; a different user gets
        403 here rather than after clicking approve.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.RequestDetailEnvelope'
          description: Request detail
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Already bound to another user
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
      security:
      - sessionCookie: []
      summary: What the caller would be approving
      tags:
      - web
  /api/certs/requests/{id}/approve:
    post:
      description: |-
        Session-authed and CSRF-guarded. Publishes a signing job; the certificate
        reaches the client over its own SSE stream, not in this response.

        Approving a service-type request requires a body naming which of the
        approver's own service accounts the certificate is for; that account
        becomes the certificate principal. Other types take no body.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.ApproveRequestBody'
                description: Service-account selection (service-type requests only)
                summary: request
        description: Service-account selection (service-type requests only)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ApproveEnvelope'
          description: Queued for signing
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a service-type approval that names no service
            account
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Bound to another user, refused by the type's require condition,
            a service account the approver is not associated with, or a cross-origin
            call
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'Already decided: denied, or approved and signing or signed'
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Expired before it was decided
      security:
      - sessionCookie: []
      summary: Approve a request
      tags:
      - web
  /api/certs/requests/{id}/deny:
    post:
      description: |-
        Session-authed and CSRF-guarded. The waiting client is told over its own
        SSE stream.

        Like approve, this honours the request's claim: an unclaimed request is
        claimed by the caller and then denied, and one claimed by another user
        gets 403 and stays pending.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.DenyEnvelope'
          description: Denied
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Bound to another user, or a cross-origin call
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'Already decided: denied, or approved and signing or signed'
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Expired before it was decided
      security:
      - sessionCookie: []
      summary: Deny a request
      tags:
      - web
  /api/certs/requests/{id}/events:
    get:
      description: |-
        A real `text/event-stream`, separate from the creating POST because an
        EventSource-style client is GET-only. Safe to reconnect any number of
        times.

        The SSE event *name* carries the terminal status (`approved`, `denied`,
        `expired`, `enrolled`, `failed`); each event's data is an envelope whose
        `data` half carries the certificate, or the enrollment code together with
        the service account it was approved for and when the code expires. That
        shape is not in this document: the response body is a stream rather than
        JSON, so there is nowhere to declare a schema for what individual events
        carry.

        Unauthenticated: the request ID is the credential.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The stream, closed after one terminal event
        "404":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such request
        "410":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The certificate was issued but is no longer available. They
            are never persisted, so a client that missed delivery must re-request.
        "503":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'This instance is shutting down. The request is still pending:
            reconnect.'
      summary: Wait for a request's outcome (SSE)
      tags:
      - client
  /api/certs/requests/{id}/retrievals:
    get:
      description: |-
        Redemptions of the enrollment created from this service request —
        when, from where, and whether a certificate was issued. Codes are
        reusable, so the log accumulates one row per redemption; the newest 100
        are returned and "total" reports how many exist. Visible to the
        enrollment's approving user and to auditors.
      parameters:
      - description: The certificate request's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.EnrollmentRetrievalsEnvelope'
          description: The retrieval log
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Neither the approving user nor an auditor
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No enrollment for this request
      security:
      - sessionCookie: []
      summary: A service enrollment's retrieval log
      tags:
      - web
  /api/certs/requests/resolve-code:
    post:
      description: |-
        Session-authed and CSRF-guarded. Turns the code a human read off a
        console screen into the request it names, and claims that request for
        the submitting session.

        **Authentication is not optional here.** An unauthenticated caller must
        never learn whether a code is live and must never receive a request ID:
        the ID is the credential the certificate is delivered against.

        The three failure modes are distinct on purpose, because they send the
        user to three different next actions: 404 no such code (retype it), 410
        expired (start the login again at the machine), 403 already claimed by
        another session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.ResolveCodeRequestBody'
                description: The code as typed
                summary: request
        description: The code as typed
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ResolveCodeEnvelope'
          description: Resolved and claimed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not a well-formed code
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Claimed by another user, or a cross-origin call
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No live request carries that code
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The request expired before the code was submitted
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Too many code submissions
      security:
      - sessionCookie: []
      summary: Resolve a console login code
      tags:
      - web
  /api/certs/service/enroll:
    post:
      description: |-
        Approving one yields an enrollment code rather than a certificate; the
        certificate comes later from `/api/certs/service/retrieve`. This is the
        one path where an approval does not queue a signing job.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.ServiceEnrollRequestBody'
                description: The service public key and the options being asked for
                summary: request
        description: The service public key and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a service enrollment request
      tags:
      - client
  /api/certs/service/enrollments:
    get:
      description: |-
        What each enrollment code will hand out and how long it stays
        redeemable: the principals and options fixed at approval, the keypair it
        is bound to, when it was approved, when it stops working, and how often
        it has been redeemed.

        The code itself is never returned. `service enroll` prints it once, and
        a browser session is not a way to mint service certificates.

        Scoped by the caller's users row, with no parameter to widen it.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ServiceEnrollmentsEnvelope'
          description: Approved enrollments, newest first
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's approved service enrollments
      tags:
      - web
  /api/certs/service/enrollments/{id}/expire:
    patch:
      description: |-
        Immediately expires an enrollment for a service account the caller
        holds, preventing future service certificate retrievals. Expiring an
        already-expired code succeeds and changes nothing.
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.ExpireEnrollmentRequestBody'
                description: Why the code is being retired
                summary: request
        description: Why the code is being retired
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gin.H'
          description: Enrollment expired
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No reason given
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not a holder of the enrollment's service account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Enrollment not found
      security:
      - sessionCookie: []
      summary: Expire a service enrollment code you hold
      tags:
      - enrollments
  /api/certs/service/enrollments/{id}/holders:
    get:
      description: |-
        Everyone who can see and manage this enrollment code, which is
        everyone holding its service account — a code belongs to its account
        rather than to whoever approved it, so this is the only place that
        answers "who else has this".

        Only users the server has a row for appear -- those who have logged in
        at least once, or whom the directory sync has seen -- holding the accounts
        that record last reported: the server never enumerates a directory, so this
        is everyone known to hold the account rather than everyone who does.

        Visible to auditors and to the account's own holders.
      parameters:
      - description: The enrollment's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.AccountHoldersEnvelope'
          description: The account's known holders
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not a holder of the service account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such enrollment
      security:
      - sessionCookie: []
      summary: Who holds an enrollment's service account
      tags:
      - web
  /api/certs/service/enrollments/{id}/notification-email:
    patch:
      description: |-
        Points every notification about this enrollment at one address instead
        of fanning out to every holder of its service account. An empty value
        clears it and restores fan-out.

        This exists for the cases fan-out cannot serve: a service account whose
        holders have never logged in reaches nobody, an identity provider that
        releases no email claim silences every holder, and a large holder set
        turns every redemption into a mailshot where a team alias would do.

        Allowed to any holder of the enrollment's service account, and to SOC
        operators. Auditor is not enough: it is a read role, and this write
        redirects every future message about a credential.
      parameters:
      - description: The enrollment's UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.SetNotificationEmailRequestBody'
                description: The address, or empty to clear it
                summary: request
        description: The address, or empty to clear it
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.SetNotificationEmailEnvelope'
          description: The stored address
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not a valid email address
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not a holder of the service account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such enrollment
      security:
      - sessionCookie: []
      summary: Set an enrollment's notification address
      tags:
      - web
  /api/certs/service/retrieve:
    post:
      description: |-
        Signs and returns a service certificate for the enrollment the code
        identifies, using the public key and options fixed at approval time.
        Codes are reusable until the enrollment expires; every redemption is
        logged for the approving user and auditors. The certificate is valid
        from now until the enrollment's expiry.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.RetrieveRequestBody'
                description: The enrollment code to redeem
                summary: request
        description: The enrollment code to redeem
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.RetrieveEnvelope'
          description: The signed service certificate
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Unknown or expired enrollment code
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Signing failed or timed out
      summary: Redeem an enrollment code for a certificate
      tags:
      - client
  /api/certs/user:
    post:
      description: |-
        Unauthenticated. Returns two relative URLs: `events_url` to wait on, and
        `approval_url` for a human to open. The request ID is the capability —
        it is an unguessable UUID, and holding it is what authorizes waiting on
        the outcome.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/apitypes.UserRequestBody'
                description: The public key to sign, and the options being asked for
                summary: request
        description: The public key to sign, and the options being asked for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CreateRequestEnvelope'
          description: Request created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or a public key that will not parse
      summary: Create a user certificate request
      tags:
      - client
  /api/decisions/denied:
    get:
      description: |-
        The half of a decision history that issues nothing. /api/certs
        reads the certificates table, and a denial never produces a
        row in it, so denials are served here and the client
        interleaves the two by time.

        Scoped by the caller's own decision records, with no parameter
        to widen it. Uses cursor-based pagination (not offset).
      parameters:
      - description: Decision ID to start after (cursor)
        in: query
        name: after
        schema:
          type: string
      - description: Maximum denials to return (default 25, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Search over request ID and the reported host context
        in: query
        name: q
        schema:
          type: string
      - description: Filter by certificate type (user/service/pam/console)
        in: query
        name: type
        schema:
          type: string
      - description: Live or expired; a denial is neither, so either returns nothing
        in: query
        name: status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.DeniedRequestListEnvelope'
          description: Denials, newest first, with cursor for next page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Invalid limit or cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's denied certificate requests
      tags:
      - web
  /api/nss/group/gid/{gid}:
    get:
      description: The same answer as the lookup by name, for a gid. Called by ssoosshd-nss
        with a fleet key.
      parameters:
      - description: The gid, a decimal uint32
        in: path
        name: gid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSGroupEnvelope'
          description: The group
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_bad_request: the gid is not a decimal uint32'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_unauthorized: the fleet key is missing, unknown, revoked,
            expired or wrong'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_forbidden: the source address is outside nss.source_allow_list'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_not_found, or nss_disabled when nss.enabled is false
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_rate_limited, with Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'unavailable: the gid is not in the database and the directory
            could not be asked'
      security:
      - nssKeyID: []
        nssKeySecret: []
      summary: Look a POSIX group up by gid
      tags:
      - nss
  /api/nss/group/name/{name}:
    get:
      description: |-
        Resolves a group name, matched byte for byte, to its gid and member names, capped at
        nss.max_group_members with members_truncated set when the cap applies. An account's private
        group under nss.auto_private_groups resolves too, with no members. A tombstoned group resolves
        with no members. Called by ssoosshd-nss with a fleet key.
      parameters:
      - description: The group name, by the relaxed POSIX rules nss-systemd applies
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSGroupEnvelope'
          description: The group
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_bad_request: the name fails validation'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_unauthorized: the fleet key is missing, unknown, revoked,
            expired or wrong'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_forbidden: the source address is outside nss.source_allow_list'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_not_found, or nss_disabled when nss.enabled is false
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_rate_limited, with Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'unavailable: the name is not in the database and the directory
            could not be asked'
      security:
      - nssKeyID: []
        nssKeySecret: []
      summary: Look a POSIX group up by name
      tags:
      - nss
  /api/nss/key-settings:
    get:
      description: |-
        nss.key_max_lifetime and nss.key_rotation_grace in seconds, so the create form can bound and
        propose an expiry and the rotate dialog can say when the previous secret stops working. Any session:
        the two values decide nothing on their own, and every key action is still authorised per key.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeySettingsEnvelope'
          description: The lifetimes
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_disabled: nss.enabled is false'
      security:
      - sessionCookie: []
      summary: The fleet key lifetimes
      tags:
      - web
  /api/nss/keys:
    get:
      description: |-
        Every key for the fleet key admin role, admins, SOC and auditors; for anyone else, the keys
        whose group they are in. Each key carries what the caller may do with it.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyListEnvelope'
          description: The keys, by name
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_disabled: nss.enabled is false'
      security:
      - sessionCookie: []
      summary: List fleet API keys
      tags:
      - web
    post:
      description: |-
        Fleet key admin role and admins only. Returns the key and its secret; the secret is shown
        this once and never again, so the caller must store it now. expires_at defaults to
        nss.key_max_lifetime from now, and a later one is trimmed to that; with the setting at 0 a key
        created without one never expires. Afterwards only a rotation renews it. notification_email
        defaults to the creator's address.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.CreateNSSKeyBody'
                description: The new key
                summary: request
        description: The new key
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeySecretEnvelope'
          description: The key and its secret
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, a missing name, a past expiry or a bad address
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Not the fleet key admin role, or no user record
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_disabled: nss.enabled is false'
      security:
      - sessionCookie: []
      summary: Create a fleet API key
      tags:
      - web
  /api/nss/keys/{id}:
    get:
      description: The same view as the list, for one key. A key the caller may not
        view is a 404.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyEnvelope'
          description: The key
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
      security:
      - sessionCookie: []
      summary: One fleet API key
      tags:
      - web
    patch:
      description: |-
        description and notification_email need edit: the fleet key admin role, admins, or the key's
        group. group_name needs assign_group: the fleet key admin role or admins. Fields left out are
        unchanged. The expiry is not editable: rotation renews it. A revoked key is a 409.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.UpdateNSSKeyBody'
                description: The change
                summary: request
        description: The change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyEnvelope'
          description: The key after the change
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, nothing to change or a bad address
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The caller may view the key but not make this change
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The key is revoked, or changed meanwhile
      security:
      - sessionCookie: []
      summary: Change a fleet API key
      tags:
      - web
  /api/nss/keys/{id}/previous:
    delete:
      description: |-
        Stops accepting the previous secret before its rotation grace ends, once every host has
        switched. Who may rotate the key may do this. A key with no previous secret is a 409.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyEnvelope'
          description: The key after the change
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The caller may view the key but not rotate it
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The key is revoked or has no previous secret
      security:
      - sessionCookie: []
      summary: End a fleet API key's previous secret early
      tags:
      - web
  /api/nss/keys/{id}/revoke:
    post:
      description: |-
        Ends the key for good: neither secret is accepted again. The fleet key admin role, admins,
        SOC, or the key's group. Already revoked is a 409.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyEnvelope'
          description: The revoked key
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The caller may view the key but not revoke it
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The key is already revoked
      security:
      - sessionCookie: []
      summary: Revoke a fleet API key
      tags:
      - web
  /api/nss/keys/{id}/rotate:
    post:
      description: |-
        Issues a new secret, shown this once. The current secret becomes the previous one and stays
        accepted for nss.key_rotation_grace, so hosts can switch over; an expired key's secret gets no
        grace. Renews expires_at to the key's own lifetime from now, at most nss.key_max_lifetime. The
        fleet key admin role, admins, or the key's group. A revoked key is a 409.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeySecretEnvelope'
          description: The key and its new secret
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The caller may view the key but not rotate it
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The key is revoked, or was rotated meanwhile
      security:
      - sessionCookie: []
      summary: Rotate a fleet API key
      tags:
      - web
  /api/nss/keys/{id}/rotation-report:
    get:
      description: |-
        Per source address, whether it has switched to the current secret since the last rotation:
        switched, not_switched (still presenting the previous secret, so it stops resolving accounts
        when the grace ends) or gone (not seen since the rotation). With format=csv the rows come as
        a CSV download instead. Whoever may view the key.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: csv for a CSV download
        in: query
        name: format
        schema:
          enum:
          - csv
          type: string
      responses:
        "200":
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSRotationReportEnvelope'
          description: The report
        "400":
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: An unknown format
        "401":
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
      security:
      - sessionCookie: []
      summary: A fleet API key's rotation report
      tags:
      - web
  /api/nss/keys/{id}/usage:
    get:
      description: |-
        Lookups and misses per source address, secret generation and UTC day, newest day first,
        kept for nss.usage_retention. Counts are written once a minute, so the newest minute is not
        in them yet. Whoever may view the key.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: next_cursor of the previous page
        in: query
        name: after
        schema:
          type: string
      - description: Page size, 1 to 100 (default 25)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSKeyUsageEnvelope'
          description: One page of usage
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: A malformed limit or an unknown cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No such key the caller may view, or nss_disabled
      security:
      - sessionCookie: []
      summary: A fleet API key's usage
      tags:
      - web
  /api/nss/shells:
    get:
      description: nss.allowed_shells, as bare names in configured order, for the
        login shell field.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSShellsEnvelope'
          description: The allowed shells
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_disabled: nss.enabled is false'
      security:
      - sessionCookie: []
      summary: The shells a person may choose
      tags:
      - web
  /api/nss/user/name/{name}:
    get:
      description: |-
        Resolves a login name, matched byte for byte, to the account a host serves: uid, primary gid
        (after nss.auto_private_groups), every group with its name, home, shell, gecos and a status
        derived on read. A disabled or deleted account is served with nss.disabled_shell. Called by
        ssoosshd-nss with a fleet key. 404 nss_not_found is the one answer a host may cache as a miss.
      parameters:
      - description: The login name, by the relaxed POSIX rules nss-systemd applies
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSUserEnvelope'
          description: The account
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_bad_request: the name fails validation'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_unauthorized: the fleet key is missing, unknown, revoked,
            expired or wrong'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_forbidden: the source address is outside nss.source_allow_list'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_not_found, or nss_disabled when nss.enabled is false
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_rate_limited, with Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'unavailable: the name is not in the database and the directory
            could not be asked'
      security:
      - nssKeyID: []
        nssKeySecret: []
      summary: Look a POSIX user up by name
      tags:
      - nss
  /api/nss/user/uid/{uid}:
    get:
      description: The same answer as the lookup by name, for a uid. Called by ssoosshd-nss
        with a fleet key.
      parameters:
      - description: The uid, a decimal uint32
        in: path
        name: uid
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NSSUserEnvelope'
          description: The account
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_bad_request: the uid is not a decimal uint32'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_unauthorized: the fleet key is missing, unknown, revoked,
            expired or wrong'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'nss_forbidden: the source address is outside nss.source_allow_list'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_not_found, or nss_disabled when nss.enabled is false
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: nss_rate_limited, with Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: 'unavailable: the uid is not in the database and the directory
            could not be asked'
      security:
      - nssKeyID: []
        nssKeySecret: []
      summary: Look a POSIX user up by uid
      tags:
      - nss
  /api/users/me:
    get:
      description: Sourced primarily from the session, with extra fields hydrated
        from the users table.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.CurrentUserEnvelope'
          description: The session identity
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
      security:
      - sessionCookie: []
      summary: The caller's own identity
      tags:
      - web
  /api/users/me/display:
    put:
      description: |-
        Sets how much of the approval and information pages the caller sees:
        "simplified" or "advanced". Stored on the server, so it follows the
        caller between browsers. The email detail level is separate (see
        /api/users/me/notifications).
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.UpdateDisplayPreferencesBody'
                description: The new level
                summary: request
        description: The new level
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.DisplayPreferencesEnvelope'
          description: The level after saving
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body or an unknown level
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
      security:
      - sessionCookie: []
      summary: Update the caller's own web UI detail level
      tags:
      - web
  /api/users/me/notifications:
    get:
      description: |-
        Every notification kind this server knows how to send, with the
        caller's answer for each. Kinds the caller has never answered report
        the kind's own default. Also reports whether the server is configured
        to send mail at all, the address it would send to, and how much
        each message carries (the email detail level).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NotificationPreferencesEnvelope'
          description: The caller's notification preferences
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
      security:
      - sessionCookie: []
      summary: The caller's own notification preferences
      tags:
      - web
    put:
      description: |-
        Sets the caller's answer for each notification kind named in the body,
        leaving every other kind unchanged. An unrecognized kind is rejected
        rather than ignored, and nothing is stored when one is present.
        detail_level, when present, sets the email detail level in the same save.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.UpdateNotificationPreferencesBody'
                description: The kinds to change
                summary: request
        description: The kinds to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.NotificationPreferencesEnvelope'
          description: The preferences after saving
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, an unrecognized notification kind, or an unknown
            detail level
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
      security:
      - sessionCookie: []
      summary: Update the caller's own notification preferences
      tags:
      - web
  /api/users/me/shell:
    put:
      description: |-
        Sets shell_pref on the caller's POSIX account to one of nss.allowed_shells (see
        /api/nss/shells), or clears it with null. Hosts resolve the name to their own path. A name
        outside the list is a 400 whose message starts with shell_not_allowed. Audited.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/webtypes.UpdateShellBody'
                description: The shell name, or null
                summary: request
        description: The shell name, or null
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.PosixAccountEnvelope'
          description: The account after saving
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Malformed body, or shell_not_allowed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No valid session
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: The session has no user record
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: No POSIX account is linked to the caller, or nss_disabled
      security:
      - sessionCookie: []
      summary: Choose the caller's own login shell
      tags:
      - web
  /api/version:
    get:
      description: |-
        Unauthenticated endpoint that returns the running server's build
        identity for display in the web UI footer. What it reveals is
        governed by version.mode: "show" (the real build), "hide"
        (nothing), or "fake" (a fixed string). Values come from the
        build stamp; an untagged build reports "development" and omits the
        release URL.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.VersionEnvelope'
          description: Build identity of the running server
      summary: Get server version
      tags:
      - public
  /auth/callback:
    get:
      description: |-
        Checks `state` against the value stored at login, exchanges the code,
        establishes the session, and redirects to the captured `return_to` (or
        `/`). A failure redirects to `/login?error=<reason>` (`expired`,
        `refused`, `session` or `failed`), or for a claims echo to
        `/admin/identity/echo?error=<reason>`.
      parameters:
      - description: Authorization code from the identity provider
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: CSRF state value stored at login
        in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect back into the app, or to the page that explains a
            failure
      summary: OIDC callback
      tags:
      - auth
  /auth/login:
    get:
      description: |-
        Redirects the browser to the identity provider. `return_to` is validated
        as a same-site, path-only relative URL; anything else is ignored rather
        than followed.
      parameters:
      - description: Where to land after login
        example: /approve/9f1c0b2a-...
        in: query
        name: return_to
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect to the identity provider
      summary: Start the OIDC login flow
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Clears the server-side session, which is what actually revokes the cookie
        — `SessionAuthMiddleware` fails closed without an identity, so a stale
        cookie left in the browser grants nothing.

        CSRF-guarded. No session required: logging out an already-logged-out
        caller is a no-op.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.LogoutEnvelope'
          description: Logged out
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.ErrorEnvelope'
          description: Cross-origin call
      summary: End the session
      tags:
      - auth
  /healthz:
    get:
      description: |-
        Registered ahead of the server-name check, so a probe addressing the
        server by IP rather than by its configured name still reaches it.

        Note this is one of the two endpoints that does not use the {data, error}
        envelope: it predates the convention and is consumed by orchestrators
        rather than by this project's own clients.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapidoc.HealthPayload'
          description: The server is up
      summary: Liveness probe
  /ping:
    get:
      description: For probes that want a body they can string-match without parsing
        JSON.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: pong
      summary: Liveness probe, plain text
tags:
- description: Called by the ssoossh client, unauthenticated
  name: client
- description: Called by the web UI, session-authenticated
  name: web
- description: Browser-facing OIDC redirects
  name: auth
- description: Called by the ssoosshd-nss host daemon, authenticated by a fleet API
    key
  name: nss
