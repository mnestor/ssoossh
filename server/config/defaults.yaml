# ssoosshd configuration.
#
# This file is generated. Both the comments and the values come from the
# config structs in server/config: the prose from each field's doc
# comment, the values from its `default:` tag. To change either, edit the
# struct field and run `make confdocs`; an edit made here is overwritten
# by the next run, and CI fails while the two disagree.
#
# This is both the defaults embedded in the binary and the annotated
# file installed as /etc/ssoossh/ssoosshd.yaml. A key documented with
# no value below is deliberately unset; see ssoosshd.yaml(5) for the
# full reference.

# Enables OpenTelemetry tracing, adding the otelgin middleware to the
# router. Exporter endpoints come from the standard OTEL_* environment
# variables.
traces: false

# Enables OpenTelemetry metrics. Exporter endpoints come from the standard
# OTEL_* environment variables.
metrics: false

# Selects gin's release mode rather than debug mode, and gates the
# development-only escape hatches: notably http.rate_limit_disable_for_dev
# is honored only when this is false, so rate limiting cannot be switched
# off in production.
production: true

# The SSH CA private key used to sign issued certificates. Inline PEM, not a
# file path. Exactly one of ssh_key or hsm may be set, and one of them must
# be: startup fails without a CA key.
#
#   ssh_key: |
#     -----BEGIN OPENSSH PRIVATE KEY-----
#     -----END OPENSSH PRIVATE KEY-----


# The maximum lifetime for user/service/PAM certificates, enforced as a
# defense-in-depth check before signing. Must be greater than zero; a
# non-positive value fails startup.
max_cert_lifetime: 2160h

# The maximum lifetime for service certificates, enforced as a
# defense-in-depth check before signing. Service enrollments default to
# 8760h (cert_options.service valid_duration), so this cap carries headroom
# over its default. Must be greater than zero; a non-positive value fails
# startup.
max_service_cert_lifetime: 17544h

# Steers the server toward FIPS 140-3 approved algorithms: the CA key
# (checked at startup), client-submitted public keys (checked in when a
# request is approved and again by the signer), and the TLS cipher/curve
# profile. A non-approved algorithm is a hard error when this is in effect.
#
# Unset is distinguishable from an explicit false: unset follows the Go
# runtime's own FIPS 140-3 mode, crypto/fips140.Enabled(), which is why this
# key ships with no value rather than set to false.
#
#   fips: true


# Declares that the server is part of a multi-instance deployment (multiple
# ssoosshd processes sharing a database). When enabled, certain checks are
# enforced (e.g., cookie_key must be explicitly set) and behaviors adapt to
# account for cross-instance message delivery (a client waiting on one
# instance is woken by another) payloads). See
# docs/dev/multi-instance-safety-plan.md.
multi_instance: false

# Configures the main application log.
logging:
  # Log-file rotation, via the embedded timberjack logger: filename, maxsize,
  # maxage, maxbackups, localtime, compression, rotationinterval,
  # backuptimeformat, rotateatminutes, rotateat, appendtimeafterext, and
  # filemode.
  #
  # An unset filename means no log file is written and output goes to stdout
  # instead. maxsize is in megabytes (default 100); maxage is in days
  # (default: keep forever); maxbackups caps retained rotated files (default:
  # keep all, subject to maxage); localtime uses local time rather than UTC in
  # rotated filenames; compression is none, gzip, or zstd; rotationinterval is
  # a duration forcing rotation on a schedule in addition to size. The rest
  # tune backup filename formatting and rotation at specific times. See the
  # DeRuina/timberjack package for the per-field detail.
  # The minimum log level: a level name (debug, info, warn, error,
  # case-insensitive, optionally with a numeric +N or -N offset) or a raw
  # numeric slog level such as -4, 0, 4, or 8. An unrecognized or empty value
  # falls back to info.
  level: "WARN"
  # Also writes the main log to stdout even when a filename is set. When no
  # filename is set, or the process is attached to a terminal, stdout is used
  # regardless.
  # enable_stdout: false
  # Adds an "app" attribute, the string "ssoossh", to every log record.
  include_app_name: true
  # Adds a "version" attribute to every log record.
  include_app_version: true
  # Writes JSON instead of text. Text is meant to be read, not parsed: the
  # message is written as bare prose so quoted values in it are not escaped,
  # which is not a machine-readable format. Set this wherever a log collector
  # has to pull fields back out.
  log_json: false

# Configures the database connection, pooling, retries, and query logging.
db:
  # Identifies which database backend to use.
  provider: "sqlite"
  # The connection string / DSN. For SQLite this is a file path (or ":memory:"
  # for in-memory); for PostgreSQL a standard postgres:// URL or keyword
  # string.
  connection_string: "ssoossh.db"
  # Configures which database queries are logged and where they are written.
  # See DBLogging for detailed options.
  logging:
    # Log-file rotation for this destination, via the embedded timberjack
    # logger, with the same keys and meanings as logging.* above. This
    # destination is only split out of the main log once its filename is set;
    # until then its records go to the general log.
    # The minimum log level for this destination, in the same form as
    # logging.level.
    level: "WARN"
    # Includes the source file and line on each record.
    add_source: false
    # Writes JSON instead of text. Text is meant to be read, not parsed: the
    # message is written as bare prose so quoted values in it are not escaped,
    # which is not a machine-readable format. Set this wherever a log collector
    # has to pull fields back out.
    log_json: false
  # The maximum number of connection attempts before giving up. Zero or
  # negative disables retries (will fail immediately on the first error).
  # Applies to both SQLite (typically succeeds immediately) and PostgreSQL
  # (may retry on transient network failures).
  retry_attempts: 3
  # The time to wait between connection retry attempts. Only used if
  # retry_attempts > 1. Applies to both SQLite and PostgreSQL.
  retry_interval: 3s
  # Sets the maximum number of open connections to the database. Zero means
  # Go's default (typically 2). For file-backed SQLite, keep this modest:
  # writes serialize on the write lock regardless, so high counts just queue
  # without benefit. For PostgreSQL, scale with expected concurrency. This is
  # ignored for in-memory SQLite, which is always forced to 1.
  max_open_conns: 10
  # Sets the maximum number of idle connections held open. Zero means Go's
  # default (typically 2, same as max_open_conns). Keep this proportionate to
  # max_open_conns — they are not independent; a high max_open_conns with a
  # low max_idle_conns causes expensive churn.
  max_idle_conns: 5
  # Sets the maximum amount of time a connection can be reused. Zero disables
  # the limit (connections are reused indefinitely). Useful for breaking stale
  # connections in long-running deployments, but typically not necessary with
  # a well-behaved database server.
  conn_max_lifetime: 0

# Configures the listener, TLS, sessions, and rate limiting.
http:
  # Configures which fields the HTTP access log records and where it writes
  # them. The access log is routed separately from the main application log,
  # so its level and format can differ. See access_logging for detailed field
  # options.
  access_logging:
    # Log-file rotation for the access log, via the embedded timberjack logger,
    # with the same keys and meanings as logging.* above. The access log is only
    # split into its own file once its filename is set.
    # The minimum log level for the access log, in the same form as
    # logging.level. Requests are logged at INFO, client errors (4xx) at WARN
    # and server errors (5xx) at ERROR, so "info" logs every request and "warn"
    # logs only the failures.
    #
    # This is what lets the access log be more verbose than the application log:
    # the two are filtered independently, and both still reach stdout. Left
    # empty the access log has no threshold of its own and is filtered at
    # logging.level along with everything else — which, with the shipped
    # logging.level of WARN, means no successful request is ever logged.
    level: "info"
    # Records the request's User-Agent header.
    log_user_agent: true
    # Records the full request header set. Verbose, and it captures whatever the
    # client sent.
    log_request_header: true
    # Records the client address, as resolved through http.trusted_proxies.
    log_client_ip: true
    # Records the per-request correlation ID.
    log_request_id: false
    # Records the request body. Off by default and worth leaving off: request
    # bodies on this server carry public keys and enrollment codes.
    log_request_body: false
    # Records the response body. Off by default and worth leaving off: response
    # bodies carry issued certificates and enrollment tokens.
    log_response_body: false
    # Records the full response header set.
    log_response_header: false
    # Records the OpenTelemetry span ID.
    log_span_id: false
    # Records the OpenTelemetry trace ID.
    log_trace_id: false
    # Writes JSON instead of text. Text is meant to be read, not parsed: the
    # message is written as bare prose so quoted values in it are not escaped,
    # which is not a machine-readable format. Set this wherever a log collector
    # has to pull fields back out.
    # log_json: false
  # The network interface to bind to, e.g. "127.0.0.1" to listen only locally,
  # or "0.0.0.0" for all interfaces. Used with Port to form the server's
  # listen address.
  address: "127.0.0.1"
  # The TCP port to listen on, e.g. 80 for HTTP or 443 for HTTPS. Port 0 is
  # reserved for testing and tells the OS to pick an unused port; the actual
  # port is logged on startup. Ignored when unix_socket is set.
  port: 8080
  # when set, is a filesystem path to listen on a Unix domain socket instead
  # of TCP — Address and Port are ignored. Mutually exclusive with
  # proxy_protocol (PROXY protocol is a TCP-connection concept; it has nothing
  # to prefix on a Unix socket).
  unix_socket: ""
  # Lists the CIDR ranges of reverse proxies trusted to prefix connections
  # with a PROXY protocol v1/v2 header (so the real client address survives a
  # TCP-level proxy, as opposed to trusted_proxies below which is for
  # HTTP-level proxies setting X-Forwarded-For). Empty disables PROXY protocol
  # support entirely; connections from any other source are rejected outright
  # once this is set. Ignored (must be empty) when unix_socket is set.
  proxy_protocol: []
  # Lists the CIDR ranges of reverse proxies trusted to set
  # X-Forwarded-For/X-Forwarded-Proto, passed to gin's SetTrustedProxies.
  # Empty means no proxy is trusted, so c.ClientIP() always reports the direct
  # connection's address and a client-supplied X-Forwarded-For is ignored.
  #
  # That only holds because the router passes this to SetTrustedProxies
  # unconditionally — gin's own default is to trust every proxy, so skipping
  # the call for an empty list would mean the opposite.
  trusted_proxies: []
  # when set, is the host name this server answers to: requests addressed to
  # anything else (by Host header, or SNI on TLS connections) are rejected
  # with 421 Misdirected Request by middleware.ServerNameMiddleware. The
  # health endpoints are registered ahead of the check so probes can reach the
  # server by IP. Empty disables the check. It plays no role in the TLS
  # handshake itself, which is why it does not live in TLSConfig.
  server_name: ""
  # The scheme and host browsers actually reach this deployment at, e.g.
  # "https://ssh.example.com". Set it whenever that differs from what
  # Address/Port/TLS describe — which is every reverse-proxy deployment,
  # since the proxy terminates TLS on 443 while this process listens on plain
  # HTTP somewhere else.
  #
  # Two things are derived from it and cannot be got right without it: the
  # OIDC redirect URI handed to the identity provider, and the origin the CSRF
  # middleware compares the browser's Origin header against. Both used to be
  # reconstructed from server_name plus the *listen* port, which is only the
  # public port when nothing sits in front.
  #
  # Its scheme also settles the derived HTTPS flag, so a deployment behind a
  # TLS-terminating proxy needs this or is_https, not both.
  #
  # Origin only: a path, query, or fragment is rejected at startup. Serving
  # the app under a sub-path would need the frontend's base to move with it,
  # which is not supported, so accepting one here would only produce a
  # redirect URI that silently does not work.
  public_url: ""
  # Records that a reverse proxy terminates TLS while this process serves
  # plain HTTP, so the deployment is HTTPS as browsers see it even though this
  # listener is not. Redundant when public_url is set — its scheme settles
  # the same question — so configure one or the other, not both.
  is_https: false
  # The secret used to sign and encrypt session cookies. If empty, a key is
  # generated once and persisted in the server_secrets table, so sessions
  # survive a restart and instances sharing a database share the key.
  # Configure an explicit value to key it from outside the database.
  cookie_key: ""
  # Marks the session cookie Secure, so browsers only send it over HTTPS.
  # Unset derives it from whether the deployment is HTTPS at all (see
  # is_https), which keeps plain-HTTP local development working while
  # defaulting to on everywhere else. Set it explicitly only to override that
  # inference.
  cookie_secure: ~
  # Controls the session cookie's SameSite attribute: "strict" (default),
  # "lax", or "none". Strict is right for this server because nothing
  # legitimately navigates into it from another site — the OIDC callback is
  # a redirect the browser follows to a URL this server issued, not a
  # cross-site form post.
  #
  # This is defence in depth, not the CSRF control: SameSite does nothing
  # against an attacker page on a different origin of the *same* site, so
  # state-changing routes are additionally guarded by the CSRF middleware.
  cookie_same_site: "strict"
  # The absolute ceiling on a session's lifetime, measured from login.
  # Activity does not extend it: once a session is this old the next request
  # is unauthenticated regardless of how recently it was used, and the user
  # signs in again. Zero uses the built-in default.
  cookie_max_age: 9h
  # How long a session survives without a request. SessionAuthMiddleware
  # slides this window on activity (re-saving the session past half the
  # window, which reissues the cookie), so an actively-used session only ever
  # ends at cookie_max_age, while an abandoned browser expires after this much
  # quiet. Zero uses the built-in default. Must not exceed cookie_max_age - an
  # idle window longer than the absolute cap cannot ever be reached.
  cookie_idle_timeout: 30m
  # The maximum number of requests per rate_duration allowed per client IP.
  # Zero or negative disables rate limiting entirely. Localhost (127.0.0.1,
  # ::1) bypasses the limit, so health probes and tests from the local
  # frontend are not throttled.
  rate_limit: 60
  # The time window for rate limiting calculations. With rate_limit=60 and
  # rate_duration=1m, each IP is allowed 60 requests per minute. Typical
  # values are in seconds to minutes.
  rate_duration: 1m
  # Disables all rate limiting (global and per-endpoint) when true. Only
  # effective when Production=false, so it cannot be silently enabled in
  # production. Used for local development to avoid throttling during testing.
  rate_limit_disable_for_dev: false
  # Holds per-endpoint rate limits for certificate request creation endpoints.
  # Zero or negative disables the specific limit.
  cert_request_rate_limit:
    # The limit for POST /api/certs/user (interactive user cert).
    user: 10
    # The limit for POST /api/certs/service/enroll (service enrollment,
    # unattended).
    service_enroll: 5
    # The limit for POST /api/certs/pam (short-lived PAM cert, gated on local
    # interaction).
    pam: 10
  # Holds the rate limit configuration for service enrollment code redemption,
  # keyed on the enrollment code to protect against brute-forcing. Zero or
  # negative disables the specific limit.
  service_code_rate_limit:
    # Requests per second per enrollment code. Zero or negative disables this
    # limit.
    limit: 1
  # (HTTP Strict-Transport-Security) is sent in the Strict-Transport-Security
  # header on every response, but only when the server terminates TLS itself
  # (i.e. tls.certificate_file and tls.private_key_file are set). Browsers
  # ignore HSTS over plain HTTP. Empty disables the header, useful when a
  # TLS-terminating reverse proxy in front sets its own policy. Typical values
  # include "max-age=31536000; includeSubDomains".
  hsts: "max-age=31536000; includeSubDomains"
  # Holds the server's TLS configuration: certificate/key material, cipher
  # suites, protocol versions, and supported curves. See TLSConfig for
  # detailed field options. If no certificate/key pair is configured, the
  # server runs without TLS, serving plain HTTP with HTTP/2 cleartext (h2c)
  # enabled.
  #
  # The certificate and key are given as paths to PEM files
  # (CertificateFile/PrivateKeyFile); both must be set. If the pair is
  # incomplete, callers typically run without TLS instead.
  #
  # tls.cipher_suites, TLSMinVersion, and tls.curves are resolved by this
  # package's tls.cipher_suites, MinVersion, and Curve functions: an
  # unrecognized name fails, and a configuration that crypto/tls or net/http
  # rejects (see tls.cipher_suites) should shut the server down rather than be
  # logged and ignored.
  tls:
    # Restricts the TLS 1.0-1.2 cipher suites offered (Go does not allow
    # configuring TLS 1.3 suites). Names must exactly match crypto/tls constant
    # names, case-sensitively, e.g. "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"; the
    # stdlib's insecure suites resolve too. Empty means Go's defaults. Any
    # explicit list must include TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 or
    # TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256: net/http's automatic HTTP/2 setup
    # refuses to serve without one of them, failing the server at startup.
    cipher_suites: []
    # The minimum TLS protocol version: TLS1.0, TLS1.1, TLS1.2, or TLS1.3.
    # Parsing tolerates case, "."/"-"/"_"/" " separators, and the
    # "tls"/"version" prefixes ("tls12", "TLS-1.2", and "VersionTLS12" all
    # work). TLS1.0 and TLS1.1 resolve but log a deprecation warning (RFC 8996).
    min_version: "TLS1.3"
    # Restricts the key-exchange curves/groups offered, in preference order:
    # P256, P384, P521, X25519, or X25519MLKEM768, with the same tolerant
    # parsing as TLSMinVersion ("CurveP256", "p-256", ...). Empty means Go's
    # defaults; note that naming any curve replaces those defaults entirely
    # rather than adding to them.
    curves: []
    # How often the certificate files are re-read on a timer, in addition to
    # SIGHUP which always reloads. Zero or negative disables the timer, leaving
    # SIGHUP as the only trigger.
    #
    # The timer exists for deployments where nothing signals the process: a
    # Kubernetes secret remount is the motivating case, since it replaces a
    # directory symlink rather than writing the files in place, so a filesystem
    # watch on the paths never fires.
    reload_interval: 0

# Carries the log destination for the internal message queue.

# Configures OAuth/OIDC authentication for the server. See OAuthConfig for
# details on provider URL, scopes, and field mapping from OIDC claims to
# ssoossh identity fields (username, groups).
authentication:
  # The OAuth2/OIDC client ID registered with the identity provider. Required.
  client_id: ""
  # The OAuth2 client secret.
  client_secret: ""
  # The OIDC provider's issuer URL, used for discovery. A trailing
  # /.well-known/openid-configuration is stripped automatically. Required.
  provider_url: ""
  # A space-separated list of additional scopes to request alongside the
  # always-included "openid" scope, e.g. "profile email".
  scopes: "profile email"
  # Maps ssoossh identity fields to claim names in the OIDC provider's ID
  # token. Username is the only required field; the rest are empty by default,
  # meaning "not populated from OIDC".
  fields:
    # Names the claim holding the local account username, e.g.
    # "preferred_username". Required.
    username: "preferred_username"
    # Names a claim expected to hold a JSON array of group names. It feeds the
    # certificate lifetime and require-group decision only; group membership is
    # never placed in an issued certificate (see docs/internals/invariants.md).
    groups: "groups"
    # Names a claim expected to hold a JSON array of alternate account
    # identifiers this identity is known by on target systems (a different
    # username, UPN, or sAMAccountName), added to a certificate's principal list
    # alongside the username claim.
    other_accounts: ""
    # Names a claim expected to hold a JSON array of service-account identifiers
    # this identity is authorized to manage and enroll certificates for.
    service_accounts: ""
    # Names the claim to read the user's email from. Empty falls back to the
    # standard "email" claim opportunistically (not an error if absent either
    # way).
    email: "email"
    # Maps additional template field names to claim names. Each configured claim
    # is captured at login (scalars as strings, string arrays as lists), stored
    # on the users row, and made available to key ID templates as
    # {{.Extra.<name>}} (or {{join .Extra.<name> "<sep>"}} for lists). A claim
    # absent from the ID token stores empty and renders as MISSING; login never
    # fails over one. Names with characters beyond letters/digits/underscores
    # need the template's index syntax: {{index .Extra "my-name"}}.


# Optionally enriches the OIDC identity with directory attributes.
#
# The schema is parsed but not yet consumed by the server: setting these has
# no effect on authentication or on issued certificates today. The fields
# are a starting guess at what a reference deployment (lldap) needs,
# documented so the config format is stable ahead of the lookup landing.
ldap:
  # Turns on the LDAP lookup once the server consumes it.
  enabled: false
  # The directory server to connect to.
  url: ""
  # The DN to bind as for the search.
  bind_dn: ""
  # The password for bind_dn.
  bind_password: ""
  # The search base for the user lookup.
  base_dn: ""
  # The search filter, keyed by the username resolved from OIDC.
  user_filter: ""
  # An independent log destination for LDAP activity, routed by a "type=ldap"
  # attribute. The routing is wired up regardless of whether LDAP enrichment
  # itself is consumed.


# Configures administrative, SOC, and auditor access. All group names are
# optional; empty disables the corresponding role.
admin:
  # The OIDC group a caller must belong to in order to access admin-scoped
  # operations (re-enabling users, reassigning any enrollment), plus
  # everything the SOC and auditor roles below can do. Empty disables admin
  # operations entirely. Fails closed: no identity, no group, or no configured
  # group all deny.
  require_group: ""
  # The OIDC group a caller must belong to in order to access SOC-scoped
  # containment operations: disabling users and expiring enrollments. SOC is
  # a child role of admin, so require_group members hold SOC access
  # regardless of this setting; empty therefore narrows SOC operations to
  # admins rather than disabling them. SOC members also hold auditor access,
  # but not the restorative or ownership operations — re-enabling a user and
  # reassigning an enrollment stay admin-only. Fails closed: no identity, or
  # membership in neither group, denies.
  soc_group: ""
  # The OIDC group a caller must belong to in order to access auditor-scoped
  # operations (viewing effective configuration, cross-user certificate
  # history). Auditor is a child role of admin and SOC, so require_group and
  # soc_group members hold auditor access regardless of this setting; empty
  # therefore narrows auditor operations to those roles rather than disabling
  # them. Fails closed: no identity, or membership in no granting group,
  # denies.
  auditor_group: ""
  # How long after a user is disabled before their service enrollments expire.
  # This gives running services time to notice and rotate credentials before
  # the certificates stop working. After this duration expires (see
  # service.SweepDisabledUserEnrollments), no new certificates can be issued
  # from the enrollment.
  disable_grace_period: 168h
  # The email address shown on the account-disabled page so a disabled user
  # can contact support. Empty disables the display (no mailto link on the
  # page).
  contact_email: ""
  # Free-text shown on the account-disabled page below the contact email.
  # Useful for explaining why the account was disabled or what the user should
  # do next.
  disabled_message: ""

# Optionally sources the CA key from a PKCS#11 token instead of ssh_key.
# Exactly one of the two may be set at the config level (API mode has
# neither; signing modes require one to be set). See docs/operations/hsm.md
# for setup.
#
# Supported: ECDSA P-256/384/521, RSA >= 2048. Ed25519 is not supported by
# PKCS#11 here; keep ssh_key for an Ed25519 CA.
#
#   hsm:
#     module: /usr/lib/softhsm/libsofthsm2.so
#     token_label: ssoossh-ca
#     pin_file: /etc/ssoossh/hsm-pin    # or pin: "1234"
#     key_label: ssoossh-ca
#     # key_id: "01"                    # hex CKA_ID, instead of key_label

# Configures the message broker behind the certificate pipeline. gochannel
# is in-process; NATS is required for multi-instance and split-process
# deployments.
#
# gochannel (in-process) is the default and suitable for single-instance
# deployments. NATS is required for multi-instance deployments where
# multiple ssoosshd processes share a database.
pubsub:
  # Selects which message-broker implementation to use. "gochannel" (default)
  # is in-process, suitable for single-instance. "nats" is required for
  # multi-instance deployments.
  backend: "gochannel"
  # Holds NATS-specific configuration. Required when Backend is "nats".
  nats:
    # The NATS server connection string, e.g. "nats://nats.example.com:4222".
    # Empty disables NATS (leaves Backend at gochannel).
    url: ""
    # The path to the client certificate for mTLS authentication. Required when
    # URL is set.
    cert_file: ""
    # The path to the client certificate's private key. Required when URL is
    # set.
    key_file: ""
    # The path to the CA certificate to verify the NATS server. Required when
    # URL is set.
    ca_file: ""

# Holds the issuance policy for each certificate type.
cert_options:
  # Configures issuance of user certificates: who may approve one, how long
  # they're valid for, and which SSH certificate extensions to grant.
  user:
    # The OIDC group an approver must belong to. Empty — the default — means
    # any authenticated user may approve, which is the behavior every deployment
    # has had so far.
    #
    # Worth setting even though approval is already bound to the requester at
    # approval: the binding answers "is this your request", this answers "are
    # you allowed certificates at all".
    require_group: ""
    # The ceiling on how long an issued user certificate is valid. Any lifetime
    # policy only ever narrows from here.
    valid_duration: 30s
    # The SSH certificate extensions a user certificate may carry, e.g.
    # permit-pty and permit-user-rc. A request is narrowed to the intersection
    # of what it asked for and this list.
    extensions: [permit-pty, permit-user-rc]
    # The fallback for the service and PAM templates when either is empty, since
    # user certificates are the common case. See docs/guide/features.md (key ID
    # templating).
    key_id_template: ""
    # Configures tiered certificate duration based on OIDC group membership and
    # source network narrowing — see
    # docs/operations/certificate-lifetime-policy.md.

  # Configures issuance of service certificates: the OIDC group required to
  # request one, how long they're valid for, and which SSH certificate
  # extensions to grant.
  service:
    # The OIDC group a requester must belong to in order to enroll a service
    # certificate. Empty means any authenticated user may.
    require_group: ""
    # The ceiling on how long each certificate produced from an enrollment is
    # valid, bounding every redemption of the code rather than the code itself.
    valid_duration: 8760h
    # The SSH certificate extensions a service certificate may carry. A request
    # is narrowed to the intersection of what it asked for and this list.
    extensions: []
    # How long the enrollment code minted at approval stays redeemable —
    # deliberately independent of ValidDuration, which bounds each certificate
    # the code produces.
    #
    # The two answer different questions. ValidDuration is "how long may one
    # issued certificate be used", and wants to be short.
    # service.enrollment_duration is "how long may this service keep asking for
    # a fresh one", and wants to be long: the code is reusable precisely so an
    # unattended job can run it from cron. Deriving one from the other collapsed
    # that — shortening a service certificate's lifetime also killed the code
    # within the same span, so a cron job re-enrolled by hand on every run.
    #
    # Each redemption gets ValidDuration afresh, measured from the redemption,
    # so a long code never yields a long certificate.
    enrollment_duration: 8760h
    # The key ID written into service certificates; see docs/guide/features.md
    # (key ID templating). Empty falls back to
    # cert_options.user.key_id_template.
    key_id_template: ""
    # Configures tiered certificate duration based on OIDC group membership and
    # source network narrowing — see
    # docs/operations/certificate-lifetime-policy.md.

  # Configures issuance of PAM certificates: short-lived certificates a
  # pam_ssoossh-authenticated local operation (e.g. `sudo`) validates once and
  # discards. Structurally identical to the user options, but its defaults and
  # fallback behavior deliberately diverge — see each field's comment.
  pam:
    # An optional OIDC group an approver must belong to for a PAM certificate to
    # be issued, and behaves exactly like cert_options.user.require_group: empty
    # means no group restriction.
    #
    # It is an extra filter an operator may apply, not the authorization itself.
    # Whether the local operation is permitted is the host's own decision —
    # pam_ssoossh authenticates the user, and the local PAM stack and sudoers
    # policy authorize them.
    require_group: ""
    # Should be seconds, not hours: a PAM certificate is validated once,
    # in-process, and discarded — it never enters an agent and is never
    # reused. Pick this together with the client's skew tolerance (see
    # pam_ssoossh/checks.go, check 4).
    valid_duration: 30s
    # Should default to empty. permit-pty and friends are meaningless for a
    # certificate that authenticates a single local operation and is then thrown
    # away.
    extensions: []
    # The key ID written into PAM certificates. Unlike the service template, it
    # does NOT fall back to cert_options.user.key_id_template: a sudo and a
    # login by the same person must stay distinguishable in an sshd or sudo
    # audit log, so PAM has its own built-in default instead of silently
    # inheriting the user template.
    key_id_template: ""
  # The whole budget: the longest a client waiting on a certificate request
  # can go before the server hands it a terminal answer. Everything else about
  # request timing is derived from it, by ApprovalTTL and SigningGrace below.
  #
  # The server owns this deadline rather than the client, and measures it from
  # the request's creation (see the request's creation), so a client
  # reconnecting to its event stream re-attaches to the original deadline
  # instead of extending it. If the client is gone for good, the approval and
  # the signature it was waiting for are moot anyway.
  client_timeout: 5m

# Configures outbound email notifications: the relay, the sender, and the
# local template overrides. Disabled by default; see
# docs/operations/email-notifications.md.
#
# Disabled is the default. A server that has never been told about a relay
# should not try to reach one, and notifications are an addition to the
# certificate flows rather than a part of them — every path that emits one
# works identically when this is off.
mail:
  # Turns outbound mail on. With it false the notification handler is not
  # registered at all, so no event is queued and nothing is rendered.
  enabled: false
  # The envelope and header sender, e.g. "ssoossh@example.com" or "ssoossh
  # <noreply@example.com>". Required when Enabled.
  from: ""
  # An optional Reply-To header. Worth setting to a monitored address: these
  # messages report credential activity, and the first thing a recipient does
  # with an unexpected one is try to reply.
  # reply_to: "ssh-admins@example.com"
  # Prepended to every rendered subject, e.g. "[ssoossh] ". Empty adds
  # nothing. Templates can also write their own subject in full; this exists
  # so an operator can tag every message without editing any template.
  subject_prefix: ""
  # An optional directory of local template overrides. A file there replaces
  # the embedded template of the same name; anything absent falls back to the
  # embedded one, so overriding a single message does not mean vendoring the
  # whole set. See docs/operations/email-notifications.md.
  # template_dir: "/etc/ssoossh/mail-templates"
  # The relay connection.
  smtp:
    # The relay hostname or address. Required when mail is enabled.
    host: "localhost"
    # The relay port: conventionally 25 for a local relay, 587 for submission
    # with STARTTLS, 465 for implicit TLS.
    port: 25
    # The transport policy — one of off, opportunistic (default), required, or
    # implicit.
    tls: "opportunistic"
    # Overrides the name the relay's certificate is verified against. Needed
    # only when Host is an address rather than the name on the certificate.
    # server_name: "smtp.example.com"
    # A PEM bundle to verify the relay's certificate against, for a relay using
    # a private CA. Empty uses the system trust store.
    # ca_file: "/etc/ssl/certs/internal-ca.pem"
    # Disables verification of the relay's certificate. It turns TLS into
    # obfuscation — an attacker who can redirect the connection can also
    # present their own certificate — so it exists for a lab with a
    # self-signed relay and is warned about at startup.
    insecure_skip_verify: false
    # Selects the SASL mechanism — one of none (default), auto, plain, login,
    # cram-md5, scram-sha-1, scram-sha-256, or xoauth2. "auto" negotiates the
    # strongest mechanism the relay advertises.
    auth: "none"
    # The SASL username. Required for every mechanism but none.
    # username: "ssoossh@example.com"
    # The SASL password, or the OAuth2 token for xoauth2. Prefer
    # smtp.password_file: this value is a secret sitting in a config file.
    # password: ""
    # Reads the password from a file instead, so the secret can be a mounted
    # file or a systemd credential rather than config text. Takes precedence
    # over Password when both are set. Read once at startup; trailing whitespace
    # is trimmed, since an editor's newline is never part of the password.
    # password_file: "/run/secrets/ssoossh-smtp-password"
    # The name announced in the EHLO/HELO greeting. Empty lets go-mail use the
    # local hostname, which is right unless the relay checks it against
    # something specific.
    # helo: "ssoossh.example.com"
    # Bounds a single delivery's connect-and-send. It bounds only the background
    # sender, never a request: nothing a browser or an unattended job waits on
    # is behind this.
    timeout: 15s
  # Routes mail delivery logs, same shape as every other component's logging
  # block.
  logging:
    # Log-file rotation for this destination, via the embedded timberjack
    # logger, with the same keys and meanings as logging.* above. This
    # destination is only split out of the main log once its filename is set;
    # until then its records go to the general log.
    # The minimum log level for this destination, in the same form as
    # logging.level.
    level: "info"
    # Includes the source file and line on each record.
    # add_source: false
    # Writes JSON instead of text. Text is meant to be read, not parsed: the
    # message is written as bare prose so quoted values in it are not escaped,
    # which is not a machine-readable format. Set this wherever a log collector
    # has to pull fields back out.
    # log_json: false

# Customizes the login page and web UI. All fields are optional; empty
# values mean no branding is configured.
branding:
  # The organization name displayed in the web UI (e.g., "Acme Corp"). Empty
  # disables organization-specific branding.
  org_name: ""
  # The filesystem path to the organization's logo image. Empty disables the
  # logo.
  #
  # Accepted types: PNG, JPEG, GIF, WebP, SVG. Maximum size: 1 MB (maxLogoSize
  # in server/controller/logo_image.go). The type is determined from the
  # file's own bytes, not its extension.
  #
  # Read once at startup and validated then, so a bad path fails the server
  # rather than producing a broken image later; replacing the file needs a
  # restart. Served from /api/branding/logo, always same-origin, so no
  # third-party host sees the unauthenticated login page's traffic.
  logo_path: ""
  # A plain-text message shown on the login page before authentication. Empty
  # disables the notice. Supports newlines for multi-line text.
  login_notice: ""
