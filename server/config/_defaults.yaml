http:
  address: 127.0.0.1
  port: 8080
  unix_socket: ""
  proxy_protocol: []
  trusted_proxies: []
  server_name: ""
  cookie_key: ""
  # Unset derives Secure from whether the deployment is HTTPS (tls below, or
  # is_https when a proxy terminates it). Set only to override that.
  cookie_secure:
  cookie_same_site: strict
  # Absolute session cap, measured from login; activity never extends it.
  cookie_max_age: 9h
  # Idle window; sliding - any request in the second half reissues it.
  cookie_idle_timeout: 30m
  rate_limit: 60
  rate_duration: 1m
  rate_limit_disable_for_dev: false
  cert_request_rate_limit:
    # Per-endpoint rate limits (requests per second per client IP).
    # Each creates an independent per-IP bucket. These apply in addition to
    # the global rate_limit above (both must be satisfied).
    # User cert request: interactive end-user, human-driven.
    user: 10
    # Host sign request: first host cert issuance, requires approval.
    host_sign: 5
    # Service enrollment: can be called by unattended service.
    service_enroll: 5
    # PAM certificate: gated on local interaction.
    pam: 10
  service_code_rate_limit:
    # Rate limit on POST /api/certs/service/retrieve, keyed on the
    # enrollment code to protect against brute-forcing across multiple IPs.
    # Requests per second per code. Disable with 0 or negative (not
    # recommended; code brute-forcing is a real threat).
    limit: 1
  hsts: "max-age=31536000; includeSubDomains"
  tls:
    min_version: TLS1.3
    cipher_suites: []
    curves: []
  access_logging:
    log_user_agent: true
    log_request_header: true
    log_client_ip: true
    log_request_id: false
    log_request_body: false
    log_response_body: false
    log_response_header: false
    log_span_id: false
    log_trace_id: false

# ldap and authentication are top-level, not nested under http: -- Config's
# mapstructure tags for LDAP and AuthConfig are on Config itself, not on
# HTTPSettings. Nesting them under http: here previously meant every default
# below was silently dropped by viper's unmarshal.
ldap:
  enabled: false
  url: ""
  bind_dn: ""
  bind_password: ""
  base_dn: ""
  user_filter: ""

authentication:
  client_id: ""
  client_secret: ""
  provider_url: ""
  redirect_url: ""
  scopes: "profile email"
  fields:
    username: "preferred_username"
    groups: "groups"
    other_accounts: ""
    service_accounts: ""
    email: "email"

logging:
  level: WARN
  include_app_name: true
  include_app_version: true
  log_json: false

production: true
traces: false
metrics: false
# Multi-instance declares that the server is part of a multi-instance
# deployment (multiple ssoosshd processes sharing a database and transport).
# When enabled, certain checks are enforced (e.g., cookie_key must be
# explicitly set) and behaviors adapt (e.g., Wait decodes wake messages).
multi_instance: false

db:
  provider: sqlite
  connection_string: "ssoossh.db"
  retry_attempts: 3
  retry_interval: 3s
  # Connection pool tuning. In-memory SQLite is always forced to 1 open
  # connection (no configuration needed). For file-backed SQLite, writes
  # serialize on the write lock regardless of pool size, so modest open
  # counts avoid queue buildup. For PostgreSQL, scale with expected
  # concurrency. MaxOpenConns=0 uses Go's default (typically 2).
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 0
  logging:
    level: WARN
    add_source: false
    log_json: false

cert_options:
  request_ttl: 5m
  signing_timeout: 5m
  user:
    # Empty means any authenticated user may approve their own request.
    require_group: ""
    valid_duration: 30s
    extensions:
      - permit-pty
      - permit-user-rc
    key_id_template: ""
  service:
    require_group: ""
    valid_duration: 8760h
    extensions: []
    key_id_template: ""
  host:
    require_group: ""
    valid_duration: 8760h
    key_id_template: ""
  pam:
    # Empty denies: unlike user/service/host, an unset require_group means
    # no PAM certificates are ever issued, not "any authenticated user."
    require_group: ""
    valid_duration: 30s
    extensions: []
    key_id_template: ""

branding:
  # Optional branding for the login page and web UI. All fields are optional;
  # empty values mean no branding is configured. This endpoint is
  # unauthenticated, so only include values that are safe for public display.
  org_name: ""
  logo_path: ""
  login_notice: ""
