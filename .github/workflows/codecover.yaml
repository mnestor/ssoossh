name: codecover
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  coverage:
    runs-on: self-hosted
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: codecheck
    steps:
      - uses: 1password/load-secrets-action@v5
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://Github Actions/CODECOV_TOKEN/credential

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # server/frontend embeds server/frontend/dist and nothing there is
      # tracked, so the Go build cannot compile until the UI exists.
      - name: Build web UI
        run: make frontend

      - name: Run tests
        run: CGO_ENABLED=0 go test -v -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ steps.secrets.outputs.CODECOV_TOKEN }}
