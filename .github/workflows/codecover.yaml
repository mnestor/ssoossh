name: codecover
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: codecheck
    steps:
      - name: add required stuff
        run: |
          apt-get update && apt-get install -y libatomic1 build-essential unzip ca-certificates git curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.6.0
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          version: 11

      # server/frontend embeds server/frontend/dist and nothing there is
      # tracked, so the Go build cannot compile until the UI exists.
      - name: Build web UI
        run: make frontend

      - name: Run tests
        run: CGO_ENABLED=0 go test -v -covermode=atomic -coverprofile=coverage.txt ./...

      - uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://Github Actions/CODECOV_TOKEN/credential

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5.5.5
        with:
          token: ${{ steps.secrets.outputs.CODECOV_TOKEN }}
