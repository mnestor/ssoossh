name: codecover

# Unit test suite plus Codecov upload. Runs on hosted runners; the
# e2e/pam/resilience suites are tagged out of `./...` so this stays the
# fast whole-repo unit gate.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # No `changes` path gate: the gate job costs about as much as a fraction
  # of this job, and coverage on every PR is the point of the workflow.
  coverage:
    name: codecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Install dependencies
        run: go mod download

      # server/frontend embeds server/frontend/dist and nothing there is
      # tracked, so the Go build cannot compile until the UI exists.
      - name: Build web UI
        run: make frontend

      - name: Run tests
        run: CGO_ENABLED=1 go test -buildvcs=false -v -covermode=atomic -coverprofile=coverage.txt ./...

      # Separate run, and it is not optional. Every file in pam_ssoossh/
      # carries //go:build pam -- sources and tests alike -- so the run above
      # compiles the package to nothing. It contributed neither numerator nor
      # denominator to coverage.txt, which meant PAM's real coverage reached
      # no dashboard and a regression in it moved no number. `make test-pam`
      # ran the tests but passed no -coverprofile, so nothing measured them.
      #
      # PAM is the authorization decision for sudo. It is the last part of
      # this repo that should be invisible to coverage.
      - name: Run PAM tests
        run: CGO_ENABLED=1 go test -buildvcs=false -v -tags=pam -covermode=atomic -coverprofile=coverage-pam.txt ./pam_ssoossh/...

      # The ratchet. Coverage regressions are about direction, not position:
      # client/cmd fell 88.7% -> 76.6% over a fortnight with nothing deleted,
      # just new code landing under-tested, and no gate noticed. Reuses the
      # profiles the two steps above already produced rather than running the
      # suite a third time.
      #
      # `!cancelled()` so a coverage drop is still reported when some other
      # step failed -- the two are usually the same change.
      - name: Check coverage floors
        if: ${{ !cancelled() }}
        run: |
          # Into a copy, never coverage.txt itself: the Codecov upload below
          # takes both files, so appending the PAM profile to the main one
          # would count those packages twice.
          cp coverage.txt coverage-combined.txt
          tail -n +2 coverage-pam.txt >> coverage-combined.txt
          ./scripts/check-coverage-floors.sh coverage-combined.txt

      # `!cancelled()` on this step too, not just the upload: a failing
      # test run used to stop the job before the token was ever loaded,
      # which silently skipped the upload the condition below was meant to
      # keep alive.
      #
      # The fork clause is the second half of the same problem: a
      # pull_request from a fork gets no repository secrets, so
      # OP_SERVICE_ACCOUNT_TOKEN arrives empty and this step fails the job
      # for a contributor who has no way to fix it. Skip the upload there
      # instead. workflow_dispatch carries no event.pull_request at all,
      # which is why event_name is tested first.
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://Github Actions/CODECOV_TOKEN/credential

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.secrets.outputs.CODECOV_TOKEN }}
          # Both profiles, or the PAM one is collected and thrown away.
          # Codecov merges them; they cover disjoint packages, so there is
          # no double counting.
          files: ./coverage.txt,./coverage-pam.txt
