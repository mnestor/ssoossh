name: build-test

# The PR gate. codecover.yaml runs on a self-hosted runner and needs
# 1Password secrets, so it cannot be relied on to block a merge; this job
# runs on a hosted runner with no secrets and does.
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pam:
    runs-on: [self-hosted, PAM-BUILDER]
    steps:
      - name: Set owner of working dir recurively (Linux)
        run: sudo chown -R $(whoami) /home/$(whoami)/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build amd64 pam_ssoossh
        run: |
          scripts/build-pam-release.sh amd64 release true

      - name: Build arm64 pam_ssoossh
        run: |
          scripts/build-pam-release.sh arm64 release true

  build-test-non-pam:
    runs-on: [self-hosted]
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    steps:
      - name: Set owner of working dir recurively (Linux)
        run: sudo chown -R $(whoami) /home/$(whoami)/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.6.0
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          version: 11

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated. The golden test in server/webtypes
      # catches the same drift against docs/openapi.yaml and the goldens
      # themselves; this half is what keeps the browser's types honest.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      # Must run before goreleaser: the server binary embeds
      # server/frontend/dist, and only a placeholder index.html is tracked.
      # Skipping this would ship a release with no web UI.
      - name: Build web UI
        run: make frontend

      # - uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
      #   id: secrets
      #   env:
      #     OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      #     QUILL_NOTARY_ISSUER: op://Github Actions/oqwo32gbo3ktrgutdcvzsr6msy/QUILL_NOTARY_ISSUER
      #     QUILL_NOTARY_KEY: op://Github Actions/oqwo32gbo3ktrgutdcvzsr6msy/QUILL_NOTARY_KEY
      #     QUILL_NOTARY_KEY_ID: op://Github Actions/oqwo32gbo3ktrgutdcvzsr6msy/QUILL_NOTARY_KEY_ID
      #     QUILL_SIGN_P12: op://Github Actions/oqwo32gbo3ktrgutdcvzsr6msy/QUILL_SIGN_P12
      #     QUILL_SIGN_PASSWORD: op://Github Actions/oqwo32gbo3ktrgutdcvzsr6msy/QUILL_SIGN_PASSWORD

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v6.4.0
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: nightly
          args: release --clean -f .goreleaser.yml --snapshot=true ${{ vars.DEBUG }}
        env:
          # Quill signing/notarization secrets and the 1Password step above
          # come back with macOS builds in phase 10
          # (docs/delivery-phase10-ga.md).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # QUILL_NOTARY_ISSUER: ${{ env.secrets.outputs.QUILL_NOTARY_ISSUER }}
          # QUILL_NOTARY_KEY: ${{ env.secrets.outputs.QUILL_NOTARY_KEY }}
          # QUILL_NOTARY_KEY_ID: ${{ env.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          # QUILL_SIGN_P12: ${{ env.secrets.outputs.QUILL_SIGN_P12 }}
          # QUILL_SIGN_PASSWORD: ${{ env.secrets.outputs.QUILL_SIGN_PASSWORD }}
