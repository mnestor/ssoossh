name: build-test

# The PR gate. codecover.yaml runs on a self-hosted runner and needs
# 1Password secrets, so it cannot be relied on to block a merge; this job
# runs on a hosted runner with no secrets and does.
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10

      # server/frontend embeds server/frontend/dist and nothing there is
      # tracked, so the Go build cannot compile until the UI exists.
      - name: Build web UI
        run: make frontend

      - name: Build
        run: go build ./...

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated. The golden test in server/webtypes
      # catches the same drift against docs/openapi.yaml and the goldens
      # themselves; this half is what keeps the browser's types honest.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      # CGO_ENABLED is explicit because -race requires cgo, and the repo's
      # own dev container sets CGO_ENABLED=0 — without this the step would
      # pass or fail depending on where it runs. pam_ssoossh stays excluded
      # regardless: it is gated by the `pam` build tag, not by cgo.
      - name: Test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # pam_ssoossh (pam_ssoossh/, `pam` build tag) needs libpam headers and
  # cgo, neither of which build-test's own job above has or needs for the
  # rest of the tree (see the Test step's comment). It doesn't import
  # server/ or client/, so it needs none of that job's frontend setup
  # either. See docs/release-phase3-pam-build-env.md.
  pam:
    name: pam build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Install PAM build dependencies
        run: scripts/build-env-for-pam.sh

      # Same install this Makefile step needs everywhere else (see
      # .devcontainer/Dockerfile); this runner doesn't have it. Pinned to
      # the same v2.12 line as lint.yaml's golangci-lint-action, since
      # .golangci.yml is a `version: "2"` config golangci-lint v1 can't
      # parse.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Build
        run: make pam

      - name: Test
        run: make test-pam

      - name: Lint
        run: make lint-pam
