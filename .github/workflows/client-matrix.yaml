name: client-matrix
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile-verify:
    name: Cross-compile verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Verify compilation for all platforms and architectures
        run: |
          set -e
          echo "Verifying linux-amd64..."
          GOOS=linux GOARCH=amd64 go build -v ./cmd/ssoossh/

          echo "Verifying linux-arm64..."
          GOOS=linux GOARCH=arm64 go build -v ./cmd/ssoossh/

          echo "Verifying darwin-amd64..."
          GOOS=darwin GOARCH=amd64 go build -v ./cmd/ssoossh/

          echo "Verifying darwin-arm64..."
          GOOS=darwin GOARCH=arm64 go build -v ./cmd/ssoossh/

          echo "Verifying windows-amd64..."
          GOOS=windows GOARCH=amd64 go build -v ./cmd/ssoossh/

          echo "Verifying windows-arm64..."
          GOOS=windows GOARCH=arm64 go build -v ./cmd/ssoossh/

          echo "All platforms verified"

  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run client tests
        run: go test -v -count=1 ./client/...

      - name: Run agent tests
        run: go test -v -count=1 ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Running Linux-specific platform tests..."
          go test -v -count=1 -run ".*Platform.*" ./client/config/...
          go test -v -count=1 -run ".*Platform.*" ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Running macOS-specific platform tests..."
          go test -v -count=1 -run ".*Darwin|.*macOS|.*Launchd" ./client/config/...
          go test -v -count=1 -run ".*Darwin|.*macOS|.*Launchd" ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Running Windows-specific platform tests..."
          go test -v -count=1 -run ".*Windows|.*Pageant|.*WSL" ./client/config/...
          go test -v -count=1 -run ".*Windows|.*Pageant|.*WSL" ./internal/crypto/ssh/agent/...

      - name: Collect coverage
        if: always()
        run: go test -v -count=1 -coverprofile=coverage-${{ matrix.os }}.txt ./client/... ./internal/crypto/ssh/agent/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.txt
          retention-days: 7

  coverage-merge:
    name: Merge coverage reports
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage

      - name: Merge coverage reports
        run: |
          # Combine all coverage files
          echo "mode: set" > combined.txt
          for f in coverage/coverage-*/coverage-*.txt; do
            if [ -f "$f" ]; then
              tail -n +2 "$f" >> combined.txt
            fi
          done

          # Report coverage
          go tool cover -func combined.txt | tail -20 || true

      - name: Check coverage threshold
        run: |
          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func combined.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          # Minimum 80% for client and agent packages
          THRESHOLD=80
          if [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
            echo "Coverage $COVERAGE% is below threshold of $THRESHOLD%"
            exit 1
          fi
