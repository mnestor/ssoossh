name: client-matrix

# Cross-platform pass/fail check for the code that runs on end-user
# machines: the client and the ssh agent. Linux alone would miss
# Windows/macOS-specific path handling, agent sockets (Pageant, launchd),
# and keychain behavior.
#
# macOS and Windows only: codecover.yaml already runs the full unit suite
# on Linux for every PR this workflow triggers on (its path filter is a
# superset of ours), and it owns coverage reporting too — so there is no
# ubuntu leg and no coverage collection here.
#
# The goreleaser snapshot job that used to live here was a duplicate of
# build.yaml's build-most (same config, same secrets, every PR); build.yaml
# owns release-pipeline validation now.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: skip the matrix (macOS minutes bill at 10x) when the
  # client/agent code didn't change. Skipped jobs still satisfy required
  # checks; see build.yaml's changes job for the pattern.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'client/**'
              - 'cmd/ssoossh/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/client-matrix.yaml'

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      # One unfiltered run per OS is the whole job: it already includes
      # every platform-specific test compiled in for this GOOS. No
      # -coverprofile — coverage is codecover.yaml's job, and merging
      # partial per-OS profiles here would double-count or false-fail on
      # files behind build tags.
      #
      # internal/fileperm is here because its Windows half is the only
      # thing standing between a private key and every account on the
      # machine, and the Linux leg cannot compile that file at all, let
      # alone check the access list it writes.
      - name: Run client and agent tests
        run: go test -count=1 ./client/... ./internal/crypto/ssh/agent/... ./internal/fileperm/...
