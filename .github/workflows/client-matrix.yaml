name: client-matrix

# Cross-platform coverage for the code that runs on end-user machines: the
# client and the ssh agent. Linux alone would miss Windows/macOS-specific
# path handling, agent sockets (Pageant, launchd), and keychain behavior.
#
# The goreleaser snapshot job that used to live here was a duplicate of
# build.yaml's build-most (same config, same secrets, every PR); build.yaml
# owns release-pipeline validation now.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Weekly double check; PRs do the heavy lifting day to day.
    - cron: "30 4 * * 1" # 04:30 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: skip the 3-OS matrix (macOS minutes bill at 10x) when the
  # client/agent code didn't change. Skipped jobs still satisfy required
  # checks; see build.yaml's changes job for the pattern.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'client/**'
              - 'cmd/ssoossh/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/client-matrix.yaml'

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      # One run does everything: the unfiltered invocation already includes
      # every platform-specific test compiled in for this GOOS, and
      # -coverprofile on the same run replaces the separate coverage pass
      # that used to execute the whole suite a second time per OS.
      - name: Run client and agent tests
        run: go test -count=1 -coverprofile=coverage-${{ matrix.os }}.txt ./client/... ./internal/crypto/ssh/agent/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.txt
          retention-days: 7

  coverage-merge:
    name: Merge coverage reports
    needs: [changes, test-matrix]
    # Run whenever the matrix actually ran, even partially failed, so a
    # single red OS still produces a merged report; skip when the paths
    # gate skipped the matrix.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && contains(fromJSON('["success", "failure"]'), needs.test-matrix.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage
          pattern: coverage-*

      - name: Merge coverage reports
        run: |
          # Combine all coverage files
          echo "mode: set" > combined.txt
          for f in coverage/coverage-*/coverage-*.txt; do
            if [ -f "$f" ]; then
              tail -n +2 "$f" >> combined.txt
            fi
          done

          # Report coverage
          go tool cover -func combined.txt | tail -20 || true

      - name: Check coverage threshold
        run: |
          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func combined.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          # Minimum 80% for client and agent packages
          THRESHOLD=80
          if [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
            echo "Coverage $COVERAGE% is below threshold of $THRESHOLD%"
            exit 1
          fi
