name: client-matrix
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-build:
    name: Release snapshot build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 26

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          version: 11

      # goreleaser builds ssoosshd too, and the server embeds
      # server/frontend/dist - only a placeholder index.html is tracked.
      - name: Build web UI
        run: make frontend

      # Real signing material, same as the release workflow: a snapshot
      # build through the actual .goreleaser.yml (every platform and arch,
      # minus the PAM modules which have their own configs) validates the
      # release pipeline itself on every PR, not just that six GOOS/GOARCH
      # pairs compile. The quill post-hook fails without these - verified,
      # not assumed - so this job needs the same secrets release does.
      - uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GPG_PASSPHRASE: "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password"
          QUILL_NOTARY_ISSUER: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_ISSUER
          QUILL_NOTARY_KEY: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY
          QUILL_NOTARY_KEY_ID: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY_ID
          QUILL_SIGN_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_P12
          QUILL_SIGN_PASSWORD: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_PASSWORD

      - name: Save gpg key
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > "${GITHUB_WORKSPACE}/private.pgp"
          git config --global --add safe.directory "$(pwd)"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v6.4.0
        with:
          distribution: goreleaser
          version: nightly
          args: build -f .goreleaser.yml --clean --snapshot
        env:
          RELEASE: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NFPM_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          QUILL_NOTARY_ISSUER: ${{ steps.secrets.outputs.QUILL_NOTARY_ISSUER }}
          QUILL_NOTARY_KEY: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          QUILL_SIGN_P12: ${{ steps.secrets.outputs.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ steps.secrets.outputs.QUILL_SIGN_PASSWORD }}

  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run client tests
        run: go test -v -count=1 ./client/...

      - name: Run agent tests
        run: go test -v -count=1 ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Running Linux-specific platform tests..."
          go test -v -count=1 -run ".*Platform.*" ./client/config/...
          go test -v -count=1 -run ".*Platform.*" ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Running macOS-specific platform tests..."
          go test -v -count=1 -run ".*Darwin|.*macOS|.*Launchd" ./client/config/...
          go test -v -count=1 -run ".*Darwin|.*macOS|.*Launchd" ./internal/crypto/ssh/agent/...

      - name: Run platform-specific tests (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Running Windows-specific platform tests..."
          go test -v -count=1 -run ".*Windows|.*Pageant|.*WSL" ./client/config/...
          go test -v -count=1 -run ".*Windows|.*Pageant|.*WSL" ./internal/crypto/ssh/agent/...

      - name: Collect coverage
        if: always()
        run: go test -v -count=1 -coverprofile=coverage-${{ matrix.os }}.txt ./client/... ./internal/crypto/ssh/agent/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.txt
          retention-days: 7

  coverage-merge:
    name: Merge coverage reports
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage

      - name: Merge coverage reports
        run: |
          # Combine all coverage files
          echo "mode: set" > combined.txt
          for f in coverage/coverage-*/coverage-*.txt; do
            if [ -f "$f" ]; then
              tail -n +2 "$f" >> combined.txt
            fi
          done

          # Report coverage
          go tool cover -func combined.txt | tail -20 || true

      - name: Check coverage threshold
        run: |
          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func combined.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          # Minimum 80% for client and agent packages
          THRESHOLD=80
          if [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
            echo "Coverage $COVERAGE% is below threshold of $THRESHOLD%"
            exit 1
          fi
