name: build

# The release pipeline and its PR dry-run. On a v* tag push this publishes
# the real release (goreleaser archives/packages, the ssoosshd Docker
# image); on PRs it runs the same pipeline in snapshot mode so a broken
# release config is caught before merge. The weekly run re-validates the
# pipeline against upstream drift (new goreleaser, new base images) even
# when nothing has been pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
  schedule:
    # Weekly pipeline double check; PRs do the heavy lifting day to day.
    - cron: "0 4 * * 1" # 04:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: on PRs, skip the expensive build jobs when nothing that
  # feeds the release changed. Implemented as a filter job rather than
  # `on.pull_request.paths` so a required check still reports (as skipped,
  # which satisfies branch protection) instead of hanging in "expected".
  # On non-PR events the filter step is skipped and the fallback in the
  # output expression makes everything run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.goreleaser*.yml'
              - 'docs/openapi.yaml'
              - 'tygo.yaml'
              - '.redoclyrc.yaml'
              - '.github/workflows/build.yaml'

  build-pam:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runs }}
    timeout-minutes: 30
    permissions:
      # goreleaser uploads release assets on tag pushes, and the cleanup
      # step deletes the .so asset from the release afterwards.
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs: ubuntu-24.04
          - arch: arm64
            runs: ubuntu-24.04-arm
    container:
      image: ghcr.io/mnestor/ssoossh-pam-builer:latest-${{ matrix.arch }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      # Deliberately not the pinned v7 used everywhere else: this container
      # is an old-glibc PAM builder (see .github/workflows/TODO.md) that
      # cannot run the node runtime newer checkout versions need. Revisit
      # when the builder image moves to a newer base.
      - uses: actions/checkout@v1
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > private.pgp
          export NFPM_PASSPHRASE="$(op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password")"
          git config --global --add safe.directory "$(pwd)"
          goreleaser release --clean -f .goreleaser-pam-${ARCH}.yml --snapshot=${IS_SNAPSHOT}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          IS_SNAPSHOT: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: cleanup
        if: always()
        run: |
          rm -f private.pgp || true

      - name: remove the so files, we don't need them
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAGNV=$(echo ${TAG} |cut -c2-15)
          gh release delete-asset -y ${TAG} pam_ssoossh_${TAGNV}_linux_${ARCH}.so

  build-most:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialized after build-pam on purpose: on a tag push both goreleaser
    # configs write assets into the same GitHub release, and racing them
    # has caused duplicate-release creation.
    needs: [changes, build-pam]
    if: needs.changes.outputs.code == 'true'
    permissions:
      # goreleaser creates the release and uploads assets on tag pushes.
      contents: write
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated. The golden test in server/webtypes
      # catches the same drift against docs/openapi.yaml and the goldens
      # themselves; this half is what keeps the browser's types honest.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      # Validate the OpenAPI spec against the OpenAPI 3.1 specification.
      - name: Lint OpenAPI spec
        run: make openapi-lint

      # Must run before goreleaser: the server binary embeds
      # server/frontend/dist, and only a placeholder index.html is tracked.
      # Skipping this would ship a release with no web UI.
      - name: Build web UI
        run: make frontend

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GPG_PASSPHRASE: "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password"
          QUILL_NOTARY_ISSUER: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_ISSUER
          QUILL_NOTARY_KEY: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY
          QUILL_NOTARY_KEY_ID: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY_ID
          QUILL_SIGN_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_P12
          QUILL_SIGN_PASSWORD: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_PASSWORD

      - name: Save gpg key
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > "${GITHUB_WORKSPACE}/private.pgp"
          git config --global --add safe.directory "$(pwd)"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Latest stable v2 release, not nightly: releases should not
          # depend on an unreleased goreleaser build.
          version: "~> v2"
          args: release --clean -f .goreleaser.yml --snapshot=${{ !startsWith(github.ref, 'refs/tags/') }} ${{ vars.DEBUG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NFPM_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          QUILL_NOTARY_ISSUER: ${{ steps.secrets.outputs.QUILL_NOTARY_ISSUER }}
          QUILL_NOTARY_KEY: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          QUILL_SIGN_P12: ${{ steps.secrets.outputs.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ steps.secrets.outputs.QUILL_SIGN_PASSWORD }}

      - name: remove the release, we failed
        if: startsWith(github.ref, 'refs/tags/') && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete -y ${TAG}

  # Builds the operator-facing Docker Compose deployment's image (see
  # Dockerfile, deploy/docker-compose.yml, docs/deployment.md) and pushes it
  # to ghcr.io/mnestor/ssoosshd so an admin running the compose file never
  # builds the project themselves -- `docker compose up` just pulls. Only
  # the server ships as an image; the client and pam_ssoossh stay
  # .deb/.rpm/.zip via goreleaser above, since they run on the machine doing
  # the sshing/sudoing, not in a container.
  #
  # Built on every PR too (catches a broken Dockerfile before merge), but
  # only pushed, and only tagged, on an actual v* release tag -- deliberately
  # no `latest` and no branch/sha tags. A floating `latest` means an
  # operator's `docker compose pull` silently changes what's running on
  # restart; every image this pushes is meant to be pinned by version
  # instead (see deploy/docker-compose.yml's SSOOSSHD_VERSION). This mirrors
  # how goreleaser above treats a tag push as the real release and
  # everything else as a snapshot that publishes nothing.
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated behind build-most so a tag push never publishes an image for a
    # release whose goreleaser half failed and was deleted.
    needs: [changes, build-most]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only type=semver rules: on anything but a v* tag push these match
      # nothing and meta.outputs.tags comes back empty, which is fine below
      # since push is false whenever that's the case.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mnestor/ssoosshd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
