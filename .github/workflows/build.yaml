name: build

# The release pipeline, plus the cheap check that stands in for it on PRs.
#
# On a v* tag push this publishes the real release (goreleaser
# archives/packages, the ssoosshd Docker image). PRs no longer run that
# pipeline: they run `build-check`, which does the generated-artifact
# staleness checks and a single-target snapshot build, with no release
# secrets on the runner. The weekly run is what still exercises the full
# multi-platform signed pipeline against upstream drift (new goreleaser,
# new base images), which is the job the PR dry-run was really doing and
# was paying for on every push to do it.
on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
  schedule:
    # The only run that exercises the full signed multi-platform pipeline
    # outside an actual release. Kept while the other weekly duplicates
    # were dropped, because this one is not a duplicate of anything a PR
    # does.
    - cron: "0 4 * * 1" # 04:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: on PRs, skip the expensive build jobs when nothing that
  # feeds the release changed. Implemented as a filter job rather than
  # `on.pull_request.paths` so a required check still reports (as skipped,
  # which satisfies branch protection) instead of hanging in "expected".
  # On non-PR events the filter step is skipped and the fallback in the
  # output expression makes everything run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.goreleaser*.yml'
              - 'docs/openapi.yaml'
              - 'tygo.yaml'
              - '.redoclyrc.yaml'
              - '.github/workflows/build.yaml'

  # What a PR gets instead of the release pipeline: the checks that catch a
  # committed artifact going stale, plus proof that the tree still builds
  # through goreleaser. One target (linux/amd64) rather than four platforms,
  # no PAM containers, and no 1Password/GPG/notarization secrets -- a PR
  # branch does not need the signing key to prove the config parses.
  build-check:
    name: build check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      - name: Lint OpenAPI spec
        run: make openapi-lint

      # Man pages are generated from the cobra commands; same staleness
      # trap as the two above.
      - name: Check generated man pages are current
        run: make man-check

      # The server binary embeds server/frontend/dist.
      - name: Build web UI
        run: make frontend

      - name: Snapshot build (linux/amd64)
        run: |
          git config --global --add safe.directory "$(pwd)"
          goreleaser build --single-target --snapshot --clean -f .goreleaser.yml
        env:
          GOOS: linux
          GOARCH: amd64

  build-pam:
    needs: changes
    # Tag pushes, the weekly pipeline check, and manual dispatch only. PRs
    # get build-check above.
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runs }}
    timeout-minutes: 30
    permissions:
      # goreleaser uploads release assets on tag pushes, and the cleanup
      # step deletes the .so asset from the release afterwards.
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs: ubuntu-24.04
          - arch: arm64
            runs: ubuntu-24.04-arm
    container:
      image: ghcr.io/mnestor/ssoossh-pam-builer:latest-${{ matrix.arch }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      # Deliberately not the v7 used everywhere else: this container is an
      # old-glibc PAM builder (see .github/workflows/TODO.md) that cannot
      # run the node runtime newer checkout versions need. Revisit when the
      # builder image moves to a newer base.
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v1
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > private.pgp
          export NFPM_PASSPHRASE="$(op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password")"
          git config --global --add safe.directory "$(pwd)"
          goreleaser release --clean -f .goreleaser-pam-${ARCH}.yml --snapshot=${IS_SNAPSHOT}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          IS_SNAPSHOT: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: cleanup
        if: always()
        run: |
          rm -f private.pgp || true

      - name: remove the so files, we don't need them
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAGNV=$(echo ${TAG} |cut -c2-15)
          gh release delete-asset -y ${TAG} pam_ssoossh_${TAGNV}_linux_${ARCH}.so

  build-most:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialized after build-pam on purpose: on a tag push both goreleaser
    # configs write assets into the same GitHub release, and racing them
    # has caused duplicate-release creation.
    needs: [changes, build-pam]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      # goreleaser creates the release and uploads assets on tag pushes.
      contents: write
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated. The golden test in server/webtypes
      # catches the same drift against docs/openapi.yaml and the goldens
      # themselves; this half is what keeps the browser's types honest.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      # Validate the OpenAPI spec against the OpenAPI 3.1 specification.
      - name: Lint OpenAPI spec
        run: make openapi-lint

      # Man pages are generated from the cobra commands. A stale page must
      # not ship in a release archive.
      - name: Check generated man pages are current
        run: make man-check

      # Must run before goreleaser: the server binary embeds
      # server/frontend/dist, and only a placeholder index.html is tracked.
      # Skipping this would ship a release with no web UI.
      - name: Build web UI
        run: make frontend

      - name: Set up Zig
        run: |
          mkdir -p /tmp/zig
          cd /tmp/zig
          wget -q https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          tar -xf zig-linux-x86_64-0.14.0.tar.xz
          echo "/tmp/zig/zig-linux-x86_64-0.14.0" >> $GITHUB_PATH

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GPG_PASSPHRASE: "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password"
          QUILL_NOTARY_ISSUER: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_ISSUER
          QUILL_NOTARY_KEY: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY
          QUILL_NOTARY_KEY_ID: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY_ID
          QUILL_SIGN_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_P12
          QUILL_SIGN_PASSWORD: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_PASSWORD

      - name: Save gpg key
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > "${GITHUB_WORKSPACE}/private.pgp"
          git config --global --add safe.directory "$(pwd)"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Latest stable v2 release, not nightly: releases should not
          # depend on an unreleased goreleaser build.
          version: "~> v2"
          args: release --clean -f .goreleaser.yml --snapshot=${{ !startsWith(github.ref, 'refs/tags/') }} ${{ vars.DEBUG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NFPM_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          QUILL_NOTARY_ISSUER: ${{ steps.secrets.outputs.QUILL_NOTARY_ISSUER }}
          QUILL_NOTARY_KEY: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          QUILL_SIGN_P12: ${{ steps.secrets.outputs.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ steps.secrets.outputs.QUILL_SIGN_PASSWORD }}

      - name: Verify glibc floor (GNU build)
        run: |
          set -euo pipefail
          GLIBC_MAX=$(objdump -T dist/server-linux-build_linux_amd64_v1/ssoosshd 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "Maximum GLIBC version in ssoosshd: $GLIBC_MAX"
          if [ "$GLIBC_MAX" = "GLIBC_2.28" ]; then
            echo "✓ glibc floor is 2.28 (expected)"
          elif [ -z "$GLIBC_MAX" ]; then
            echo "✗ Could not determine GLIBC version (static binary?)"
            exit 1
          else
            echo "✗ GLIBC version $GLIBC_MAX is newer than 2.28 floor"
            exit 1
          fi

      - name: Verify musl build is dynamically linked (Alpine)
        run: |
          set -euo pipefail
          MUSL_BINARY="dist/server-linux-musl-build_linux_amd64_v1/ssoosshd"
          if [ ! -f "$MUSL_BINARY" ]; then
            echo "✗ musl binary not found at $MUSL_BINARY"
            exit 1
          fi
          FILE_OUTPUT=$(file "$MUSL_BINARY")
          echo "File output: $FILE_OUTPUT"
          if echo "$FILE_OUTPUT" | grep -q "dynamically linked"; then
            echo "✓ musl binary is dynamically linked (supports dlopen)"
          else
            echo "✗ musl binary is statically linked (cannot dlopen PKCS#11 modules)"
            exit 1
          fi

      - name: Smoke test musl binary in Alpine
        run: |
          set -euo pipefail
          MUSL_BINARY="dist/server-linux-musl-build_linux_amd64_v1/ssoosshd"
          docker run --rm -v "$(pwd)/$MUSL_BINARY:/ssoosshd:ro" alpine:latest /ssoosshd --version || { echo "✗ musl binary failed to run in Alpine container"; exit 1; }
          echo "✓ musl binary runs in Alpine container"

      - name: remove the release, we failed
        if: startsWith(github.ref, 'refs/tags/') && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete -y ${TAG}

  # Builds the operator-facing Docker Compose deployment's image (see
  # Dockerfile, deploy/docker-compose.yml, docs/operations/deployment.md) and pushes it
  # to ghcr.io/mnestor/ssoosshd so an admin running the compose file never
  # builds the project themselves -- `docker compose up` just pulls. Only
  # the server ships as an image; the client and pam_ssoossh stay
  # .deb/.rpm/.zip via goreleaser above, since they run on the machine doing
  # the sshing/sudoing, not in a container.
  #
  # Built on every PR too (catches a broken Dockerfile before merge), but
  # only pushed, and only tagged, on an actual v* release tag -- deliberately
  # no `latest` and no branch/sha tags. A floating `latest` means an
  # operator's `docker compose pull` silently changes what's running on
  # restart; every image this pushes is meant to be pinned by version
  # instead (see deploy/docker-compose.yml's SSOOSSHD_VERSION). This mirrors
  # how goreleaser above treats a tag push as the real release and
  # everything else as a snapshot that publishes nothing.
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated behind build-most so a tag push never publishes an image for a
    # release whose goreleaser half failed and was deleted.
    needs: [changes, build-most]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only type=semver rules: on anything but a v* tag push these match
      # nothing and meta.outputs.tags comes back empty, which is fine below
      # since push is false whenever that's the case.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mnestor/ssoosshd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
