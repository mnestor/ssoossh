name: build

# The release pipeline, plus the cheap check that stands in for it on PRs.
#
# On a v* tag push this builds the real release, and goreleaser builds all
# of it in one run: archives, packages, the macOS installers, the checksums
# covering them, and the ssoosshd images under both their sha and their
# version tags. Nothing arrives after goreleaser any more -- the .pkg
# installers are built, signed and notarized by a macos-build post-hook
# inside that same run, which is what used to need a macOS runner of its own
# and a hand-written pass over the checksums file.
#
# It is written as a draft all the same, because one question is still open
# when goreleaser finishes: whether a Mac accepts the installers. macos-verify
# asks it, then flips the draft, or deletes it. Nothing is visible under a
# name anyone would look for until that job says so, and that is the point:
# a draft can be deleted in silence, while a published release has already
# emailed every watcher. PRs no longer run that
# pipeline: they run `build-check`, which does the generated-artifact
# staleness checks and a single-target snapshot build, with no release
# secrets on the runner. The weekly run is what still exercises the full
# multi-platform signed pipeline against upstream drift (new goreleaser,
# new base images), which is the job the PR dry-run was really doing and
# was paying for on every push to do it.
on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
  schedule:
    # The only run that exercises the full signed multi-platform pipeline
    # outside an actual release. Kept while the other weekly duplicates
    # were dropped, because this one is not a duplicate of anything a PR
    # does.
    - cron: "0 4 * * 1" # 04:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: on PRs, skip the expensive build jobs when nothing that
  # feeds the release changed. Implemented as a filter job rather than
  # `on.pull_request.paths` so a required check still reports (as skipped,
  # which satisfies branch protection) instead of hanging in "expected".
  # On non-PR events the filter step is skipped and the fallback in the
  # output expression makes everything run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - 'Dockerfile'
              - 'packaging/**'
              - '.goreleaser*.yml'
              - 'docs/openapi.yaml'
              - 'tygo.yaml'
              - '.redoclyrc.yaml'
              - '.github/workflows/build.yaml'

  # What a PR gets instead of the release pipeline: the checks that catch a
  # committed artifact going stale, plus proof that the tree still builds
  # through goreleaser. One target (linux/amd64) rather than four platforms,
  # and no 1Password/GPG/notarization secrets -- a PR branch does not need
  # the signing key to prove the config parses.
  build-check:
    name: build check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      - name: Lint OpenAPI spec
        run: make openapi-lint

      # Man pages are generated from the cobra commands; same staleness
      # trap as the two above.
      - name: Check generated man pages are current
        run: make man-check

      # The docs site's configuration reference comes from the config
      # structs and its CLI reference from the cobra commands. Catches a
      # key or a flag changing without the site following.
      - name: Check generated docs site pages are current
        run: make confdocs-check clidocs-check

      # The server binary embeds server/frontend/dist.
      - name: Build web UI
        run: make frontend

      - name: Snapshot build (linux/amd64)
        run: |
          git config --global --add safe.directory "$(pwd)"
          goreleaser build --single-target --snapshot --clean -f .goreleaser.yml
        env:
          GOOS: linux
          GOARCH: amd64

  build-most:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      # goreleaser creates the release and uploads assets on tag pushes.
      contents: write
      # goreleaser's dockers_v2 pipe pushes ghcr.io/mnestor/ssoossh-server on tag
      # pushes (see .goreleaser.yml) -- under its commit-sha tag only; the
      # version tags are the publish job's.
      packages: write
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Catches a Go wire type changing without the frontend's generated
      # TypeScript being regenerated. The golden test in server/webtypes
      # catches the same drift against docs/openapi.yaml and the goldens
      # themselves; this half is what keeps the browser's types honest.
      - name: Check generated frontend types are current
        run: make types-check

      # docs/openapi.yaml is generated from the swag annotations on the
      # handlers. Catches a route or response shape changing without the
      # spec following.
      - name: Check generated OpenAPI spec is current
        run: make openapi-check

      # Validate the OpenAPI spec against the OpenAPI 3.1 specification.
      - name: Lint OpenAPI spec
        run: make openapi-lint

      # Man pages are generated from the cobra commands. A stale page must
      # not ship in a release archive.
      - name: Check generated man pages are current
        run: make man-check

      # The docs site's generated reference pages, for the same reason.
      - name: Check generated docs site pages are current
        run: make confdocs-check clidocs-check

      # Must run before goreleaser: the server binary embeds
      # server/frontend/dist, and only a placeholder index.html is tracked.
      # Skipping this would ship a release with no web UI.
      - name: Build web UI
        run: make frontend

      # Also before goreleaser, which attaches the result as a release asset
      # (.goreleaser.yml's release.extra_files). An explicit step rather than
      # a goreleaser before-hook for the same reason the web UI is one: a
      # hook would make every local snapshot build produce it too.
      #
      # The script refuses to build a bundle whose manifest is stale, so a
      # release cannot ship fixtures that disagree with the version
      # github.com/mnestor/ssoossh-pam pins against them.
      - name: Build the wire-contract bundle
        run: make wire-contract-bundle

      # zig cross-links the pkcs11 build against glibc 2.28 so the floor is
      # pinned from a newer builder. The default build needs no zig at all
      # (CGO_ENABLED=0), so this only serves server-linux-pkcs11-build.
      # Keep in sync with ZIG_VERSION in .github/docker/Dockerfile.runner.
      # The tarball name changed shape in 0.15 (zig-x86_64-linux-, not
      # zig-linux-x86_64-).
      - name: Set up Zig
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          mkdir -p /tmp/zig
          cd /tmp/zig
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "/tmp/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # goreleaser's dockers_v2 pipe shells out to `docker buildx build
      # --platform linux/amd64,linux/arm64 ... --push` as one call per
      # image (see .goreleaser.yml) -- that needs a docker-container
      # buildx builder already active, which is what this action's default
      # driver sets up; the plain docker driver cannot push a multi-arch
      # manifest at all. docker itself is on PATH via
      # .github/docker/Dockerfile.runner; the daemon is the host's, reached
      # over the /var/run/docker.sock GitHub-hosted runners mount into a
      # container: job automatically.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Tag pushes only, matching every other publish step below -- a
      # snapshot build never reaches goreleaser's publish phase (it skips
      # publishing automatically in --snapshot mode), so logging in here
      # would be dead weight on every other push.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GPG_PASSPHRASE: "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/password"
          QUILL_NOTARY_ISSUER: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_ISSUER
          QUILL_NOTARY_KEY: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY
          QUILL_NOTARY_KEY_ID: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY_ID
          QUILL_SIGN_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_P12
          QUILL_SIGN_PASSWORD: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_PASSWORD

      - name: Save gpg key
        run: |
          op read "op://Github Actions/ifx7xxoazokhouv2z2cstg7f7a/private.pgp" > "${GITHUB_WORKSPACE}/private.pgp"
          git config --global --add safe.directory "$(pwd)"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Latest stable v2 release, not nightly: releases should not
          # depend on an unreleased goreleaser build.
          version: "~> v2"
          args: release --clean -f .goreleaser.yml --snapshot=${{ !startsWith(github.ref, 'refs/tags/') }} ${{ vars.DEBUG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NFPM_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          QUILL_NOTARY_ISSUER: ${{ steps.secrets.outputs.QUILL_NOTARY_ISSUER }}
          QUILL_NOTARY_KEY: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          QUILL_SIGN_P12: ${{ steps.secrets.outputs.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ steps.secrets.outputs.QUILL_SIGN_PASSWORD }}

      - name: Verify glibc floor (GNU build)
        run: |
          set -euo pipefail
          GLIBC_MAX=$(objdump -T dist/server-linux-build_linux_amd64_v1/ssoosshd 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "Maximum GLIBC version in ssoosshd: $GLIBC_MAX"
          if [ "$GLIBC_MAX" = "GLIBC_2.28" ]; then
            echo "✓ glibc floor is 2.28 (expected)"
          elif [ -z "$GLIBC_MAX" ]; then
            echo "✗ Could not determine GLIBC version (static binary?)"
            exit 1
          else
            echo "✗ GLIBC version $GLIBC_MAX is newer than 2.28 floor"
            exit 1
          fi

      # The two server builds must differ in exactly this way, and a
      # regression in either direction is silent otherwise. If the default
      # build ever picks up cgo it stops being portable and needs a libc
      # floor nobody declared; if the pkcs11 build ever loses it, PKCS#11
      # support is dead on arrival and looks identical from here.
      #
      # Both arches, not just amd64: a toolchain change affects arm64 too.
      - name: Verify the default build is static and the pkcs11 build is not
        run: |
          set -euo pipefail
          check() {
            pattern="$1"; want="$2"; label="$3"
            found=0
            for BINARY in $pattern; do
              [ -f "$BINARY" ] || continue
              found=$((found + 1))
              FILE_OUTPUT=$(file "$BINARY")
              echo "File output: $FILE_OUTPUT"
              if echo "$FILE_OUTPUT" | grep -q "$want"; then
                echo "✓ $BINARY is $label"
              else
                echo "✗ $BINARY is not $label"
                exit 1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "✗ no binaries matched $pattern"
              exit 1
            fi
          }
          check 'dist/server-linux-build_linux_*/ssoosshd' \
                'statically linked' 'statically linked (no libc floor)'
          check 'dist/server-linux-pkcs11-build_linux_*/ssoosshd' \
                'dynamically linked' 'dynamically linked (can dlopen a PKCS#11 module)'

      # Linking is checked above; this catches a binary that links but
      # cannot start. The default build needs no loader at all, so it runs
      # here directly.
      - name: Smoke test the static binary
        run: |
          set -euo pipefail
          BINARY="dist/server-linux-build_linux_amd64_v1/ssoosshd"
          "$BINARY" version || { echo "✗ static binary failed to run"; exit 1; }
          echo "✓ static binary runs with no dynamic loader"

      # The installers goreleaser just built, for the macOS job to assess.
      # goreleaser has already attached them to the draft release itself
      # (release.extra_files) and hashed them into the checksums file
      # (checksum.extra_files), so this artifact exists only so that a Mac
      # can be asked about them before publish makes the release visible.
      #
      # Uploaded on every event build-most runs, not only on tags: nothing
      # is published in --snapshot mode, so a verification job fed from the
      # release would only ever run during an actual release, and the weekly
      # run exists precisely so the signed path is exercised before then.
      - name: Upload the macOS client packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-client-packages
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7

      # Consumed by windows-verify, which installs it on a real Windows
      # host. Uploaded on every event build-most runs, not only on tags,
      # for the same reason as the macOS packages above.
      - name: Upload the Windows client installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-client-installer
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: cleanup
        if: always()
        run: |
          rm -f private.pgp || true

      - name: remove the release, we failed
        if: startsWith(github.ref, 'refs/tags/') && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete -y "$TAG"

  # Gatekeeper's opinion, which is the one thing Linux cannot produce.
  #
  # The installers themselves are built in build-most now. A flat package is
  # a xar archive with a fixed layout, and packaging/macos/flatpkg.sh writes
  # every part of it with open tools (bomutils for the BOM, bsdcpio for the
  # payload, xar for the archive) and signs, notarizes and staples it with
  # rcodesign, all inside the release container. That is why there is no
  # longer a macOS job holding signing secrets, downloading darwin archives,
  # or re-uploading anything to the release: goreleaser owns the packages
  # the way it owns every other artifact, checksums included.
  #
  # What is left is verification, and it is not optional. The package is
  # assembled by tools Apple did not write, so until this job runs nothing
  # has asked macOS whether it accepts the result. It holds no secrets, and
  # publish waits on it.
  macos-verify:
    name: macos verify installers
    needs: [changes, build-most]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      # gh release delete, on tag pushes only, when a Mac rejects what
      # goreleaser already published.
      contents: write
    # Pinned like every other version in this pipeline. Nothing is compiled
    # and nothing is signed here, so this is not an SDK choice: the newest
    # image is simply the one whose spctl, pkgutil and installer are the
    # ones Apple is currently changing, and the weekly run exists to meet
    # those changes before a release does.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-client-packages
          path: dist

      # Both architectures must be here. A glob that matched one package
      # because the other never got built would otherwise ship a release
      # with half its installers and no failure anywhere.
      - name: Both architectures were packaged
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            ls dist/ssoossh-client_*_darwin_"$arch".pkg >/dev/null
          done

      # The signature, the stapled ticket, and what Gatekeeper will say when
      # someone double-clicks it. spctl is the assertion that matters: it is
      # the same check that runs on the user's Mac.
      - name: Gatekeeper accepts the packages
        run: |
          set -euo pipefail
          for pkg in dist/*.pkg; do
            echo "== $pkg"
            pkgutil --check-signature "$pkg"
            spctl --assess --type install --verbose=2 "$pkg"
          done

      # The BOM bomutils wrote, against the one pkgbuild writes from the very
      # same payload. This is the check that catches an open-source BOM
      # drifting from Apple's: every other step here would still pass with a
      # subtly wrong file list, wrong modes or wrong ownership.
      #
      # Paths, modes, uid and gid only. Size and checksum are the same files
      # either way, and mtime differs for reasons that mean nothing.
      - name: The BOM matches what pkgbuild would have written
        run: |
          set -euo pipefail
          for pkg in dist/*.pkg; do
            rm -rf exp ref refexp ref.pkg
            pkgutil --expand-full "$pkg" exp
            ver=$(sed -n 's/.*<pkg-info[^>]* version="\([^"]*\)".*/\1/p' \
              exp/component.pkg/PackageInfo | head -1)
            pkgbuild --quiet --root exp/component.pkg/Payload \
              --identifier org.mikenestor.ssoossh-client --version "$ver" \
              --install-location / --ownership recommended ref.pkg
            pkgutil --expand-full ref.pkg refexp
            diff <(lsbom -p fmUG refexp/*.pkg/Bom | sort) \
                 <(lsbom -p fmUG exp/component.pkg/Bom | sort)
            echo "✓ $pkg: BOM matches pkgbuild"
          done

      # The Distribution, parsed. flatpkg.sh packs this file verbatim rather
      # than having productbuild rewrite it, and an ill formed one is not a
      # cosmetic fault: Apple's notary service parses it to find the
      # component packages, finds none, and reports that as a payload
      # problem ("the contents of the package could not be extracted",
      # "has no signed executables or bundles"). flatpkg.sh checks this
      # before packing; this is the same check on the shipped artifact.
      - name: The Distribution is well formed XML
        run: |
          set -euo pipefail
          for pkg in dist/*.pkg; do
            rm -rf dist-toc && mkdir dist-toc
            (cd dist-toc && xar -xf "../$pkg" Distribution)
            python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" \
              dist-toc/Distribution
            echo "✓ $pkg: Distribution parses"
          done

      # It installs, the binary runs, the version it reports is this build's,
      # and the man pages landed. The runner is Apple silicon, so this is the
      # arm64 package.
      - name: The arm64 package installs and runs
        run: |
          set -euo pipefail
          sudo installer -pkg dist/ssoossh-client_*_darwin_arm64.pkg -target /
          /usr/local/bin/ssoossh version
          test -f /usr/local/share/man/man1/ssoossh.1
          test -f /usr/local/share/man/man5/ssoossh.yaml.5
          test -f /usr/local/share/ssoossh/ssoossh.yaml

      # The opposite assertion, and the one that proves hostArchitectures is
      # still doing its job: the Intel package must decline on this host
      # rather than install a binary that cannot exec.
      - name: The amd64 package is refused on Apple silicon
        run: |
          set -euo pipefail
          if sudo installer -pkg dist/ssoossh-client_*_darwin_amd64.pkg \
               -target / 2>err.log; then
            echo "✗ the amd64 package installed on an arm64 host;" \
                 "hostArchitectures is not being honored" >&2
            exit 1
          fi
          echo "✓ refused, as hostArchitectures asks:"
          sed 's/^/  /' err.log

      # The invariant this job exists to hold: nothing public is anything a
      # Mac has not accepted. Deleting an unpublished draft costs nothing and
      # tells nobody, which is exactly why the release waits here instead of
      # going out and being revoked -- GitHub emails every watcher the moment
      # a release is published, and that notification cannot be recalled.
      #
      # The images need no cleanup for the same reason: they still carry
      # only their sha tags at this point, and publish promotes them to
      # version tags after this job passes. A sha tag is immutable, names
      # the commit that built it, and never claimed to be a release.
      - name: remove the draft, a Mac rejected it
        if: startsWith(github.ref, 'refs/tags/') && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete -y "$TAG"

  # The Windows counterpart to macos-verify, and it exists for the same
  # reason. packaging/windows/msi.sh builds the package with wixl, which
  # Microsoft did not write, so until this job runs nothing has asked
  # Windows whether it accepts the result. It holds no secrets, and publish
  # waits on it.
  #
  # What it covers that reading ssoossh.wxs cannot: that the package
  # installs and uninstalls with no UI and no reboot. That is the only mode
  # Group Policy software installation, Intune and Configuration Manager
  # ever use, so it is the mode that has to work.
  #
  # The package is unsigned today, so there is no signature to verify here
  # yet. When Azure Artifact Signing lands (docs/proposals/enhancements.md)
  # this job gains one step: Get-AuthenticodeSignature on both the MSI and
  # the installed exe, asserting Valid.
  windows-verify:
    name: windows verify installer
    needs: [changes, build-most]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      # gh release delete, on tag pushes only, when Windows rejects what
      # goreleaser already built.
      contents: write
    # Pinned, not windows-latest as client-matrix.yaml uses: a verification
    # job should name the OS it verified against, so a failure is
    # attributable to a version and a runner image rollover is a deliberate
    # bump here rather than a surprise in the middle of a release.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # No checkout. Everything this job reads comes out of the artifact,
      # and gh gets its repository from GH_REPO in the one step that needs
      # it rather than from a working copy cloned for that alone.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-client-installer
          path: dist

      # One package, and it is the amd64 one. wixl cannot target arm64
      # (packaging/windows/msi.sh), so a second file here means that
      # changed, and everything below -- which installs one package on an
      # x64 runner -- would then be testing half of what ships.
      - name: Exactly one installer, and it is amd64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem dist -Filter *.msi)
          if ($msi.Count -ne 1) {
            throw "expected exactly one .msi in dist, found $($msi.Count)"
          }
          # [regex]::Match rather than -notmatch, so the captured version
          # comes from an object this code owns. $Matches after a -notmatch
          # is a side effect, and one that reads as a bug the next time
          # someone edits the condition.
          $m = [regex]::Match($msi[0].Name,
            '^ssoossh-client_(.+)_windows_amd64\.msi$')
          if (-not $m.Success) {
            throw "unexpected installer name: $($msi[0].Name)"
          }
          $version = $m.Groups[1].Value
          "MSI=$($msi[0].FullName)" | Out-File $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          Write-Host "OK $($msi[0].Name) (version $version)"

      # The package describes itself the way ssoossh.wxs says it should,
      # read out of the MSI database before anything is installed.
      #
      # UpgradeCode is asserted against a literal deliberately. It is the
      # one identifier that must never change for the life of the product:
      # regenerate it and every already-installed copy stops being
      # recognised as an earlier version of this one, so upgrades silently
      # become side-by-side installs. A test is the only thing that catches
      # that, because nothing about the resulting package looks wrong.
      #
      # ALLUSERS=1 is the per-machine scope every managed deployment path
      # depends on. A package that quietly became per-user would still
      # install by hand and still fail through GPO and Intune.
      - name: The package declares what it should
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($env:MSI, 0))

          function Get-MsiProperty($db, $name) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db,
              @("SELECT Value FROM Property WHERE Property = '$name'"))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) { return $null }
            $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
          }

          # ProductVersion is the release version with any pre-release
          # suffix dropped, because MSI has no field for one. msi.sh does
          # that reduction; this repeats it and compares.
          $want = ($env:VERSION -split '-')[0]
          $got = Get-MsiProperty $db 'ProductVersion'
          if ($got -ne $want) {
            throw "ProductVersion is '$got', expected '$want' (from $env:VERSION)"
          }

          $allusers = Get-MsiProperty $db 'ALLUSERS'
          if ($allusers -ne '1') {
            throw "ALLUSERS is '$allusers', expected '1' -- the package is not per-machine"
          }

          $upgrade = Get-MsiProperty $db 'UpgradeCode'
          if ($upgrade -ne '{3b8f0af1-b88c-4d02-8f00-f6bed4a4d80c}') {
            throw "UpgradeCode changed to '$upgrade'; every installed copy stops upgrading"
          }

          Write-Host "OK ProductVersion $got, ALLUSERS $allusers, UpgradeCode $upgrade"

      # /qn is the whole point: no dialogs, no reboot, an exit code. The
      # verbose log is kept and tailed on failure, because a non-zero
      # msiexec exit code on its own says almost nothing.
      - name: It installs silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Tail 80
            throw "msiexec /i exited $($p.ExitCode)"
          }
          Write-Host "OK installed"

      # What the package promised the administrator, checked on the machine
      # rather than in the database: the binary is where the docs say, it
      # runs, it is this build, the machine PATH can find it, the reference
      # files are beside it, and %ProgramData%\ssoossh exists.
      #
      # That last one is the security-relevant assertion, not housekeeping.
      # client/config/paths.go relies on the installer creating that
      # directory: ProgramData's default ACLs let any user create a
      # subdirectory and own it, so if the package ever stops creating it a
      # non-administrator can create it first and own the file that is
      # supposed to constrain them. The owner is logged rather than
      # asserted -- CI installs as an administrator, so the value here is
      # not the one a fleet deployment produces -- but its existence is not
      # negotiable.
      - name: What it installed is right
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:ProgramFiles 'ssoossh'
          $exe = Join-Path $dir 'ssoossh.exe'

          foreach ($f in @('ssoossh.exe', 'LICENSE', 'NOTICE',
                           'THIRD-PARTY-LICENSES.md', 'defaults.yaml')) {
            $path = Join-Path $dir $f
            if (-not (Test-Path -LiteralPath $path)) { throw "missing: $path" }
          }

          # Out-String, so a command that grew a second line of output is
          # compared as one string rather than filtered as an array, which
          # is what -notmatch would silently do instead.
          $out = (& $exe version | Out-String).Trim()
          if ($out -notmatch "^ssoossh $([regex]::Escape($env:VERSION)) ") {
            throw "'ssoossh version' printed '$out', expected version $env:VERSION"
          }

          $machinePath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          if (($machinePath -split ';') -notcontains $dir) {
            throw "the machine PATH does not contain '$dir'"
          }

          $data = Join-Path $env:ProgramData 'ssoossh'
          if (-not (Test-Path -LiteralPath $data)) {
            throw "the installer did not create '$data'"
          }
          Write-Host "OK $out"
          Write-Host "OK machine PATH carries $dir"
          Write-Host "OK $data exists, owner $((Get-Acl $data).Owner)"

      # Uninstall has to be as clean as install, and it has to leave one
      # thing behind. %ProgramData%\ssoossh holds an administrator's
      # enforced configuration, and a major upgrade is a remove followed by
      # an install, so a package that removed that directory would discard
      # the fleet's policy on every version bump. ssoossh.wxs omits
      # RemoveFolder for exactly this reason; here is where that stays true.
      - name: It uninstalls, and leaves the enforced config behind
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/x', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', 'uninstall.log')
          if ($p.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 80
            throw "msiexec /x exited $($p.ExitCode)"
          }

          $dir = Join-Path $env:ProgramFiles 'ssoossh'
          if (Test-Path -LiteralPath (Join-Path $dir 'ssoossh.exe')) {
            throw "ssoossh.exe survived the uninstall in '$dir'"
          }

          $machinePath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          if (($machinePath -split ';') -contains $dir) {
            throw "the machine PATH still contains '$dir' after uninstall"
          }

          $data = Join-Path $env:ProgramData 'ssoossh'
          if (-not (Test-Path -LiteralPath $data)) {
            throw "uninstall removed '$data'; an upgrade would discard the enforced config"
          }
          Write-Host "OK uninstalled, $data left in place"

      # Same invariant macos-verify holds, for the same reason: nothing
      # public is anything Windows has not accepted. Deleting an
      # unpublished draft tells nobody; publishing a release emails every
      # watcher and cannot be recalled.
      - name: remove the draft, Windows rejected it
        if: startsWith(github.ref, 'refs/tags/') && failure()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release delete -y "$env:TAG"

  # Where a release becomes visible, and the only job that makes anything
  # public under a name someone would go looking for. Everything before it
  # published to names nobody pulls: goreleaser wrote the release as a
  # draft (.goreleaser.yml's release.draft) and tagged the images with the
  # commit sha (its dockers_v2 tags), and macos-verify and windows-verify
  # confirmed on a real Mac and a real Windows host that the installers
  # goreleaser built are ones those systems accept. This flips both at the
  # end, once every artifact for every platform is in place and checked.
  #
  # Both halves wait, deliberately. Publishing the release emails every
  # watcher and cannot be undone; a version tag on a public image is pulled
  # by anything tracking it. Neither is worth doing while an installer is
  # still unverified, and the cost of waiting is one job.
  #
  # Tag pushes only -- there is nothing to publish on the weekly run, which
  # is exactly why that run rehearses everything except this job.
  #
  # No container and no build tooling: two registry calls and one API call.
  # docker with the buildx plugin and gh are both on the stock runner
  # image, so this does not pay for the ssoossh-build pull either.
  publish:
    name: publish
    needs: [build-most, macos-verify, windows-verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release edit.
      contents: write
      # The version tags created below.
      packages: write
    # This job checks nothing out on purpose, so gh has no remote to read
    # the repository from and every call would die on "fatal: not a
    # repository". GH_REPO names it instead, for the whole job.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` copies the manifest list registry-side, by
      # digest: the multi-arch index and the labels goreleaser baked in at
      # build time carry over untouched and no layer moves, so this costs
      # about a second per tag. It is a registry operation rather than a
      # build, so unlike build-most this job needs no buildx builder and
      # no setup-buildx-action.
      #
      # The version goreleaser tags with is the git tag without its v
      # (.Version in its templates, and the value already in each image's
      # org.opencontainers.image.version label), which is what these have
      # to match.
      #
      # Every piece of the version gets a tag: v1.2.4 publishes 1.2.4, 1.2
      # and 1, and the -pkcs11 variant of each. The exact version is the one
      # an operator pins; the two floating tags are for the operator who
      # wants patch, or minor and patch, to arrive without a change here.
      #
      # `latest` is not one of them and is not going to become one. Every
      # tag here names some part of a version, so whatever an operator
      # pins, they have said how far they are willing to be moved.
      # `latest` is the one tag that says nothing, and the distance it
      # would move someone is unbounded.
      #
      # Two calls because the two variants come from two different source
      # images, but each is one call for all three of its tags -- so a
      # failure between them leaves the -pkcs11 series a version behind and
      # never a half-tagged variant. The re-run of the tag fixes it; that
      # is the narrow case this ordering does not cover.
      - name: Promote the images to their version tags
        env:
          IMAGE: ghcr.io/mnestor/ssoossh-server
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags=("$version")

          # The floating tags are for final releases only. goreleaser's
          # release.prerelease is auto, so v1.3.0-rc1 is a release like any
          # other here -- and `1.3` resolving to a release candidate is
          # exactly what someone tracking `1.3` is trusting will not happen.
          if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            major="${version%%.*}"
            series="${version%.*}"

            # And only when this tag is the newest in the series, so that
            # re-running an old tag cannot walk a floating tag backwards
            # onto an older image. Git tags rather than releases: the
            # release this run is about to publish is still a draft, so it
            # would not be in a release listing, and a tag whose release
            # failed is still a version this one must not claim to be
            # newer than.
            shipped=$(gh api --paginate \
              "/repos/$REPO/git/matching-refs/tags/v${major}." \
              --jq '.[].ref | sub("^refs/tags/v"; "")' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            esc="${series//./\\.}"
            newest_major=$(printf '%s\n' "$shipped" | tail -1)
            newest_series=$(printf '%s\n' "$shipped" \
              | grep -E "^${esc}\.[0-9]+$" | tail -1)

            if [ "$newest_series" = "$version" ]; then
              tags+=("$series")
            else
              echo "$TAG trails v${newest_series}; $series stays put"
            fi
            if [ "$newest_major" = "$version" ]; then
              tags+=("$major")
            else
              echo "$TAG trails v${newest_major}; $major stays put"
            fi
          fi

          echo "tagging: ${tags[*]}"
          for variant in "" "-pkcs11"; do
            args=()
            for tag in "${tags[@]}"; do
              args+=(-t "${IMAGE}:${tag}${variant}")
            done
            docker buildx imagetools create "${args[@]}" \
              "${IMAGE}:sha-${COMMIT}${variant}"
            docker buildx imagetools inspect "${IMAGE}:${version}${variant}"
          done

      # Last, so a failure in the promote above leaves the release a draft
      # rather than a published release whose images are half-named.
      #
      # Only draft is touched. Whether the release is a prerelease, and
      # whether it becomes /releases/latest, remain goreleaser's call
      # (.goreleaser.yml's release.prerelease: auto).
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

      # Same invariant the build jobs keep. The sha tags are left alone on
      # purpose: they are immutable, they name the commit that built them,
      # and they never claimed to be a release -- so nothing in this
      # pipeline ever needs a credential that can delete a package version.
      - name: remove the release, we failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete -y "$TAG"
