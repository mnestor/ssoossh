name: lint

# Static analysis for the three things that are not tests: Go, the frontend,
# and the workflow files themselves. Every job here is a merge gate.
#
# No path gate beyond the image-only skip: each job here costs about as much
# as a gate would, so the gate was pure overhead. A PR that changes only the
# CI image skips these jobs (they report as skipped) because the image is
# checked by build-image.yaml instead; see the changes job.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Image-only gate: a PR whose every changed file is under .github/docker/
  # or is build-image.yaml skips the rest of CI. In some-with-excludes mode
  # `other` matches a file under '**' and none of the negations; the positive
  # '**' is needed, since a filter made only of negations never matches.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image == 'true' && 'true' || 'false' }}
      image_only: ${{ steps.filter.outputs.image == 'true' && steps.filter.outputs.other != 'true' && 'true' || 'false' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            image:
              - '.github/docker/**'
              - '.github/workflows/build-image.yaml'
            other:
              - '**'
              - '!.github/docker/**'
              - '!.github/workflows/build-image.yaml'

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.image_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No tracked file may match an ignore rule, and no source file may be
      # ignored. Runs first because the failure it catches -- a source file
      # missing from a clean checkout -- otherwise surfaces as an unrelated
      # build or import error somewhere else entirely.
      - name: check .gitignore invariants
        run: scripts/check-gitignore.sh

      # The image this job runs in has to be new enough for go.mod, and
      # nothing else here would notice if it were not: GOTOOLCHAIN=auto
      # quietly downloads a newer toolchain for every ordinary Go step. The
      # binaries baked into the image cannot do that, so a stale image turns
      # govulncheck into a wall of "requires newer Go version" -- and because
      # that scan is advisory, it reported the errors as a clean result for
      # as long as the drift lasted. Blocking here is what makes the next
      # go.mod bump fail loudly instead.
      - name: check Go version invariants
        run: scripts/check-go-version.sh

      # No frontend build needed: golangci-lint typechecks server/frontend,
      # which embeds dist/ via `//go:embed all:dist/*`, and the tracked
      # dist/.gitignore is what makes that pattern match. (A `go generate`
      # step used to sit here claiming to create a placeholder; the repo has
      # no //go:generate directives, so it never did anything.)
      #
      # A finding fails the job: this is a merge gate, not advisory.
      # golangci-lint comes from the build image (see
      # .github/docker/Dockerfile.runner, GOLANGCI_LINT_VERSION) rather than
      # from an action that downloads it per run. The version lives in one
      # place that way, and it is the same binary a developer running
      # `make lint` locally gets.
      - name: golangci-lint
        run: make lint

      # The Windows and macOS builds, which the step above cannot see: it
      # runs with the runner's GOOS, so every file behind a `windows` or
      # `darwin` constraint is invisible to it. That is how a G115
      # integer-overflow bug sat unreported in policy_windows.go, on a value
      # an administrator sets through Group Policy. No Windows or macOS
      # runner is involved -- golangci-lint typechecks a cross build, so this
      # is two more invocations on this same ubuntu container.
      - name: golangci-lint (windows, macos)
        run: make lint-cross

  frontend:
    needs: changes
    if: needs.changes.outputs.image_only != 'true'
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      # prettier --check plus eslint.
      - name: pnpm lint
        run: pnpm lint

      # svelte-check against tsconfig.json. This is the only thing that
      # typechecks hand-written Svelte and TypeScript: `make types-check`
      # only proves the *generated* wire types match the Go source, and
      # `pnpm build` does not typecheck.
      - name: pnpm check
        run: pnpm check

  workflows:
    needs: changes
    if: needs.changes.outputs.image_only != 'true'
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches expression typos, bad `needs:` references, and steps that
      # point at things which do not exist -- the class of error that is
      # otherwise only found by pushing and waiting.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
