name: lint

# Static analysis for the three things that are not tests: Go, the frontend,
# and the workflow files themselves. Every job here is a merge gate.
#
# No `changes` path gate: each job here costs about as much as the gate job
# that would guard it, so the gate was pure overhead. The expensive
# workflows (build, e2e, client-matrix) keep theirs.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No tracked file may match an ignore rule, and no source file may be
      # ignored. Runs first because the failure it catches -- a source file
      # missing from a clean checkout -- otherwise surfaces as an unrelated
      # build or import error somewhere else entirely.
      - name: check .gitignore invariants
        run: scripts/check-gitignore.sh

      # No frontend build needed: golangci-lint typechecks server/frontend,
      # which embeds dist/ via `//go:embed all:dist/*`, and the tracked
      # dist/.gitignore is what makes that pattern match. (A `go generate`
      # step used to sit here claiming to create a placeholder; the repo has
      # no //go:generate directives, so it never did anything.)
      #
      # A finding fails the job: this is a merge gate, not advisory.
      # golangci-lint comes from the build image (see
      # .github/docker/Dockerfile.runner, GOLANGCI_LINT_VERSION) rather than
      # from an action that downloads it per run. The version lives in one
      # place that way, and it is the same binary a developer running
      # `make lint` locally gets.
      - name: golangci-lint
        run: make lint

      # pam_ssoossh needs its own pass: without the pam build tag and cgo,
      # golangci-lint cannot see those files at all and silently skips them
      # (see the Makefile's lint-fix comment). This ran only in the
      # Makefile's ci-required target, which no workflow invoked, so the
      # package was linted on developer machines and nowhere else.
      - name: golangci-lint (pam)
        run: make lint-pam

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      # prettier --check plus eslint.
      - name: pnpm lint
        run: pnpm lint

      # svelte-check against tsconfig.json. This is the only thing that
      # typechecks hand-written Svelte and TypeScript: `make types-check`
      # only proves the *generated* wire types match the Go source, and
      # `pnpm build` does not typecheck.
      - name: pnpm check
        run: pnpm check

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches expression typos, bad `needs:` references, and steps that
      # point at things which do not exist -- the class of error that is
      # otherwise only found by pushing and waiting.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
