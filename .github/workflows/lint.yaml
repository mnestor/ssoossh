name: lint
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: lint
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        id: golangcilint
        continue-on-error: true
        # Must stay v2.x: .golangci.yml is a `version: "2"` config, which
        # golangci-lint v1 cannot parse at all. Action v7+ is what supports
        # the v2 line.
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12
      - name: Add golangci-lint results to summary
        if: always()
        run: |
          echo "## golangci-lint Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.golangcilint.outputs.result }}" >> $GITHUB_STEP_SUMMARY
