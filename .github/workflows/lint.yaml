name: lint
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    strategy:
      matrix:
        go: [latest]
        os: [ubuntu-latest] #, macos-latest, windows-latest]
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: golangci-lint
        # Must stay v2.x: .golangci.yml is a `version: "2"` config, which
        # golangci-lint v1 cannot parse at all. Action v7+ is what supports
        # the v2 line.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
