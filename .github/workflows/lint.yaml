name: lint
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: create a dummy file so the frontend/dist isn't empty
        # Fixes:
        # lint: server/frontend/frontend_included.go#L29
        # pattern all:dist/*: no matching files found (typecheck)
        run: |
          go generate ./...
      - name: golangci-lint
        id: golangcilint
        continue-on-error: true
        # Must stay v2.x: .golangci.yml is a `version: "2"` config, which
        # golangci-lint v1 cannot parse at all. Action v7+ is what supports
        # the v2 line.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v8.0.0
        with:
          version: v2.12
      - name: Add golangci-lint results to summary
        if: ${{ !cancelled() }}
        run: |
          echo "## golangci-lint Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.golangcilint.outputs.result }}" >> $GITHUB_STEP_SUMMARY
