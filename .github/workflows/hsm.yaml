name: hsm

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate. An on.pull_request.paths filter would stop the workflow from
  # starting at all, so softhsm would never report and a ruleset that
  # requires it would block every PR that doesn't touch these paths. A
  # skipped job does report, and skipped satisfies a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'server/signer/**'
              - 'server/config/**'
              - 'server/bootstrap/**'
              - 'go.mod'
              - '.github/workflows/hsm.yaml'

  softhsm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc

      - name: Verify SoftHSM2 module installed
        run: test -f /usr/lib/softhsm/libsofthsm2.so || (echo "SoftHSM2 module not found"; exit 1)

      - name: Run HSM key source tests
        run: CGO_ENABLED=1 go test -tags=softhsm ./server/signer/ -run TestHSMKeySource -v

      - name: Check for skipped tests
        run: |
          if grep -q "SKIP" <(CGO_ENABLED=1 go test -tags=softhsm ./server/signer/ -run TestHSMKeySource -v); then
            echo "SoftHSM tests were skipped, indicating missing dependencies or provisioning issues"
            exit 1
          fi
