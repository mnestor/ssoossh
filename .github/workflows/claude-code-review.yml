name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  # Skips the review on a PR that changes only the CI image; see the changes job.
  # Image-only gate: a PR whose every changed file is under .github/docker/
  # or is build-image.yaml skips the rest of CI. In some-with-excludes mode
  # `other` matches a file under '**' and none of the negations; the positive
  # '**' is needed, since a filter made only of negations never matches.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image == 'true' && 'true' || 'false' }}
      image_only: ${{ steps.filter.outputs.image == 'true' && steps.filter.outputs.other != 'true' && 'true' || 'false' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            image:
              - '.github/docker/**'
              - '.github/workflows/build-image.yaml'
            other:
              - '**'
              - '!.github/docker/**'
              - '!.github/workflows/build-image.yaml'

  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    needs: changes
    if: needs.changes.outputs.image_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependabot opens its PRs as a bot, and the action refuses
          # non-human actors unless they are named here. Named explicitly
          # rather than '*' so no other app can drive this workflow.
          allowed_bots: 'dependabot[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

