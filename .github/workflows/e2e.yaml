name: e2e

# The end-to-end merge gate (docs/e2e-testing-plan.md): the only workflow
# that checks the product rather than the parts.
#
# Tiers run as separate jobs so that "a break is reported at the layer it
# happened" -- job name alone tells you tier 1 (wire), tier 2 (browser),
# tier 3 (sshd), or tier 3 (pam) failed. The -run/-skip filters below are
# anchored and mutually exclusive, so every test in ./test/e2e runs in
# exactly one tier: tier 1 used to run the whole unfiltered suite, which
# both duplicated the other tiers and hard-failed on TestSSH because
# tier 1's container never installs sshd (the harness t.Fatals on missing
# prerequisites; it does not skip). Build is cached across tiers. No
# automatic retries (a retried e2e test is a test nobody trusts; flakes get
# quarantined).
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Weekly extended flake detection: the full suite at -count=5. PRs do
    # the day-to-day gating; this is the periodic double check.
    - cron: "0 3 * * 1" # 03:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern. Skipped
  # entirely on the weekly schedule, which cascades through `needs`: only
  # weekly-extended runs then.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/e2e.yaml'

  prepare:
    name: build artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # The Go build cannot compile without it: server/frontend embeds dist/.
      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -buildvcs=false -o bin/ ./cmd/...

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-binaries
          path: |
            bin/
            server/frontend/dist/

  tier-1:
    name: tier 1 (wire)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      # -skip carves out exactly what the other tiers own (anchored, so
      # TestApprove_* stays here while TestApproval_* goes to tier 2).
      - name: Run tier 1 tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        run: |
          go test -buildvcs=false -tags=e2e -count=1 -timeout=5m -skip '^(TestApproval_|TestSSH_|TestPAMStack_)' -json ./test/e2e/... | \
            gotestsum --junitfile=test-results-tier1-${{ matrix.backend }}.xml --raw-command -- cat

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier1-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier1-${{ matrix.backend }}
          path: test-results-tier1-${{ matrix.backend }}.xml
          retention-days: 7

  tier-2:
    name: tier 2 (browser)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      - name: Run tier 2 tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        run: |
          go test -buildvcs=false -tags=e2e -count=1 -timeout=10m -run '^TestApproval_' -json ./test/e2e/... | \
            gotestsum --junitfile=test-results-tier2-${{ matrix.backend }}.xml --raw-command -- cat

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier2-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier2-${{ matrix.backend }}
          path: test-results-tier2-${{ matrix.backend }}.xml
          retention-days: 7

  tier-3:
    name: tier 3 (sshd)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      - name: Ensure sshd is available
        run: |
          apt-get update && apt-get install -y --no-install-recommends openssh-server
          # On a real host this directory is created by a systemd tmpfiles
          # rule at boot; this container never boots an init system, so sshd
          # fails with "Missing privilege separation directory" without it.
          mkdir -p /run/sshd

      - name: Run tier 3 tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        run: |
          go test -buildvcs=false -tags=e2e -count=1 -timeout=10m -run '^TestSSH_' -json ./test/e2e/... | \
            gotestsum --junitfile=test-results-tier3-${{ matrix.backend }}.xml --raw-command -- cat

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier3-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier3-${{ matrix.backend }}
          path: test-results-tier3-${{ matrix.backend }}.xml
          retention-days: 7

  tier-3-pam:
    name: tier 3 (pam)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      # The test builds pam_ssoossh.so (cgo, needs libpam headers) and
      # compiles pamtest.c itself; it only needs the toolchain present.
      - name: Ensure PAM build tools are available
        run: apt-get update && apt-get install -y --no-install-recommends gcc libpam0g-dev

      - name: Run tier 3 PAM tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        run: |
          go test -buildvcs=false -tags=e2e -count=1 -timeout=10m -run '^TestPAMStack_' -json ./test/e2e/... | \
            gotestsum --junitfile=test-results-tier3-pam-${{ matrix.backend }}.xml --raw-command -- cat

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier3-pam-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier3-pam-${{ matrix.backend }}
          path: test-results-tier3-pam-${{ matrix.backend }}.xml
          retention-days: 7

  e2e-summary:
    name: e2e results
    needs: [tier-1, tier-2, tier-3, tier-3-pam]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.tier-1.result != 'skipped' }}
    steps:
      - name: Summarize results
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tier 1 (wire) | ${{ needs.tier-1.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier 2 (browser) | ${{ needs.tier-2.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier 3 (sshd) | ${{ needs.tier-3.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier 3 (pam) | ${{ needs.tier-3-pam.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.tier-1.result }}" == "success" && "${{ needs.tier-2.result }}" == "success" && "${{ needs.tier-3.result }}" == "success" && "${{ needs.tier-3-pam.result }}" == "success" ]]; then
            echo "All tiers passed" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "One or more tiers failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # The weekly double check: the entire suite, unfiltered, five times, so
  # flakes surface here instead of in the PR gate. The only job that runs
  # on the schedule.
  weekly-extended:
    name: weekly extended tests
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -buildvcs=false -o bin/ ./cmd/...

      # The unfiltered suite needs every tier's prerequisites.
      - name: Ensure sshd and PAM build tools are available
        run: |
          apt-get update && apt-get install -y --no-install-recommends openssh-server gcc libpam0g-dev
          mkdir -p /run/sshd

      - name: Run extended test suite (5 iterations)
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        run: |
          go test -buildvcs=false -tags=e2e -count=5 -timeout=30m -json ./test/e2e/... | \
            gotestsum --junitfile=test-results-extended-${{ matrix.backend }}.xml --raw-command -- cat

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-extended-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-extended-${{ matrix.backend }}
          path: test-results-extended-${{ matrix.backend }}.xml
          retention-days: 7
