name: e2e

# The end-to-end merge gate (docs/e2e-testing-plan.md): a separate workflow
# from build-test.yaml because this one has a different runtime, different
# failure modes, and its own artifacts. It's the only job that checks the
# product rather than the parts.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end to end
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10

      # The Go build cannot compile without it: server/frontend embeds dist/.
      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -o bin/ ./cmd/...

      # Present on the hosted image, but asserting it beats a confusing
      # "no such file" three steps later.
      - name: Ensure sshd is available
        run: sudo apt-get install -y --no-install-recommends openssh-server

      - name: Run end-to-end tests
        run: go test -tags=e2e -count=1 -timeout=10m ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostics
          path: |
            test/e2e/_artifacts/**
          retention-days: 7
