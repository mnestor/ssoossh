name: e2e

# The end-to-end merge gate (docs/e2e-testing-plan.md): a separate workflow
# from build-test.yaml because this one has a different runtime, different
# failure modes, and its own artifacts. It's the only job that checks the
# product rather than the parts.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end to end
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: add required stuff
        run: |
          apt-get update && apt-get install -y sudo libatomic1 build-essential ca-certificates wget gnupg

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.6.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          version: 11

      # The Go build cannot compile without it: server/frontend embeds dist/.
      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -o bin/ ./cmd/...

      # Present on the hosted image, but asserting it beats a confusing
      # "no such file" three steps later.
      - name: Ensure sshd is available
        run: |
          apt-get install -y --no-install-recommends openssh-server
          # On a real host this directory is created by a systemd tmpfiles
          # rule at boot; this container never boots an init system, so sshd
          # fails with "Missing privilege separation directory" without it.
          mkdir -p /run/sshd

      # docs/e2e-testing-plan.md assumed a hosted ubuntu-latest runner, which
      # ships Chrome; this job runs in a bare ubuntu:24.04 container, and
      # Ubuntu's apt "chromium" package is a snap-transitional stub that
      # can't run without snapd. Install real Chrome from Google's repo.
      # Unlike the pinned actions/container image below, this floats on
      # whatever Google currently publishes as "stable" — same as a hosted
      # runner's preinstalled Chrome would, and chromedp has no fixed version
      # to pin against either.
      - name: Install Chrome for chromedp
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y --no-install-recommends google-chrome-stable

      - name: Run end-to-end tests
        run: go test -tags=e2e -count=1 -timeout=10m ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: e2e-diagnostics
          path: |
            test/e2e/_artifacts/**
          retention-days: 7
