name: e2e

# The end-to-end merge gate (docs/dev/e2e-testing-plan.md): the only workflow
# that checks the product rather than the parts.
#
# Tiers run as separate jobs so that "a break is reported at the layer it
# happened" -- job name alone tells you tier 1 (wire), tier 2 (browser),
# tier 3 (sshd) or multi-signer failed. The -run/-skip
# filters below are anchored and mutually exclusive, so every test in
# ./test/e2e runs in exactly one tier (multi-signer owns TestMultiSigner_
# and runs on the bare runner because its NATS scenario needs docker):
# tier 1 used to run the whole unfiltered suite, which
# both duplicated the other tiers and hard-failed on TestSSH because
# tier 1's container never installs sshd (the harness t.Fatals on missing
# prerequisites; it does not skip). Build is cached across tiers. No
# automatic retries (a retried e2e test is a test nobody trusts; flakes get
# quarantined).
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Weekly extended flake detection: the full suite at -count=5. PRs do
    # the day-to-day gating; this is the periodic double check.
    - cron: "0 3 * * 1" # 03:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern. Skipped
  # entirely on the weekly schedule, which cascades through `needs`: only
  # weekly-extended runs then.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/e2e.yaml'

  prepare:
    name: build artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # The Go build cannot compile without it: server/frontend embeds dist/.
      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -buildvcs=false -o bin/ ./cmd/...

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-binaries
          path: |
            bin/
            server/frontend/dist/

  tier-1:
    name: tier 1 (wire)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    # The 4m test timeout below plus about 2m of setup, with headroom.
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      # Artifacts do not keep file modes: every file comes back 0644.
      - name: Make the prebuilt binaries executable
        run: chmod +x bin/ssoosshd bin/ssoossh

      # -skip carves out exactly what the other tiers own (anchored, so
      # TestApprove_* stays here while TestApproval_* goes to tier 2).
      - name: Run tier 1 tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
          # The prepare job's binaries. Without this the harness builds its
          # own inside the first test, which took 5s to over a minute
          # depending on what the restored build cache held
          # (test/e2e/harness/binaries.go).
          SSOOSSH_E2E_BIN_DIR: bin
        # gotestsum runs go test itself so a test failure fails the step.
        # The previous `go test -json | gotestsum --raw-command -- cat` pipe
        # exited with cat's status: always 0, green CI over failing tests
        # (the default Actions shell has no pipefail).
        #
        # -timeout=4m: the suite took 220-300s while a quarter to a third of
        # its tests paid a 5s teardown stall and the first one built both
        # binaries (#116). Without those it ran in about 35s on sqlite and
        # 100s on postgres in the CI image locally. 4m is over double the
        # slower backend, still short enough to catch a hang or a suite
        # that doubles.
        run: |
          gotestsum --junitfile=test-results-tier1-${{ matrix.backend }}.xml -- \
            -buildvcs=false -tags=e2e -count=1 -timeout=4m -skip '^(TestApproval_|TestSSH_|TestMultiSigner_|TestMultiInstance_)' ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier1-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier1-${{ matrix.backend }}
          path: test-results-tier1-${{ matrix.backend }}.xml
          retention-days: 7

  tier-2:
    name: tier 2 (browser)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    timeout-minutes: 10
    # sqlite only. This tier exercises the browser approval flow, which does not
    # change behaviour with the storage backend -- tier 1 owns the
    # wire and persistence surface where it does, and weekly-extended
    # runs the whole suite against both. Running the matrix here cost a
    # job and a Postgres service container to re-prove tier 1's point.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      - name: Run tier 2 (browser) tests
        # gotestsum runs go test itself so a test failure fails the step
        # (see the tier 1 step for why the old pipe form did not).
        run: |
          gotestsum --junitfile=test-results-tier2.xml -- \
            -buildvcs=false -tags=e2e -count=1 -timeout=10m -run '^TestApproval_' ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier2
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier2
          path: test-results-tier2.xml
          retention-days: 7

  tier-3:
    name: tier 3 (sshd)
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    timeout-minutes: 15
    # sqlite only. This tier exercises a real sshd, which does not
    # change behaviour with the storage backend -- tier 1 owns the
    # wire and persistence surface where it does, and weekly-extended
    # runs the whole suite against both. Running the matrix here cost a
    # job and a Postgres service container to re-prove tier 1's point.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries
      # openssh-server ships in the build image; only the runtime directory
      # is missing. On a real host it is created by a systemd tmpfiles rule
      # at boot, and this container never boots an init system, so sshd
      # fails with "Missing privilege separation directory" without it.
      - name: Prepare sshd runtime directory
        run: mkdir -p /run/sshd

      - name: Run tier 3 (sshd) tests
        # gotestsum runs go test itself so a test failure fails the step
        # (see the tier 1 step for why the old pipe form did not).
        run: |
          gotestsum --junitfile=test-results-tier3.xml -- \
            -buildvcs=false -tags=e2e -count=1 -timeout=12m -run '^TestSSH_' ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-tier3
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-tier3
          path: test-results-tier3.xml
          retention-days: 7

  multi-signer:
    name: multi-signer
    needs: [changes, prepare]
    if: needs.changes.outputs.code == 'true'
    # Bare runner, not the build container: the split-signer and
    # multi-instance scenarios need the docker daemon for NATS, plus
    # sshd like the tier 3 job.
    # Go comes from setup-go instead of the image; the postgres service
    # publishes its port on localhost because there is no job container
    # network to join.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries

      - name: Ensure sshd is available
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd

      # Same version the build image ships (.github/docker/Dockerfile.runner);
      # the bare runner does not have it preinstalled.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # gotestsum runs go test itself so a test failure fails the step
      # (see the tier 1 step for why the old pipe form did not).
      - name: Run multi-signer and multi-instance tests
        env:
          SSOOSSH_E2E_POSTGRES_DSN: postgres://postgres:e2e@localhost:5432/e2e?sslmode=disable
        run: |
          gotestsum --junitfile=test-results-multi-signer.xml -- \
            -buildvcs=false -tags=e2e -count=1 -timeout=10m -run '^(TestMultiSigner_|TestMultiInstance_)' ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-multi-signer
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-multi-signer
          path: test-results-multi-signer.xml
          retention-days: 7

  # The one check name a ruleset needs for the PR gate. tier 1 is a matrix,
  # so it reports "tier 1 (wire) (sqlite)" and "(postgres)" when it runs but
  # only "tier 1 (wire)" when it is skipped; neither form is reported on
  # every PR. This job always reports on pull requests and pushes: success
  # when the path gate says e2e is not needed, or when the build and every
  # tier passed; failure otherwise. It depends on prepare as well, so a
  # failed build can't skip the tiers and pass by being skipped.
  e2e-summary:
    name: e2e results
    needs: [changes, prepare, tier-1, tier-2, tier-3, multi-signer]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PREPARE: ${{ needs.prepare.result }}
          TIER1: ${{ needs.tier-1.result }}
          TIER2: ${{ needs.tier-2.result }}
          TIER3: ${{ needs.tier-3.result }}
          MULTI: ${{ needs.multi-signer.result }}
        run: |
          {
            echo "## E2E Test Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Path gate | $CHANGES (e2e needed: $CODE) |"
            echo "| Build artifacts | $PREPARE |"
            echo "| Tier 1 (wire) | $TIER1 |"
            echo "| Tier 2 (browser) | $TIER2 |"
            echo "| Tier 3 (sshd) | $TIER3 |"
            echo "| Multi-signer | $MULTI |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGES" != success ]; then
            echo "The path gate did not succeed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo "No e2e-relevant changes: tiers skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for r in "$PREPARE" "$TIER1" "$TIER2" "$TIER3" "$MULTI"; do
            if [ "$r" != success ]; then
              echo "One or more jobs did not pass" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "All tiers passed" >> "$GITHUB_STEP_SUMMARY"

  # The weekly double check: the entire suite, unfiltered, five times, so
  # flakes surface here instead of in the PR gate. The only job that runs
  # on the schedule.
  weekly-extended:
    name: weekly extended tests
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -buildvcs=false -o bin/ ./cmd/...

      # The unfiltered suite needs every tier's prerequisites. openssh-server
      # ships in the build image; only sshd's runtime directory has to be
      # made here.
      - name: Prepare sshd runtime directory
        run: mkdir -p /run/sshd

      - name: Run extended test suite (5 iterations)
        env:
          SSOOSSH_E2E_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgres://postgres:e2e@postgres:5432/e2e?sslmode=disable' || '' }}
        # gotestsum runs go test itself so a test failure fails the step
        # (see the tier 1 step for why the old pipe form did not).
        run: |
          gotestsum --junitfile=test-results-extended-${{ matrix.backend }}.xml -- \
            -buildvcs=false -tags=e2e -count=5 -timeout=30m ./test/e2e/...

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-extended-${{ matrix.backend }}
          path: test/e2e/_artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-extended-${{ matrix.backend }}
          path: test-results-extended-${{ matrix.backend }}.xml
          retention-days: 7
