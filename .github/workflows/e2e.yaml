name: e2e

# The end-to-end merge gate (docs/e2e-testing-plan.md): a separate workflow
# from build-test.yaml because this one has a different runtime, different
# failure modes, and its own artifacts. It's the only job that checks the
# product rather than the parts.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end to end
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: add required stuff
        run: |
          apt-get update && apt-get install -y sudo libatomic1 build-essential ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.6.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          version: 11

      # The Go build cannot compile without it: server/frontend embeds dist/.
      - name: Build web UI
        run: make frontend

      - name: Build binaries
        run: go build -o bin/ ./cmd/...

      # Present on the hosted image, but asserting it beats a confusing
      # "no such file" three steps later.
      - name: Ensure sshd is available
        run: apt-get install -y --no-install-recommends openssh-server

      - name: Run end-to-end tests
        run: go test -tags=e2e -count=1 -timeout=10m ./test/e2e/...

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: e2e-diagnostics
          path: |
            test/e2e/_artifacts/**
          retention-days: 7
