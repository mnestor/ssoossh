# Classifies a pull request by whether it touches the CI image: the files
# under .github/docker/** and .github/workflows/build-image.yaml. Callers
# take two outputs:
#
#   image       - at least one changed file is an image file
#   image_only  - every changed file is an image file
#
# A PR that is image_only skips the rest of CI. Its jobs report as skipped
# (not pending), because the workflow still starts and the job-level `if`
# is what skips them; on.pull_request.paths would leave the checks absent.
#
# Outside pull_request (push, workflow_dispatch) both outputs are 'false', so
# everything runs as before. No checkout: dorny/paths-filter reads the PR's
# file list from the API.
name: pr-scope

on:
  workflow_call:
    outputs:
      image:
        description: "At least one changed file is an image file"
        value: ${{ jobs.scope.outputs.image }}
      image_only:
        description: "Every changed file is an image file"
        value: ${{ jobs.scope.outputs.image_only }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image == 'true' && 'true' || 'false' }}
      image_only: ${{ steps.filter.outputs.image == 'true' && steps.filter.outputs.other != 'true' && 'true' || 'false' }}
    steps:
      # some-with-excludes: a file is in `other` when it matches '**' and
      # none of the negated patterns. The positive '**' is required, since a
      # filter made only of negations never matches. The `image` filter has
      # no negations, so it behaves as the default 'some'.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            image:
              - '.github/docker/**'
              - '.github/workflows/build-image.yaml'
            other:
              - '**'
              - '!.github/docker/**'
              - '!.github/workflows/build-image.yaml'
