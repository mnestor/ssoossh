name: Resilience, Load, and Accessibility Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resilience:
    name: Resilience Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Build frontend
        run: |
          cd frontend
          CI=true pnpm install --frozen-lockfile
          CI=true pnpm build
      - name: Run resilience tests
        run: |
          CGO_ENABLED=1 go test -tags=resilience -race -count=1 -timeout=5m ./test/resilience/...

  load:
    name: Load and Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Build frontend
        run: |
          cd frontend
          CI=true pnpm install --frozen-lockfile
          CI=true pnpm build
      - name: Run load tests
        run: |
          CGO_ENABLED=1 go test -tags=load -race -count=1 -timeout=5m ./test/load/...

  a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd frontend
          CI=true pnpm install --frozen-lockfile
      - name: Run accessibility tests
        run: |
          cd frontend
          pnpm test
