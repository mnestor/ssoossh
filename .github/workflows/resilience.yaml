name: resilience

# Resilience, load/concurrency, frontend unit and accessibility suites.
# These jobs used to run `pnpm` on bare ubuntu-latest without ever
# installing node or pnpm, so none of them could actually run.
#
# The Accessibility job is a real gate over both halves of the product: an
# axe sweep of every frontend component, and an axe sweep of all 166 built
# pages of the documentation site. Before it, a job named `a11y` ran the
# whole vitest suite and nothing in it checked the documentation at all.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Kept only for the load job below, which is schedule-only. The
    # resilience and a11y jobs run on PRs and do not need a weekly repeat.
    - cron: "30 5 * * 1" # 05:30 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      docs: ${{ steps.filter.outputs.docs || 'true' }}
      migrations: ${{ steps.filter.outputs.migrations || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/resilience.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/resilience.yaml'
            docs:
              - 'user-docs/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/resilience.yaml'
            migrations:
              - 'server/resources/migrations/**'
              - 'test/migration/**'
              - 'test/postgres/**'
              - 'test/sqlite/**'
              - '.github/workflows/resilience.yaml'

  resilience:
    name: Resilience Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # The server package embeds server/frontend/dist.
      - name: Build web UI
        run: make frontend
      - name: Run resilience tests
        run: CGO_ENABLED=1 go test -buildvcs=false -tags=resilience -race -count=1 -timeout=5m ./test/resilience/...

  # Schedule and manual dispatch only. Two of these tests hold the server
  # under sustained load for SSOOSSH_SOAK_DURATION each, which is a poor
  # fit for a per-PR gate: it is the slowest job in the workflow and the
  # class of regression it catches does not arrive one PR at a time.
  load:
    name: Load and Concurrency Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Build web UI
        run: make frontend
      # 10m, not the 5m the other suites get: two sustained-load tests hold
      # the server under continuous load for SSOOSSH_SOAK_DURATION each
      # (30s by default, see test/load/soak_test.go) on top of the
      # concurrency and burst tests.
      - name: Run load tests
        run: CGO_ENABLED=1 go test -buildvcs=false -tags=load -race -count=1 -timeout=10m ./test/load/...

  # SQLite/Postgres schema parity. This suite existed and was wired into no
  # workflow at all, on the reasoning that the e2e tier-1 matrix already runs
  # both backends -- but that proves the app works on each, which is a
  # different claim from the two schemas agreeing. A column present on
  # Postgres and missing on SQLite passes e2e right up until something reads
  # it.
  #
  # Bare runner, not the build container: test/postgres brings its own
  # postgres up with `docker run`, so it needs a daemon rather than a
  # services: block. SSOOSSH_REQUIRE_DOCKER makes a missing daemon fail the
  # job instead of skipping every test and reporting green.
  migrations:
    name: Migration Parity
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run migration parity tests
        env:
          SSOOSSH_REQUIRE_DOCKER: "1"
        run: go test -buildvcs=false -tags=dbparity -count=1 -timeout=10m ./test/migration/...

  frontend:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      # The whole vitest suite, including the accessibility sweep. This job
      # used to be called `a11y` for the one file in it that was about
      # accessibility, which is why the frontend suite was widely believed to
      # run nowhere -- people looked for a "frontend tests" job and there was
      # not one. Renamed to what it is; the accessibility gate that used to
      # be implied by the name is now the separate job below.
      #
      # test:coverage rather than test: the v8 provider and its excludes were
      # already configured in vite.config.ts and nothing ever invoked them, so
      # frontend coverage was collectable and collected by nobody. Running the
      # suite with it costs nothing extra -- it is the same run.
      - name: Run frontend unit tests
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # The accessibility gate, in one job over both halves of the product.
  #
  # There was a job named `a11y` before this one, and it ran the whole vitest
  # suite -- of which exactly one file, ConsentModal.a11y.test.ts, asserted
  # anything about accessibility. Thirty-odd components and all 166 pages of
  # the documentation site were checked by nothing, which is how a Level A
  # defect in TypeBadge (an aria-label on a role that prohibits it, so no
  # certificate type had a text alternative anywhere in the app) survived
  # until somebody read the source.
  #
  # Two steps, because the two halves fail differently: a component sweep
  # catches a bad control the day it is written, and a build-output sweep
  # catches what a static site generator and its plugins emit around content
  # nobody in this repository wrote by hand.
  a11y:
    name: Accessibility
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # An axe pass over every component the app renders. The roster test in
      # that file fails the build when a component is added to
      # frontend/src/lib/components without a case, so the sweep cannot
      # silently fall behind the directory it covers.
      - name: Frontend component sweep
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          corepack enable
          CI=true pnpm install --frozen-lockfile
          pnpm exec vitest run src/lib/components/a11y.test.ts src/lib/components/ConsentModal.a11y.test.ts

      # An axe pass over the built documentation site. Runs against dist
      # rather than a dev server, so it sees exactly what GitHub Pages will
      # serve -- Starlight's chrome, starlight-openapi's generated reference,
      # and the mermaid diagrams' markup included.
      - name: Documentation site sweep
        if: needs.changes.outputs.docs == 'true'
        working-directory: user-docs
        run: |
          npm ci
          npm run build:a11y
