name: resilience

# Resilience, load/concurrency, frontend unit and accessibility suites.
# These jobs used to run `pnpm` on bare ubuntu-latest without ever
# installing node or pnpm, so none of them could actually run.
#
# The Accessibility job is a real gate over both halves of the product: an
# axe sweep of every frontend component, and an axe sweep of all 166 built
# pages of the documentation site. Before it, a job named `a11y` ran the
# whole vitest suite and nothing in it checked the documentation at all.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Kept only for the load job below, which is schedule-only. The
    # resilience and a11y jobs run on PRs and do not need a weekly repeat.
    - cron: "30 5 * * 1" # 05:30 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      docs: ${{ steps.filter.outputs.docs || 'true' }}
      postgres: ${{ steps.filter.outputs.postgres || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/resilience.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/resilience.yaml'
            docs:
              - 'user-docs/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/resilience.yaml'
            # Any Go change can change a query, and a migration changes
            # the schema every DB-backed test runs on. The goldens are
            # listed because they are not Go files.
            postgres:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'server/resources/migrations/**'
              - 'test/migration/testdata/**'
              - 'Makefile'
              - '.github/workflows/resilience.yaml'

  resilience:
    name: Resilience Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # The server package embeds server/frontend/dist.
      - name: Build web UI
        run: make frontend
      - name: Run resilience tests
        run: CGO_ENABLED=1 go test -buildvcs=false -tags=resilience -race -count=1 -timeout=5m ./test/resilience/...
      # What a failing test left behind: the browser's screenshot, URL, HTML
      # and console, and the full ssoosshd log (test/e2e/harness writes them
      # under the package's _artifacts directory). Without these a flaky
      # browser test (#169) left nothing but a timeout line to go on.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-diagnostics
          path: test/resilience/_artifacts/
          retention-days: 7

  # Schedule and manual dispatch only. Two of these tests hold the server
  # under sustained load for SSOOSSH_SOAK_DURATION each, which is a poor
  # fit for a per-PR gate: it is the slowest job in the workflow and the
  # class of regression it catches does not arrive one PR at a time.
  load:
    name: Load and Concurrency Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Build web UI
        run: make frontend
      # 10m, not the 5m the other suites get: two sustained-load tests hold
      # the server under continuous load for SSOOSSH_SOAK_DURATION each
      # (30s by default, see test/load/soak_test.go) on top of the
      # concurrency and burst tests.
      - name: Run load tests
        run: CGO_ENABLED=1 go test -buildvcs=false -tags=load -race -count=1 -timeout=10m ./test/load/...

  # The whole Go suite again, on Postgres. codecover.yaml's codecheck runs
  # it on SQLite; this is the other half, so a query that behaves
  # differently on the two backends (collation, LIKE, time precision,
  # constraint errors) fails a PR instead of production. Every DB-backed
  # test takes its database from test/testdb, which gives each one a fresh
  # database on this server, so a new test runs here with no workflow edit.
  # It also carries what the Migration Parity job used to run on its own:
  # the schema parity tests, the goldens and the migrations' data repairs
  # in test/migration.
  #
  # Same image and Postgres version as e2e tier 1. `make test-postgres` is
  # the local equivalent.
  postgres:
    name: Postgres Tests
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dbparity tag used to hide Postgres-only tests from every run but
      # one. Nothing builds with it any more, so a file still carrying it
      # would compile nowhere and pass silently: refuse it instead. Before
      # the web UI build, so node_modules is not there to search.
      - name: Refuse the retired dbparity build tag
        run: |
          if grep -rlE --include='*.go' '^//go:build .*dbparity' .; then
            echo "::error::the dbparity build tag is retired: delete the //go:build line and call testdb.SkipOnSQLite (test/testdb) instead"
            exit 1
          fi

      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # server/frontend embeds server/frontend/dist.
      - name: Build web UI
        run: make frontend

      # The DSN names the server, not a database: test/testdb creates and
      # drops one per test on it.
      - name: Run the Go suite on Postgres
        env:
          SSOOSSH_TEST_DB: postgres
          SSOOSSH_TEST_POSTGRES_DSN: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
        run: CGO_ENABLED=1 go test -buildvcs=false -count=1 -timeout=15m ./...

  frontend:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      # The whole vitest suite, including the accessibility sweep. This job
      # used to be called `a11y` for the one file in it that was about
      # accessibility, which is why the frontend suite was widely believed to
      # run nowhere -- people looked for a "frontend tests" job and there was
      # not one. Renamed to what it is; the accessibility gate that used to
      # be implied by the name is now the separate job below.
      #
      # test:coverage rather than test: the v8 provider and its excludes were
      # already configured in vite.config.ts and nothing ever invoked them, so
      # frontend coverage was collectable and collected by nobody. Running the
      # suite with it costs nothing extra -- it is the same run.
      - name: Run frontend unit tests
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # The accessibility gate, in one job over both halves of the product.
  #
  # There was a job named `a11y` before this one, and it ran the whole vitest
  # suite -- of which exactly one file, ConsentModal.a11y.test.ts, asserted
  # anything about accessibility. Thirty-odd components and all 166 pages of
  # the documentation site were checked by nothing, which is how a Level A
  # defect in TypeBadge (an aria-label on a role that prohibits it, so no
  # certificate type had a text alternative anywhere in the app) survived
  # until somebody read the source.
  #
  # Two steps, because the two halves fail differently: a component sweep
  # catches a bad control the day it is written, and a build-output sweep
  # catches what a static site generator and its plugins emit around content
  # nobody in this repository wrote by hand.
  a11y:
    name: Accessibility
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # An axe pass over every component the app renders. The roster test in
      # that file fails the build when a component is added to
      # frontend/src/lib/components without a case, so the sweep cannot
      # silently fall behind the directory it covers.
      - name: Frontend component sweep
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          corepack enable
          CI=true pnpm install --frozen-lockfile
          pnpm exec vitest run src/lib/components/a11y.test.ts src/lib/components/ConsentModal.a11y.test.ts

      # An axe pass over the built documentation site. Runs against dist
      # rather than a dev server, so it sees exactly what GitHub Pages will
      # serve -- Starlight's chrome, starlight-openapi's generated reference,
      # and the mermaid diagrams' markup included.
      - name: Documentation site sweep
        if: needs.changes.outputs.docs == 'true'
        working-directory: user-docs
        run: |
          npm ci
          npm run build:a11y
