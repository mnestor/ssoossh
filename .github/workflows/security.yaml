name: security

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Catches new CVEs/advisories landing against unchanged dependencies --
    # the other triggers only re-scan when a push or PR happens to occur.
    - cron: "0 6 * * 1" # 06:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern. Scanners are
  # gated separately: a frontend lockfile bump doesn't need govulncheck.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'frontend/**'
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - '.semgrep.yaml'
              - '.github/workflows/security.yaml'

  # All three scanners are advisory (findings don't fail the job) but no
  # longer invisible: each one tees its real output into the job summary,
  # uploads it as an artifact, and the report job below aggregates
  # everything into a single PR comment. The old summary steps read
  # `steps.<id>.outputs.result`, which plain run steps never set, so every
  # summary rendered empty.
  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      # server/frontend embeds dist/*; without at least a placeholder the
      # package loader fails before the scan starts.
      - name: Generate placeholder embeds
        run: go generate ./...
      - name: Run govulncheck
        id: scan
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... 2>&1 | tee govulncheck.txt
      - name: Add results to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## govulncheck (${{ steps.scan.outcome }})"
            echo '```'
            head -c 60000 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-govulncheck
          path: govulncheck.txt
          retention-days: 7

  pnpm-audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ubuntu-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile
      - name: pnpm audit
        id: scan
        continue-on-error: true
        run: pnpm audit --audit-level high 2>&1 | tee audit.txt
      - name: Add results to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## pnpm audit (${{ steps.scan.outcome }})"
            echo '```'
            head -c 60000 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-pnpm-audit
          path: frontend/audit.txt
          retention-days: 7

  semgrep:
    name: semgrep
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        id: scan
        continue-on-error: true
        run: semgrep scan --config auto --error 2>&1 | tee semgrep.txt
      - name: Add results to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## semgrep (${{ steps.scan.outcome }})"
            echo '```'
            head -c 60000 semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-semgrep
          path: semgrep.txt
          retention-days: 7

  # One sticky comment per PR with all three scanners' output, updated in
  # place on each push rather than stacking a new comment per run.
  report:
    name: PR report
    needs: [govulncheck, pnpm-audit, semgrep]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download scanner results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results
          pattern: security-*

      - name: Build and post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Security scan results"
            echo ""
            for scanner in govulncheck pnpm-audit semgrep; do
              file=$(find "results/security-${scanner}" -type f 2>/dev/null | head -1)
              echo "<details><summary>${scanner}</summary>"
              echo ""
              echo '```'
              if [ -n "$file" ]; then
                head -c 15000 "$file"
              else
                echo "did not run (skipped by path filter or job failure)"
              fi
              echo '```'
              echo "</details>"
              echo ""
            done
            echo "_Full output on each job's summary page._"
          } > comment.md
          gh pr comment "$PR" -R "$REPO" --edit-last --create-if-none --body-file comment.md \
            || gh pr comment "$PR" -R "$REPO" --body-file comment.md
