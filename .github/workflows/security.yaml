name: security

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Catches new CVEs/advisories landing against unchanged dependencies —
    # the other triggers only re-scan when a push or PR happens to occur.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: "go.mod"
          go-package: ./...

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: semgrep scan
        run: semgrep scan --config auto --error
