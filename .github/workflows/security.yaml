name: security

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Catches new CVEs/advisories landing against unchanged dependencies --
    # the other triggers only re-scan when a push or PR happens to occur.
    # One of only two schedules left in the repo, and it earns its slot:
    # nothing else re-checks dependencies that nobody touched.
    - cron: "0 6 * * 1" # 06:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate; see build.yaml's changes job for the pattern. Scanners are
  # gated separately: a frontend lockfile bump doesn't need govulncheck.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'frontend/**'
              - '.semgrepignore'
              - '.github/workflows/security.yaml'

  # govulncheck and pnpm audit stay advisory: both report on dependencies
  # you may not be able to fix in the same PR that surfaces them, so they
  # tee their output into the job summary and the PR comment below rather
  # than blocking. semgrep is different -- see that job.
  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the module/build caching setup-go provided before the Go
      # toolchain moved into the runner image.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # No frontend build needed: server/frontend embeds dist/* via
      # `//go:embed all:dist/*`, and the tracked dist/.gitignore is what
      # makes that pattern match on a clean checkout.
      - name: Run govulncheck
        id: scan
        continue-on-error: true
        # govulncheck is baked into the build image (see
        # .github/docker/Dockerfile.runner, GOVULNCHECK_VERSION); `go run`
        # here recompiled it from source on every run.
        run: govulncheck ./... 2>&1 | tee govulncheck.txt
      - name: Add results to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## govulncheck (${{ steps.scan.outcome }})"
            echo '```'
            head -c 60000 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-govulncheck
          path: govulncheck.txt
          retention-days: 7

  pnpm-audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/mnestor/ssoossh-build:latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile
      - name: pnpm audit
        id: scan
        continue-on-error: true
        run: pnpm audit --audit-level high 2>&1 | tee audit.txt
      - name: Add results to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## pnpm audit (${{ steps.scan.outcome }})"
            echo '```'
            head -c 60000 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-pnpm-audit
          path: frontend/audit.txt
          retention-days: 7

  # Blocking, frontend-only, and pinned. Each of those is deliberate:
  #
  # Blocking, because an advisory-forever scanner trains you to skip the PR
  # comment that also carries govulncheck.
  #
  # Frontend-only, because gosec (inside golangci-lint, see lint.yaml)
  # already gates the Go side. Pointing semgrep at Go too just re-litigates
  # the same findings in a second tool. Note semgrep has no Svelte parser,
  # so this covers the hand-written .ts under frontend/src, not the .svelte
  # components -- eslint and svelte-check own those.
  #
  # Pinned to an exact image version rather than `latest`, and to named
  # rule packs rather than `--config auto`, because a gate has to be
  # reproducible: `auto` selects rulesets from repo contents at scan time,
  # so which rules ran could change with no commit here and turn a green PR
  # red. The packs still track upstream between image bumps; that residual
  # drift is accepted, the wholesale kind was not. Bumping the tag is a
  # reviewable commit.
  semgrep:
    name: semgrep
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        run: |
          semgrep scan --error --metrics=off \
            --config p/typescript \
            --config p/javascript \
            frontend/src

  # One sticky comment per PR with the advisory scanners' output, updated in
  # place on each push rather than stacking a new comment per run. semgrep
  # is not here: it fails the build directly, so its findings are on the
  # check, not in a comment.
  report:
    name: PR report
    needs: [govulncheck, pnpm-audit]
    # Same-repo PRs only. A fork's GITHUB_TOKEN is capped read-only no
    # matter what `pull-requests: write` below asks for, so `gh pr comment`
    # 403s and takes the || fallback down with it, failing the job for a
    # contributor who cannot fix it. Fork PRs still get the scan output on
    # each job's summary page.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download scanner results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results
          pattern: security-*

      - name: Build and post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Security scan results"
            echo ""
            for scanner in govulncheck pnpm-audit; do
              file=$(find "results/security-${scanner}" -type f 2>/dev/null | head -1)
              echo "<details><summary>${scanner}</summary>"
              echo ""
              echo '```'
              if [ -n "$file" ]; then
                head -c 15000 "$file"
              else
                echo "did not run (skipped by path filter or job failure)"
              fi
              echo '```'
              echo "</details>"
              echo ""
            done
            echo "_semgrep is a blocking check, not reported here._"
            echo "_Full output on each job's summary page._"
          } > comment.md
          gh pr comment "$PR" -R "$REPO" --edit-last --create-if-none --body-file comment.md \
            || gh pr comment "$PR" -R "$REPO" --body-file comment.md
