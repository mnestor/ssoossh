# Builds the user documentation site (user-docs/, Astro Starlight) and
# deploys it to GitHub Pages.
#
# The configuration reference pages under user-docs/src/content/docs/
# reference/config are generated by `make confdocs`, the CLI reference under
# reference/cli by `make clidocs`, and both are committed, so this workflow
# needs only Node -- the confdocs-check and clidocs-check steps in the build
# workflow are what keep those pages honest against the Go source. The HTTP
# API reference is rendered at build time from docs/openapi.yaml, which is
# why that file is a trigger too.
name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "user-docs/**"
      - "docs/openapi.yaml"
      - ".github/workflows/docs-site.yaml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes a queued one but
# never cancels a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages is not available on private repos without a paid plan, so skip
    # (rather than fail) until the repo goes public; deploys then start on
    # their own, no edit needed. `needs: build` skips the deploy job with it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: user-docs/package-lock.json

      - name: Install dependencies
        working-directory: user-docs
        run: npm ci

      - name: Build site
        working-directory: user-docs
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: user-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
