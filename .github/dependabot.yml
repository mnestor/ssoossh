version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all Go module updates instead of one per package. Groups
    # apply to version updates only by default, so security fixes get their
    # own group or they arrive as one PR per package.
    groups:
      go:
        patterns:
          - "*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all frontend updates instead of one per package, and one
    # for all security fixes.
    groups:
      frontend:
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # typescript-eslint cannot load TS 7 (it refuses at startup:
    # "typescript-eslint does not support TS 7.0"), which broke `pnpm lint`
    # for every PR after the 6.0.3 -> 7.0.2 group bump. Hold typescript at
    # its current major until typescript-eslint supports >=7.1
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940),
    # then drop this ignore.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/user-docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all docs-site updates instead of one per package, and one
    # for all security fixes.
    groups:
      user-docs:
        patterns:
          - "*"
      user-docs-security:
        applies-to: security-updates
        patterns:
          - "*"
    # astro-mermaid 2.1.0 (latest) peers on mermaid ^10 || ^11, so a
    # mermaid 12 bump fails `npm ci` with ERESOLVE. Hold mermaid at its
    # current major until astro-mermaid supports 12, then drop this ignore.
    ignore:
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all action bumps instead of one per action, and one for
    # all security fixes.
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
