version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all Go module updates instead of one per package.
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all frontend updates instead of one per package.
    groups:
      frontend:
        patterns:
          - "*"
    # typescript-eslint cannot load TS 7 (it refuses at startup:
    # "typescript-eslint does not support TS 7.0"), which broke `pnpm lint`
    # for every PR after the 6.0.3 -> 7.0.2 group bump. Hold typescript at
    # its current major until typescript-eslint supports >=7.1
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940),
    # then drop this ignore.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR for all action bumps instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
