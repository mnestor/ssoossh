# OpenAPI specification linting configuration for ssoosshd.
#
# Known exceptions are recorded with comments explaining why they are acceptable.
# This allows `make openapi-lint` to fail on new issues while recording pre-existing ones.

rules:
  # Servers must be present: The API is served at / and client/web UI both
  # address the same server, so an explicit servers list is redundant.
  # The OpenAPI consumer already knows where to find the server.
  no-empty-servers: off

  # Every operation should have security defined: The API has mixed auth —
  # /api/certs/* endpoints are unauthenticated (request ID is the capability),
  # /api/users/* are authenticated (session cookie), and health/liveness probes
  # define no auth by design. The per-endpoint @Security swag annotations
  # correctly capture this; the blanket warning is a false positive.
  security-defined: off

  # Operation must have at least one 2XX response: Health and liveness probes
  # have no error cases by design — they return 200 to signal the server is up.
  # Authentication redirects (e.g., /auth/login) return 302 by design.
  # These are exceptions to the rule, not violations.
  operation-2xx-response: off

  # Operation must have at least one 4XX response: Health and liveness probes
  # have no error cases by design. Auth endpoints are part of the OIDC flow
  # and predate the {data, error} envelope convention, so they document what
  # they actually return rather than the envelope schema.
  operation-4xx-response: off

  # Operation object should contain operationId: Health, liveness, and
  # auth endpoints are tooling-facing (probes, OIDC redirects) rather than
  # API-facing. operationId is not needed for those endpoints.
  operation-operationId: off
